    // ═══ GARMIN .FIT WORKOUT EXPORT ═══
    // Short ASCII workout name for the watch list, e.g. "Sostenido 29/10", "Cuestas 2/11".
    function fitWorkoutName(s) {
      const txt = String(s.notes || '').toLowerCase();
      const [, mm, dd] = String(s.dateISO).split('-').map(Number);
      const kind = s.type === 'tempo' ? (/espec[ií]fico|recorrido/.test(txt) ? 'Recorrido' : 'Sostenido')
        : s.type === 'intervals' ? (/cuesta/.test(txt) ? 'Cuestas' : 'Interv')
        : s.type === 'long' ? 'Larga' : s.type === 'easy' ? 'Facil'
        : (/chaleco|caminata/.test(txt) ? 'Marcha' : 'Sesion');
      return `${kind} ${dd}/${mm}`;
    }
    function exportSessionToGarmin(day) {
      const s = state.plan.find(p => p.day === day);
      if (!s || s.type === 'rest') return;
      try {
        const lthr = state.profile?.lthr || 174;
        const steps = generateStructuredSteps(s, lthr);
        if (!steps.length || steps.planParsed === 'approx' || steps.planParsed === 'none') { showToast(getLang()==='es' ? 'Esta sesión no tiene pasos exactos para el reloj.' : 'No exact steps for the watch.'); return; }
        const fitBytes = buildFitWorkout({ name: s.notes ? fitWorkoutName(s) : sessionTitle(s), steps });
        const blob = new Blob([fitBytes], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = s.notes ? `FitCoach_${s.dateISO}_${fitAscii(fitWorkoutName(s).split(' ')[0]).toLowerCase()}.fit` : `Day${s.day}-${s.type}.fit`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(t('toast_fit_downloaded'));
      } catch (err) {
        console.error('FIT export error:', err);
        showToast(t('toast_export_failed'));
      }
    }

    // Build negative-split mile targets: start slightly conservative, finish strong.
    // Standard approach: first mile +3%, middle mile(s) at goal pace, last segment -3%.
    function buildNegativeSplitPlan(goalSec, raceMeters) {
      // Works for any distance: full miles + a final partial. For a 5K this reproduces the
      // original plan (Mi 1 / Mi 2 / Mi 3 / Final 0.1).
      const meters = raceMeters || 5000;
      const totalMi = meters / 1609.344;
      const goalPaceSec = goalSec / totalMi; // sec/mi
      const n = Math.max(1, Math.floor(totalMi));
      const notes = {
        first: { en: 'Controlled start — resist the urge to go out fast', es: 'Salida controlada — resiste el impulso de salir rápido' },
        mid:   { en: 'Settle into goal pace', es: 'Asiéntate en el pace objetivo' },
        late:  { en: 'Hold form, stay relaxed', es: 'Mantén la forma, relajado' },
        end:   { en: 'Empty the tank', es: 'Vacía el tanque' }
      };
      const miles = [];
      for (let i = 1; i <= n; i++) {
        const isFirst = i === 1, isLast = i === n && n > 1;
        miles.push({ label: 'Mi ' + i, factor: isFirst ? 1.03 : (isLast ? 0.99 : 1.00), note: isFirst ? notes.first : (isLast ? notes.late : notes.mid) });
      }
      const rem = totalMi - n;
      if (rem > 0.03) miles.push({ label: 'Final ' + rem.toFixed(1), factor: 0.95, note: notes.end });
      return miles.map(m => ({ ...m, paceSec: Math.round(goalPaceSec * m.factor) }));
    }

    function buildHydrationPlan(weightLb, estimatedMinutes, tempF) {
      // ACSM guidance: 16-24oz/hr in heat for runs over 30 min; pre-hydrate 16-20oz 2-3hr before
      const heatFactor = (tempF && tempF > 85) ? 1.15 : 1.0;
      const ozPerHour = Math.round(20 * heatFactor);
      const totalOz = Math.round((estimatedMinutes / 60) * ozPerHour);
      return {
        preRaceOz: 16,
        preRaceHoursBefore: 2,
        duringOzPerHour: ozPerHour,
        totalDuringOz: totalOz,
        electrolyteNote: estimatedMinutes > 45
      };
    }

    function buildRaceStrategyData() {
      const profile = state.profile;
      if (!profile) return null;
      const lang = getLang();
      const isEs = lang === 'es';
      const raceM = raceMetersByKey(profile.raceDistanceKey || '5k');
      const goalSec = activeGoalSec(profile, raceM);
      const goalPaceSecPerMi = goalSec / (raceM / 1609.344);
      const estimatedMinutes = Math.ceil(goalSec / 60) + 5; // buffer for warmup-adjacent pacing
      const splits = buildNegativeSplitPlan(goalSec, raceM);
      const hydration = buildHydrationPlan(profile.weightLb, goalSec / 60, 88);
      const daysOut = daysUntil(profile.raceDateISO);

      return {
        athleteName: profile.name,
        raceDateISO: profile.raceDateISO,
        daysOut,
        goalTimeStr: fmtRaceTime(goalSec),
        raceLabel: (activeRace()?.name) || raceLabelByKey(profile.raceDistanceKey || '5k'),
        goalPaceStr: fmtPace(goalPaceSecPerMi),
        lthr: profile.lthr,
        splits,
        hydration,
        isEs
      };
    }

      const a = document.createElement('a');

    // ── 1. FULL BACKUP (JSON) — the single most important safeguard ──
    function exportFullBackup() {
      const payload = {
        app: 'FitCoach5K_Tactical',
        schemaVersion: SCHEMA_VERSION,
        exportedAt: new Date().toISOString(),
        state: state
      };
      const json = JSON.stringify(payload, null, 2);
      downloadBlob(json, `fitcoach_backup_${todayISO()}.json`, 'application/json');
      state.lastBackupISO = todayISO();
      saveState();
      render();
      showToast(getLang()==='es' ? '✓ Backup completo descargado' : '✓ Full backup downloaded');
    }

    function triggerBackupImport() {
      document.getElementById('backupImportInput')?.click();
    }

    async function handleBackupImport(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const text = await readFileAsText(file);
        const parsed = JSON.parse(text);
        // Accept either the wrapped payload or a raw state object.
        const incoming = parsed.state ? parsed.state : parsed;
        if (!incoming || typeof incoming !== 'object' || (!incoming.profile && !incoming.tcxSessions)) {
          showToast(getLang()==='es' ? '✕ Archivo de backup inválido' : '✕ Invalid backup file');
          event.target.value = '';
          return;
        }
        const confirmMsg = getLang()==='es'
          ? 'Esto REEMPLAZARÁ todos tus datos actuales (perfil, plan, actividades, medidas) con los del backup. ¿Continuar?'
          : 'This will REPLACE all your current data (profile, plan, activities, measurements) with the backup. Continue?';
        if (!confirm(confirmMsg)) { event.target.value = ''; return; }
        state = { ...DEFAULT_STATE, ...incoming, schemaVersion: SCHEMA_VERSION };
        state.settings = { ...DEFAULT_STATE.settings, ...(incoming.settings || {}) };
        ensureGear();
        saveState();
        currentView = state.profile?.onboardingComplete ? 'home' : 'onboarding';
        detailOverlay = null;
        _scrollToTopNextRender = true;
        render();
        showToast(getLang()==='es' ? '✓ Backup restaurado' : '✓ Backup restored');
      } catch (err) {
        console.error('Backup import error:', err);
        showToast(getLang()==='es' ? '✕ No se pudo leer el backup' : '✕ Could not read backup');
      }
      event.target.value = '';
    }

    // ── 2. EXCEL EXPORTS (via HTML-table .xls — opens natively in Excel, no CDN dependency) ──
    function htmlTableToXls(title, headers, rows) {
      const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const thead = `<tr>${headers.map(h=>`<th style="background:#3d5a1f;color:#fff;font-weight:bold;border:1px solid #999;padding:4px;">${esc(h)}</th>`).join('')}</tr>`;
      const tbody = rows.map(r => `<tr>${r.map(c=>`<td style="border:1px solid #ccc;padding:4px;">${esc(c)}</td>`).join('')}</tr>`).join('');
      return `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><title>${esc(title)}</title></head>`
        + `<body><table>${thead}${tbody}</table></body></html>`;
    }

    function exportActivitiesExcel() {
      if (!state.tcxSessions.length) { showToast(getLang()==='es'?'Sin actividades para exportar':'No activities to export'); return; }
      const es = getLang()==='es';
      const headers = es
        ? ['Fecha','Tipo','Distancia (mi)','Tiempo','Pace (/mi)','FC prom','FC máx','Grado','VDOT','Decoupling %','Cadencia SPM','Temp °F','Humedad %','RPE','Notas']
        : ['Date','Type','Distance (mi)','Time','Pace (/mi)','Avg HR','Max HR','Grade','VDOT','Decoupling %','Cadence SPM','Temp °F','Humidity %','RPE','Notes'];
      const sorted = [...state.tcxSessions].sort((a,b)=>(a.dateISO||'').localeCompare(b.dateISO||''));
      const rows = sorted.map(s => {
        const mf = s.manualFields || {};
        const a = s.analysis || {};
        const temp = s.hasTempData ? s.avgTempF : (mf.wxAvgTempF ?? '');
        return [
          s.dateISO,
          mf.trainingType ? (SESSION_TYPE_LABELS[mf.trainingType] || mf.trainingType) : '',
          (s.totalDistMi||0).toFixed(2),
          secToHHMMSS(s.totalTimeSec),
          secToMMSS(s.avgPaceSecPerMi),
          s.avgHR ?? '',
          s.maxHR ?? '',
          a.sessionGrade ?? '',
          a.vdot ?? '',
          a.aerobicDecouplingPct != null ? a.aerobicDecouplingPct.toFixed(1) : '',
          s.avgCadenceSpm ?? '',
          temp,
          mf.humidity ?? '',
          mf.rpe ?? '',
          (mf.athleteNotes || mf.sessionGoal || '').replace(/\n/g,' ')
        ];
      });
      const xls = htmlTableToXls('FitCoach Activities', headers, rows);
      downloadBlob('\ufeff'+xls, `fitcoach_activities_${todayISO()}.xls`, 'application/vnd.ms-excel');
      showToast(es ? '✓ Excel de actividades descargado' : '✓ Activities Excel downloaded');
    }

    function exportBodyMeasurementsExcel() {
      if (!state.bodyMeasurements.length) { showToast(getLang()==='es'?'Sin medidas para exportar':'No measurements to export'); return; }
      const es = getLang()==='es';
      const measCols = BODY_MEASURE_DEFS.flatMap(def => {
        const name = def.label[es ? 'es' : 'en'] || def.label.en;
        return [`${name} (cm)`, `${name} (${es?'pulg':'in'})`];
      });
      const headers = [
        es ? 'Fecha' : 'Date',
        es ? 'Peso (lb)' : 'Weight (lb)',
        ...measCols,
        es ? 'Notas' : 'Notes'
      ];
      const sorted = [...state.bodyMeasurements].sort((a,b)=>(a.dateISO||'').localeCompare(b.dateISO||''));
      const rows = sorted.map(m => [
        m.dateISO,
        (m.weightLb ?? '').toString(),
        ...BODY_MEASURE_DEFS.flatMap(def => {
          const cm = m[def.field];
          return [cm != null ? cm.toFixed(1) : '', cm != null ? (cm/2.54).toFixed(1) : ''];
        }),
        (m.notes||'').replace(/\n/g,' ')
      ]);

    // ── 3. WEEKLY / MONTHLY PDF REPORT (printable, via pdf-lib) ──
    async function generatePeriodReportPDF(period) {
      // period: 'week' | 'month'
      if (!window.PDFLib) { showToast(getLang()==='es'?'✕ Librería PDF no cargó':'✕ PDF library not loaded'); return; }
      const es = getLang()==='es';
      const days = period === 'month' ? 30 : 7;
      const cut = new Date(); cut.setDate(cut.getDate() - days);
      const cutISO = cut.toISOString().split('T')[0];
      const acts = state.tcxSessions.filter(s => (s.dateISO||'') >= cutISO).sort((a,b)=>(a.dateISO||'').localeCompare(b.dateISO||''));
      if (!acts.length) { showToast(es?'Sin actividades en el periodo':'No activities in this period'); return; }

      const { PDFDocument, rgb, StandardFonts } = window.PDFLib;
      try {
        const doc = await PDFDocument.create();
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const fontBold = await doc.embedFont(StandardFonts.HelveticaBold);
        let page = doc.addPage([612, 792]);
        const { width, height } = page.getSize();
        const colFieldDark = rgb(0.067,0.082,0.051), colOlive = rgb(0.239,0.353,0.122),
              colCoyote = rgb(0.788,0.663,0.380), colPaper = rgb(0.16,0.16,0.14),
              colDim = rgb(0.45,0.45,0.42), colBlue = rgb(0.2,0.5,0.75), colAmber = rgb(0.85,0.6,0.15);
        const marginX = 50; const contentW = width - marginX*2;
        let y = height - 50;

        // Header
        page.drawRectangle({ x:0, y:height-80, width, height:80, color: colFieldDark });
        page.drawRectangle({ x:0, y:height-82, width, height:3, color: colCoyote });
        page.drawText(es ? (period==='month'?'REPORTE MENSUAL DE ENTRENAMIENTO':'REPORTE SEMANAL DE ENTRENAMIENTO')
                          : (period==='month'?'MONTHLY TRAINING REPORT':'WEEKLY TRAINING REPORT'),
          { x: marginX, y: height-38, size: 16, font: fontBold, color: rgb(0.91,0.89,0.85) });
        page.drawText(`${state.profile?.name || 'Athlete'} · ${cutISO} → ${todayISO()}`,
          { x: marginX, y: height-58, size: 10, font, color: colCoyote });
        y = height - 105;

        // Summary stats
        const totMi = acts.reduce((s,x)=>s+(x.totalDistMi||0),0);
        const totSec = acts.reduce((s,x)=>s+(x.totalTimeSec||0),0);
        const avgPace = acts.length ? acts.reduce((s,x)=>s+(x.avgPaceSecPerMi||0),0)/acts.length : 0;
        const avgHR = acts.filter(x=>x.avgHR).length ? Math.round(acts.reduce((s,x)=>s+(x.avgHR||0),0)/acts.filter(x=>x.avgHR).length) : 0;
        page.drawRectangle({ x:marginX, y:y-52, width:contentW, height:56, color:rgb(0.95,0.95,0.93), borderColor:colOlive, borderWidth:1 });
        const bw = contentW/4;
        const stat = (label,val,i) => {
          page.drawText(label, { x:marginX+i*bw+10, y:y-14, size:7.5, font, color:colDim });
          page.drawText(val, { x:marginX+i*bw+10, y:y-34, size:14, font:fontBold, color:colOlive });
        };
        stat(es?'SESIONES':'SESSIONS', String(acts.length), 0);
        stat(es?'DISTANCIA':'DISTANCE', totMi.toFixed(1)+' mi', 1);
        stat(es?'TIEMPO':'TIME', secToHHMMSS(totSec), 2);
        stat(es?'PACE PROM':'AVG PACE', secToMMSS(avgPace), 3);
        y -= 78;

        // Section header helper
        const sectionHeader = (text) => {
          page.drawRectangle({ x:marginX, y:y-4, width:contentW, height:18, color:colOlive });
          page.drawText(text, { x:marginX+8, y:y, size:10, font:fontBold, color:rgb(0.91,0.89,0.85) });
          y -= 26;
        };
        const ensureSpace = (needed) => {
          if (y < needed) { page = doc.addPage([612,792]); y = height - 60; }
        };

        // Activity table
        sectionHeader(es?'ACTIVIDADES':'ACTIVITIES');
        page.drawText(es?'Fecha':'Date', { x:marginX, y, size:8, font:fontBold, color:colDim });
        page.drawText(es?'Tipo':'Type', { x:marginX+70, y, size:8, font:fontBold, color:colDim });
        page.drawText(es?'Dist':'Dist', { x:marginX+160, y, size:8, font:fontBold, color:colDim });
        page.drawText('Pace', { x:marginX+210, y, size:8, font:fontBold, color:colDim });
        page.drawText('FC', { x:marginX+270, y, size:8, font:fontBold, color:colDim });
        page.drawText(es?'Grado':'Grade', { x:marginX+310, y, size:8, font:fontBold, color:colDim });
        y -= 14;
        acts.forEach(s => {
          ensureSpace(80);
          const mf = s.manualFields || {};
          page.drawText(s.dateISO || '', { x:marginX, y, size:8.5, font, color:colPaper });
          page.drawText((mf.trainingType ? (SESSION_TYPE_LABELS[mf.trainingType]||mf.trainingType) : '—').slice(0,14), { x:marginX+70, y, size:8.5, font, color:colPaper });
          page.drawText((s.totalDistMi||0).toFixed(2), { x:marginX+160, y, size:8.5, font, color:colPaper });
          page.drawText(secToMMSS(s.avgPaceSecPerMi), { x:marginX+210, y, size:8.5, font, color:colPaper });
          page.drawText(String(s.avgHR||'—'), { x:marginX+270, y, size:8.5, font, color:colPaper });
          page.drawText(s.analysis?.sessionGrade || '—', { x:marginX+310, y, size:8.5, font:fontBold, color:colCoyote });
          y -= 14;
        });
        y -= 12;

        // Trend verdict
        ensureSpace(120);
        sectionHeader(es?'TENDENCIA':'TREND');
        const paced = acts.filter(x=>x.avgPaceSecPerMi>0);
        if (paced.length >= 3) {
          const half = Math.floor(paced.length/2);
          const firstP = paced.slice(0,half).reduce((s,x)=>s+x.avgPaceSecPerMi,0)/half;
          const lastP = paced.slice(half).reduce((s,x)=>s+x.avgPaceSecPerMi,0)/paced.slice(half).length;
          const improved = lastP < firstP;
          const pct = ((lastP-firstP)/firstP*100);
          const line = es
            ? `Pace ${improved?'mejorando':'retrocediendo'}: ${secToMMSS(firstP)} → ${secToMMSS(lastP)}/mi (${pct>0?'+':''}${pct.toFixed(1)}%).`
            : `Pace ${improved?'improving':'declining'}: ${secToMMSS(firstP)} → ${secToMMSS(lastP)}/mi (${pct>0?'+':''}${pct.toFixed(1)}%).`;
          page.drawText(line, { x:marginX, y, size:9, font, color: improved?colBlue:colAmber, maxWidth:contentW });
          y -= 18;
        } else {
          page.drawText(es?'Registra más sesiones para una tendencia confiable.':'Log more sessions for a reliable trend.', { x:marginX, y, size:9, font, color:colDim });
          y -= 18;
        }

        // Days to race
        const daysLeft = daysUntil(state.profile?.raceDateISO);
        page.drawText(es?`Días para la carrera (${state.profile?.raceDateISO}): ${daysLeft}`:`Days to race (${state.profile?.raceDateISO}): ${daysLeft}`, { x:marginX, y, size:9, font:fontBold, color:colPaper });
        y -= 30;

        // Footer
        page.drawText(`FitCoach 5K Tactical · ${new Date().toLocaleDateString()}`, { x:marginX, y:30, size:7, font, color:colDim });

        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), `fitcoach_report_${period}_${todayISO()}.pdf`, 'application/pdf');
        showToast(es?'✓ Reporte PDF descargado':'✓ PDF report downloaded');
      } catch (err) {
        console.error('Period report error:', err);
        showToast(getLang()==='es'?'✕ Error al generar reporte':'✕ Report generation failed');
      }
    }

    // Removes plan entries left over from the broken import (before the day/date-matching fix):
    // entries with no valid dateISO at all, and duplicate entries sharing the same dateISO
    // (keeps the one with notes/a real type, i.e. the actual imported session, over a stray
    // auto-generated placeholder).
    function cleanDuplicatePlanEntries() {
      const es = getLang() === 'es';
      const before = state.plan.length;

      const valid = state.plan.filter(s => s.dateISO && /^\d{4}-\d{2}-\d{2}$/.test(s.dateISO));
      const byDate = {};
      valid.forEach(s => {
        const existing = byDate[s.dateISO];
        if (!existing) { byDate[s.dateISO] = s; return; }
        // Prefer the entry with notes (came from an import) or, failing that, completed status.
        const score = (x) => (x.notes ? 2 : 0) + (x.completed ? 1 : 0);
        if (score(s) > score(existing)) byDate[s.dateISO] = s;
      });

      state.plan = Object.values(byDate).sort((a, b) => a.dateISO.localeCompare(b.dateISO));
      const removed = before - state.plan.length;
      saveState();
      render();
      showToast(es ? `✓ ${removed} entradas duplicadas eliminadas (quedan ${state.plan.length})` : `✓ ${removed} duplicate entries removed (${state.plan.length} left)`);
    }

    function resetApp() {
      if (confirm(t('confirm_reset'))) {
        state = DEFAULT_STATE;
        localStorage.removeItem(STORAGE_KEY);
        currentView = 'onboarding';
        currentStep = 0;
        onboardingData = {};
        detailOverlay = null;
        mdModalContent = null;
        mdModalActivityId = null;
        render();
        showToast(t('toast_reset_complete'));
      }
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.setAttribute('role', 'status');
      toast.setAttribute('aria-live', 'polite');
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // When true, the next render() scrolls the main pane to top (used only on genuine
    // view/tab changes). Otherwise scroll position is preserved so a button click that
    // triggers a re-render leaves the user where they were.
    let _scrollToTopNextRender = false;

    // Fields save on blur, and saving triggers render(), which rebuilds the whole #app
    // subtree — so the element the user was typing in gets destroyed and mobile keyboards
    // have nothing to "Next" into. This intercepts Enter/"Next", remembers where focus should
    // land, blurs (which fires the normal save+render), then refocuses the new element —
    // all inside the same keydown call stack so the on-screen keyboard never has to close.
    function handleEnterNext(event, nextFieldId) {
      const isEnter = event.key === 'Enter' || event.keyCode === 13 || event.which === 13;
      if (!isEnter) return;
      event.preventDefault();
      _focusAfterRender = nextFieldId;
      event.target.blur();
    }

    // Post-render accessibility pass. The UI is built from innerHTML templates, so semantics
    // are added here once instead of being repeated in ~90 template strings:
    //  • non-button elements with onclick become keyboard-operable role="button"
    //  • icon-only buttons (✕ ← ↑) get an aria-label
    //  • the active bottom-nav tab gets aria-current; modal/overlay get dialog semantics
    //  • form rows whose <label> is not bound to its control get an aria-label
    function enhanceA11y() {
      const es = getLang() === 'es';
      try {
        document.documentElement.lang = es ? 'es' : 'en';
        document.querySelectorAll('[onclick]').forEach(el => {
          if (/^(BUTTON|A|INPUT|SELECT|TEXTAREA|SUMMARY)$/.test(el.tagName)) return;
          if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
          if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
        });
        const ICON = { '✕': es ? 'Cerrar' : 'Close', '×': es ? 'Cerrar' : 'Close', '←': es ? 'Volver' : 'Back' };
        document.querySelectorAll('button').forEach(b => {
          if (b.hasAttribute('aria-label')) return;
          const txt = b.textContent.trim();
          if (ICON[txt]) b.setAttribute('aria-label', ICON[txt]);
        });
        document.querySelectorAll('nav button.active').forEach(b => b.setAttribute('aria-current', 'page'));
        const md = document.querySelector('.md-modal');
        if (md) { md.setAttribute('role', 'dialog'); md.setAttribute('aria-modal', 'true'); md.setAttribute('aria-label', es ? 'Exportación Markdown' : 'Markdown export'); }
        const ov = document.querySelector('.detail-overlay');
        if (ov) { ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); }
        document.querySelectorAll('.manual-field-row').forEach(row => {
          const label = row.querySelector('label');
          const ctl = row.querySelector('input:not([type=checkbox]), select, textarea');
          if (label && ctl && !label.getAttribute('for') && !ctl.getAttribute('aria-label') && !label.contains(ctl)) {
            ctl.setAttribute('aria-label', label.textContent.trim());
          }
        });
      } catch (e) { console.warn('a11y pass skipped:', e); }
    }
    // Keyboard: Enter/Space activates role="button" elements; Escape closes the top-most dialog.
    document.addEventListener('keydown', (e) => {
      const el = e.target;
      if (el && el.getAttribute && el.getAttribute('role') === 'button' && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        el.click();
        return;
      }
      if (e.key === 'Escape') {
        if (mdModalContent) { closeMarkdownModal(); }
        else if (detailOverlay && typeof closeDetail === 'function') { closeDetail(); }
      }
    });

    function render() {
      const mainEl = document.querySelector('main');
      const detailEl = document.querySelector('.detail-body');
      const savedMain = mainEl ? mainEl.scrollTop : 0;
      const savedDetail = detailEl ? detailEl.scrollTop : 0;
      document.getElementById('app').innerHTML = renderAppShell();
      const newMain = document.querySelector('main');
      const newDetail = document.querySelector('.detail-body');
      if (newMain) newMain.scrollTop = _scrollToTopNextRender ? 0 : savedMain;
      // The detail overlay has its own scroll container; restore it too so checkboxes
      // and buttons inside a workout/activity don't bounce the user to the top.
      if (newDetail) newDetail.scrollTop = _scrollToTopNextRender ? 0 : savedDetail;
      _scrollToTopNextRender = false;
      enhanceA11y();
      // Charts live in <canvas> elements — must be initialized as real JS calls after
      // the DOM update, since innerHTML does not execute embedded <script> tags.
      if (currentView === 'stats' && statsTab === 'charts') {
        setTimeout(initStatsCharts, 0);
      }
      if (currentView === 'more') {
        setTimeout(initWeightChart, 0);
        setTimeout(initBodyCircChart, 0);
      }
      // Refocus the field an Enter/"Next" press was navigating to (see handleEnterNext above).
      if (_focusAfterRender) {
        const nextId = _focusAfterRender;
        _focusAfterRender = null;
        const el = document.getElementById(nextId);
        if (el) { el.focus(); if (el.select) { try { el.select(); } catch (e) {} } }
      }
    }

    // ── Build identity ────────────────────────────────────────────────────
    // Without a visible version there is no way to tell a deploy that failed from one that
    // succeeded but is being served from cache. Shown in More → Settings and printed to the
    // console on every load.
    const APP_BUILD = '2026.10.29-1';
    console.log('%cFitCoach 5K build ' + APP_BUILD, 'font-weight:bold');

    // ── PWA: offline support via a real service worker file (sw.js) ──
    // Only works over http(s) (not file://). Caches the app shell so it opens offline.
    // Weather fetch still needs a connection; everything else works offline.
    // A cache-first service worker will keep serving the OLD index.html after a deploy, for as
    // long as its own bytes are unchanged — the app silently pins itself to a stale build. Three
    // guards against that: ask for an update check on every load, tell a waiting worker to
    // activate instead of idling, and reload once when it takes control.
    (function registerSW() {
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;

      let reloadingForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadingForUpdate) return;
        reloadingForUpdate = true;
        location.reload();
      });

      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update().catch(() => {});

        const promote = (worker) => {
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            // 'installed' with an existing controller means a NEW version is ready and waiting.
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              worker.postMessage({ type: 'SKIP_WAITING' });
              try {
                showToast(getLang() === 'es' ? 'Nueva versión — actualizando…' : 'New version — updating…');
              } catch (_) {}
            }
          });
        };

        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        promote(reg.installing);
        reg.addEventListener('updatefound', () => promote(reg.installing));

        // Catch deploys that land while the app is already open.
        setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
      }).catch((err) => console.warn('SW registration skipped:', err));
    })();

    // Manual escape hatch for when caching still wins: drops every cache and unregisters the
    // service worker, then hard-reloads. Exposed in More → Settings.
    async function forceRefreshApp() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (err) {
        console.warn('Cache clear failed:', err);
      }
      // Cache-busting query string defeats any remaining HTTP-layer cache.
      location.replace(location.pathname + '?fresh=' + Date.now());
    }

    // ── Migration: repair grades computed before type-aware scoring ──────────
    // Runs before the first render so the activity list never flashes stale grades. Guarded by a
    // schema marker so it costs nothing on subsequent loads.
    (function migrateSessionGrades() {
      const MARKER = 'typeAwareScoring_v1';
      if (state.migrations?.[MARKER]) return;
      try {
        const changed = rescoreAllSessions();
        state.migrations = state.migrations || {};
        state.migrations[MARKER] = new Date().toISOString();
        saveState();
        if (changed > 0) {
          setTimeout(() => {
            try {
              showToast(getLang() === 'es'
                ? `${changed} sesión(es) recalificadas según su tipo`
                : `${changed} session(s) re-graded by session type`);
            } catch (_) {}
          }, 1200);
        }
      } catch (err) { console.warn('Grade migration skipped:', err); }
    })();

    // Pick the active race (next upcoming) and mirror it into the legacy profile fields.
    try { syncActiveRace(); saveState(); } catch (err) { console.warn('syncActiveRace skipped:', err); }
    // Re-evaluate when the app returns to the foreground (a race date may have passed).
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      const before = state.profile?.activeRaceId;
      try { syncActiveRace(); } catch (_) {}
      if (state.profile?.activeRaceId !== before) { saveState(); render(); }
    });

    render();

    // One-time backup reminder: if the user has real data but no recent backup, nudge them.
    (function backupReminder() {
      const hasData = (state.tcxSessions?.length || 0) > 0 || state.profile;
      if (!hasData) return;
      const last = state.lastBackupISO;
      const daysSince = last ? Math.round((Date.now() - new Date(last + 'T12:00:00').getTime()) / 86400000) : 999;
      if (daysSince >= 7) {
        setTimeout(() => {
          try {
            showToast(getLang() === 'es'
              ? '💾 Recuerda exportar un backup (Más → Gestión de Datos)'
              : '💾 Remember to export a backup (More → Data Management)');
          } catch (_) {}
        }, 2500);
      }
    })();
  </script>

  document.head.appendChild(st);

  /* ---------- Tarjeta ---------- */
  var msg = '', msgErr = false;
  function cardHtml() {
    var R = load(), has = R.pts && R.pts.length > 5, goal = R.goal || goalFromPage(), sec = parsePace(goal);
    var h = '<div class="fr-top"><h3>' + esc(tx('t')) + '</h3><span class="fr-tag">' + esc(tx('opt')) + '</span></div>';
    if (!has) h += '<p>' + esc(tx('intro')) + '</p>';
    h += '<div class="fr-row"><button type="button" class="fr-main" data-fr="import">' + esc(has ? tx('rep') : tx('imp')) + '</button>' + (has ? '<button type="button" data-fr="clear">' + esc(tx('clr')) + '</button>' : '')
      + '<input type="file" id="fr-file" accept=".gpx,.tcx,.xml,application/gpx+xml,application/xml,text/xml" hidden></div>';
    h += '<div class="fr-msg' + (msgErr ? ' err' : '') + '" role="status" aria-live="polite">' + esc(msg) + '</div>';
    h += '<label for="fr-name">' + esc(tx('name')) + '</label><input type="text" id="fr-name" data-f="name" value="' + esc(R.name || '') + '" autocomplete="off">';
    h += '<label for="fr-url">' + esc(tx('url')) + '</label><input type="url" id="fr-url" data-f="url" value="' + esc(R.url || '') + '" inputmode="url" autocomplete="off" placeholder="https://">';
    if (R.url && /^https?:\/\//i.test(R.url)) h += '<div class="fr-row"><a class="fr-btn" href="' + esc(R.url) + '" target="_blank" rel="noopener noreferrer">' + esc(tx('open')) + ' ↗</a></div>';
    if (has) {
      h += '<label for="fr-goal">' + esc(tx('goal')) + '</label><input type="text" id="fr-goal" data-f="goal" value="' + esc(goal) + '" inputmode="numeric" placeholder="8:51" autocomplete="off">';
      if (!isFinite(sec)) h += '<div class="fr-msg err">' + esc(tx('pace0')) + '</div>';
      var a = analyze(R, isFinite(sec) ? sec : 600), km = a.dist / 1000, mi = a.dist / MI;
      h += '<div class="fr-stats"><div class="fr-stat"><b>' + mi.toFixed(2) + ' mi</b><span>' + esc(tx('dist')) + ' · ' + km.toFixed(2) + ' km' + raceTag(a.dist) + '</span></div>';
      if (R.hasEle) {
        h += '<div class="fr-stat"><b>+' + ft(a.gain) + ' ft</b><span>' + esc(tx('gain')) + ' · ' + Math.round(a.gain) + ' m</span></div>'
          + '<div class="fr-stat"><b>−' + ft(a.loss) + ' ft</b><span>' + esc(tx('loss')) + ' · ' + Math.round(a.loss) + ' m</span></div>'
          + '<div class="fr-stat"><b>' + pct(a.maxUp) + ' / ' + pct(a.maxDn) + '</b><span>' + esc(tx('maxUp')) + ' / ' + esc(tx('maxDn')) + '</span></div>'
          + '<div class="fr-stat"><b>' + ft(a.min) + '–' + ft(a.max) + ' ft</b><span>' + esc(tx('elev')) + '</span></div>';
        if (isFinite(sec)) h += '<div class="fr-stat"><b>' + fmtT(a.time) + '</b><span>' + esc(tx('time')) + ' · ' + (a.time >= a.flat ? '+' : '−') + fmtT(Math.abs(a.time - a.flat)) + ' ' + esc(tx('vsFlat')) + '</span></div>';
      }
      h += '</div>';
      if (!R.hasEle) h += '<div class="fr-msg err">' + esc(tx('noele')) + '</div>';
      else {
        h += '<h4>' + esc(tx('prof')) + ' (mi)</h4>' + profile(a, R.pts);
        h += '<h4>' + esc(tx('warn')) + '</h4>';
        if (!a.runs.length) h += '<p>' + esc(tx('none')) + '</p>';
        else h += '<ul>' + a.runs.slice(0, 8).map(function (r) { return '<li>' + esc(r.t < 0 ? tx('down') : tx('up')) + ' ' + pct(r.grade) + ' ' + esc(tx('at')) + ' ' + r.at.toFixed(2) + ' · ' + Math.round(r.len) + ' m ' + '</li>'; }).join('') + '</ul>';
        if (isFinite(sec)) {
          h += '<h4>' + esc(tx('splits')) + '</h4><table><thead><tr><th>' + esc(tx('mi')) + '</th><th>' + esc(tx('net')) + '</th><th>' + esc(tx('grade')) + '</th><th>' + esc(tx('pace')) + '</th><th>' + esc(tx('cum')) + '</th></tr></thead><tbody>'
            + a.rows.map(function (r) { return '<tr><td>' + (r.k + 1) + (r.d < MI - 30 ? '*' : '') + '</td><td>' + sgn(ft(r.z1 - r.z0)) + ' ft</td><td>' + pct(r.gr) + '</td><td>' + fmtT(r.pace) + '</td><td>' + fmtT(r.cum) + '</td></tr>'; }).join('') + '</tbody></table>' + (a.rows.some(function (r) { return r.d < MI - 30; }) ? '<div class="fr-leg">' + esc(tx('part')) + '</div>' : '');
        }
        h += '<div class="fr-note">' + esc(tx('model')) + '</div>';
      }
      var p0 = R.pts[0];
      h += '<div class="fr-row"><a class="fr-btn" href="https://www.google.com/maps?q=' + p0[0] + ',' + p0[1] + '" target="_blank" rel="noopener noreferrer">' + esc(tx('start')) + ' ↗</a></div>';
    }
    h += '<label for="fr-notes">' + esc(tx('notes')) + '</label><textarea id="fr-notes" data-f="notes">' + esc(R.notes || '') + '</textarea>';
    return h;
  }

  var host = null;
  function mount() {
    var anchor = document.querySelector('.mission-clock');
    if (!anchor || !anchor.parentNode) return;
    if (!host || !document.contains(host)) { host = document.createElement('section'); host.className = 'fc-route'; host.id = 'fc-route'; host.setAttribute('aria-label', tx('t')); host.setAttribute('data-l', ''); }
    if (anchor.nextSibling !== host) anchor.parentNode.insertBefore(host, anchor.nextSibling);
    var L = lang(); if (host.getAttribute('data-l') !== L || host.getAttribute('data-dirty') === '1') draw();
  }
  function draw() {
    var active = document.activeElement, keep = active && host.contains(active) ? active.id : '';
    host.innerHTML = cardHtml(); host.setAttribute('data-l', lang()); host.removeAttribute('data-dirty'); host.setAttribute('aria-label', tx('t'));
    if (keep) { var el = document.getElementById(keep); if (el && el.focus) el.focus(); }
  }
  function flash(m, err) { msg = m; msgErr = !!err; draw(); }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('#fc-route [data-fr]'); if (!b) return;
    var act = b.getAttribute('data-fr');
    if (act === 'import') { var f = document.getElementById('fr-file'); if (f) f.click(); }
    if (act === 'clear') { if (window.confirm(tx('sure'))) { var R = load(); delete R.pts; delete R.hasEle; delete R.total; delete R.file; save(R); flash(tx('cleared'), false); } }
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (!t || !t.closest || !t.closest('#fc-route')) return;
    if (t.id === 'fr-file' && t.files && t.files[0]) {
      var file = t.files[0], rd = new FileReader();
      rd.onload = function () {
        try {
          var raw = parseTrack(String(rd.result)); if (raw.length < 5) { flash(tx('few'), true); return; }
          var rs = resample(raw); if (!rs) { flash(tx('few'), true); return; }
          var R = load(); R.pts = rs.pts; R.hasEle = rs.hasEle; R.total = rs.total; R.file = file.name;
          if (!R.name) R.name = file.name.replace(/\.(gpx|tcx|xml)$/i, '');
          var ok = save(R); flash(ok ? tx('saved') : tx('bad'), !ok);
        } catch (err) { flash(tx('bad'), true); }
      };
      rd.onerror = function () { flash(tx('bad'), true); };
      rd.readAsText(file); return;
    }
    var k = t.getAttribute('data-f'); if (!k) return;
    var R2 = load(), v = t.value.trim();
    if (k === 'url' && v && !/^https?:\/\//i.test(v)) { msg = tx('badurl'); msgErr = true; host.setAttribute('data-dirty', '1'); mount(); return; }
    R2[k] = v; save(R2); msg = ''; msgErr = false; host.setAttribute('data-dirty', '1'); mount();
  });

  var raf = 0; function sched() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; try { mount(); } catch (e) { console.warn('fc-route', e); } }); }
  new MutationObserver(sched).observe(document.body, { childList: true, subtree: true });
  mount();
  window.__fcRouteTest = { parseTrack: parseTrack, resample: resample, analyze: analyze, cost: cost };
})();

</script>
<script id="fc-v2-pred">
/* FITCOACH pred module v1 — 3 widgets bajo "¿Llego a sub-X?": comparación, carrera de referencia (manual) y ajuste por desnivel (GPX/TCX). Offline; datos solo en localStorage. */
(function () {
  if (window.__fcPred) return; window.__fcPred = true;
  var KEY = 'fc_ref_run_v1', MI = 1609.344, STEP = 20;

  var TX = {
    es: {

      noele: 'El archivo no trae elevación: no se puede ajustar.', badf: 'No pude leer el archivo. Usa un GPX o TCX con puntos de ruta.', tsaved: 'Ajuste guardado.',
      gain: 'Subida', loss: 'Bajada', factor: 'Costo vs. llano', adj: 'Tiempo equivalente en llano', usedby: 'Se usa en el primer widget.',
      model: 'Estimación aproximada (Minetti 2002 sobre pendientes suavizadas; la elevación de GPS tiene error). POR CONFIRMAR.',
      opt: 'Opcional', flatnote: 'Distancia de la carrera de referencia distinta a la de la meta: se proyecta con Daniels (VDOT).'
    },
    en: {
      cmp: 'PROJECTION: APP VS. YOUR ROUTE', ref: 'REFERENCE RUN', ter: 'TERRAIN ADJUSTMENT',
      app: 'App projection', manual: 'With your reference run', terr: 'Terrain-adjusted', goal: 'Goal', need: 'needed pace', gap: 'Gap vs. goal',
      none: 'No reference run yet. Save it in the next widget and it will show here.', vdot: 'VDOT', flat: 'flat equivalent',
      date: 'Date', dist: 'Distance (mi)', time: 'Time (m:ss or h:mm:ss)', hr: 'Avg HR (bpm)', save: 'Save reference', clr: 'Remove',
      hrpct: 'of your threshold', hrlow: 'Avg HR is below the threshold zone (Z4): the time understates your fitness.', hrhigh: 'Avg HR is above your threshold: it was a race effort; do not repeat it as training.',
      bad: 'Check the data: distance, time as m:ss, and HR.', saved: 'Reference saved on this device.', cleared: 'Reference removed.',
      tintro: 'If that route had climbs and descents, the time is not a flat time. Import the GPX or TCX of that run and the app corrects it with the Minetti cost model.',
      imp: 'Import GPX / TCX of that run', rep: 'Replace file', tclr: 'Remove adjustment', needref: 'Save the reference run first.',
      noele: 'The file has no elevation: it cannot be adjusted.', badf: 'I could not read that file. Use a GPX or TCX with track points.', tsaved: 'Adjustment saved.',
      gain: 'Climb', loss: 'Descent', factor: 'Cost vs. flat', adj: 'Flat-equivalent time', usedby: 'Used in the first widget.',
      model: 'Rough estimate (Minetti 2002 on smoothed grades; GPS elevation has error). TO BE CONFIRMED.',
      opt: 'Optional', flatnote: 'Reference run distance differs from the goal distance: projected with Daniels (VDOT).'
    }
  };
  function lang() { try { return getLang() === 'es' ? 'es' : 'en'; } catch (e) { return document.documentElement.lang === 'es' ? 'es' : 'en'; } }
  function tx(k) { return TX[lang()][k]; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null') || {}; } catch (e) { return {}; } }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
  function mmss(s) { s = Math.round(s); var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' + (m < 10 ? '0' : '') + m : m) + ':' + (x < 10 ? '0' : '') + x; }
  function parseTime(v) {
    var m = /^\s*(?:(\d{1,2}):)?(\d{1,3}):([0-5]\d)\s*$/.exec(v || ''); if (!m) return NaN;
    return (m[1] ? +m[1] * 3600 : 0) + (+m[2]) * 60 + (+m[3]);
  }

  /* ---------- Cálculo ---------- */
  function ctx() {
    try {
      var p = state && state.profile; if (!p) return null;
      var raceM = raceDistanceMeters(p), goal = activeGoalSec(p, raceM);
      return { p: p, raceM: raceM, goal: goal, boots: p.raceInBoots === false ? 0 : 0.04, heat: raceHeatPenaltyPct(p.raceDateISO), lthr: p.lthr || 174 };
    } catch (e) { return null; }
  }
  function project(c, distM, timeSec) {
    var v = calcVDOT(distM, timeSec); if (!(v > 0)) return null;
    var flat = vdotToTime(v, c.raceM); if (!(flat > 0)) return null;
    var real = flat * (1 + c.boots + c.heat);
    return { vdot: v, flat: flat, real: real, low: real * 0.965, high: real * 1.035 };
  }
  function terrain(R, c) {
    /* factor de costo medio de la ruta vs. llano (Minetti); lo calcula al importar */
    return R.ter && R.ter.factor > 0 ? R.ter : null;
  }
  function costOf(g) { var T = window.__fcRouteTest; return T && T.cost ? T.cost(g) : 3.6; }
  function terrainFromPts(rs) {
    var n = rs.pts.length, i, k, raw = rs.pts.map(function (p) { return p[2]; }), sm = [];
    for (i = 0; i < n; i++) { var s = 0, w = 0; for (k = -4; k <= 4; k++) { var idx = i + k; if (idx < 0 || idx >= n) continue; var wt = 5 - Math.abs(k); s += raw[idx] * wt; w += wt; } sm.push(s / w); }
    var sum = 0, gain = 0, loss = 0, cnt = 0;
    for (i = 1; i < n; i++) { var dz = sm[i] - sm[i - 1]; if (dz > 0) gain += dz; else loss -= dz; sum += costOf(dz / STEP) / 3.6; cnt++; }
    var f = cnt ? sum / cnt : 1; f = Math.max(0.9, Math.min(1.5, f));
    return { factor: +f.toFixed(4), gain: Math.round(gain), loss: Math.round(loss), distMi: +(rs.total / MI).toFixed(2) };
  }

  /* ---------- HTML ---------- */
  function row(label, val, sub, color) {
    return '<div class="fp-row"><div class="fp-l">' + esc(label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div><div class="fp-v" style="' + (color ? 'color:' + color : '') + '">' + val + '</div></div>';
  }
  function cardCompare(c, R) {
    var h = '<div class="card fp-card"><div class="card-title">' + esc(tx('cmp')) + '</div>';
    if (!c) return h + '<p class="fp-p">' + esc(tx('none')) + '</p></div>';
    var pace = c.goal / (c.raceM / MI);
    var app = null; try { app = getRacePrediction(); } catch (e) {}
    if (app) h += row(tx('app'), mmss(app.lowSec) + '–' + mmss(app.highSec), '', app.color);
    var man = null, ter = null, distM = R.dist ? R.dist * MI : 0;
    if (R.dist && R.sec) man = project(c, distM, R.sec);
    if (R.dist && R.sec && R.ter) ter = project(c, distM, R.sec / R.ter.factor);
    if (man) h += row(tx('manual'), mmss(man.low) + '–' + mmss(man.high), 'VDOT ' + man.vdot.toFixed(1) + ' · ' + tx('flat') + ' ' + mmss(man.flat), 'var(--coyote,#c9a961)');
    if (ter) h += row(tx('terr'), mmss(ter.low) + '–' + mmss(ter.high), 'VDOT ' + ter.vdot.toFixed(1) + ' · ' + tx('flat') + ' ' + mmss(ter.flat), 'var(--paper,#e8e4d9)');
    if (!man) h += '<p class="fp-p">' + esc(tx('none')) + '</p>';
    h += '<div class="fp-goal">' + esc(tx('goal')) + ' ' + mmss(c.goal) + ' · ' + esc(tx('need')) + ' ' + mmss(pace) + '/mi';
    var best = ter || man;
    if (best) { var gap = best.low - c.goal; h += '<br>' + esc(tx('gap')) + ': ' + (gap > 0 ? '+' : '−') + mmss(Math.abs(gap)) + ' (' + (gap > 0 ? '+' : '−') + mmss(Math.abs(gap) / (c.raceM / MI)) + '/mi)'; }
    return h + '</div></div>';
  }
  var msg = '', msgErr = false;
  function cardRef(c, R) {
    var d = R.date || '2026-10-21', dist = R.dist || 6.3, time = R.sec ? mmss(R.sec) : '65:07', hr = R.hr || 168;
    var h = '<div class="card fp-card"><div class="card-title">' + esc(tx('ref')) + ' <span class="fp-tag">' + esc(tx('opt')) + '</span></div>';
    h += '<div class="fp-grid"><label>' + esc(tx('date')) + '<input id="fp-date" type="date" value="' + esc(d) + '"></label>'
      + '<label>' + esc(tx('dist')) + '<input id="fp-dist" type="number" step="0.01" min="0.5" inputmode="decimal" value="' + esc(dist) + '"></label>'
      + '<label>' + esc(tx('time')) + '<input id="fp-time" type="text" inputmode="numeric" value="' + esc(time) + '"></label>'
      + '<label>' + esc(tx('hr')) + '<input id="fp-hr" type="number" min="60" max="230" inputmode="numeric" value="' + esc(hr) + '"></label></div>';
    h += '<div class="fp-btns"><button type="button" data-fp="save">' + esc(tx('save')) + '</button>' + (R.sec ? '<button type="button" class="fp-sec" data-fp="clear">' + esc(tx('clr')) + '</button>' : '') + '</div>';
    if (R.sec && R.dist) {
      var v = calcVDOT(R.dist * MI, R.sec), pace = R.sec / R.dist;
      h += '<div class="fp-info">VDOT ' + v.toFixed(1) + ' · ' + mmss(pace) + '/mi';
      if (R.hr && c) {
        var pc = Math.round(R.hr / c.lthr * 100); h += ' · FC ' + R.hr + ' (' + pc + '% ' + esc(tx('hrpct')) + ')';
        var fl = 0; try { fl = zoneFloors(c.lthr).z4; } catch (e) {}
        if (fl && R.hr < fl) h += '<br>⚠ ' + esc(tx('hrlow')); else if (R.hr >= c.lthr) h += '<br>⚠ ' + esc(tx('hrhigh'));
      }
      if (c && Math.abs(R.dist * MI - c.raceM) / c.raceM > 0.05) h += '<br>' + esc(tx('flatnote'));
      h += '</div>';
    }
    if (msg) h += '<div class="fp-msg" role="status" style="color:' + (msgErr ? 'var(--rust-bright,#e0705a)' : 'var(--olive-bright,#8ab84a)') + '">' + esc(msg) + '</div>';
    return h + '</div>';
  }
  function cardTerrain(c, R) {
    var h = '<div class="card fp-card"><div class="card-title">' + esc(tx('ter')) + ' <span class="fp-tag">' + esc(tx('opt')) + '</span></div><p class="fp-p">' + esc(tx('tintro')) + '</p>';
    if (!R.sec) h += '<div class="fp-info">' + esc(tx('needref')) + '</div>';
    else {
      h += '<div class="fp-btns"><button type="button" data-fp="import">' + esc(R.ter ? tx('rep') : tx('imp')) + '</button>' + (R.ter ? '<button type="button" class="fp-sec" data-fp="tclr">' + esc(tx('tclr')) + '</button>' : '') + '</div>'
        + '<input id="fp-file" type="file" accept=".gpx,.tcx,.xml" hidden aria-label="' + esc(tx('imp')) + '">';
      if (R.ter) {
        h += '<div class="fp-info">' + esc(tx('gain')) + ' ' + Math.round(R.ter.gain * 3.28084) + ' ft · ' + esc(tx('loss')) + ' ' + Math.round(R.ter.loss * 3.28084) + ' ft · ' + esc(tx('factor')) + ' ×' + R.ter.factor.toFixed(3)
          + '<br>' + esc(tx('adj')) + ': ' + mmss(R.sec / R.ter.factor) + ' (' + mmss(R.sec) + ' → ' + mmss(R.sec / R.ter.factor) + ')<br>' + esc(tx('usedby')) + '</div>'
          + '<div class="fp-small">' + esc(tx('model')) + '</div>';
      }
    }
    if (msg && R.sec) h += '';
    return h + '</div>';
  }
  function html() {
    var c = ctx(), R = load();
    return cardCompare(c, R) + cardRef(c, R) + cardTerrain(c, R);
  }

  /* ---------- CSS ---------- */
  var st = document.createElement('style'); st.id = 'fc-pred-css';
  st.textContent = '.card-title{font-size:14px!important;font-weight:700;letter-spacing:1.2px!important;color:var(--coyote,#c9a961)!important}'
    + '.card-title::before{width:10px!important;height:10px!important}'
    + '.fc-route h3{font-size:14px!important;letter-spacing:1.2px!important}'
    + '.fp-wrap{margin:0}'
    + '.fp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--field-line,#2a3320)}'
    + '.fp-l{font-size:13px;color:var(--paper,#e8e4d9);flex:1;min-width:0}.fp-l small{display:block;font-size:11px;color:var(--paper-dim,#9a9888);margin-top:2px}'
    + '.fp-v{font:700 20px/1.1 var(--font-mono,monospace);white-space:nowrap}'
    + '.fp-p,.fp-info,.fp-small,.fp-goal{font-size:12px;line-height:1.5;color:var(--paper-dim,#b0ad9d);margin:8px 0 0}.fp-small{font-size:11px}.fp-goal{color:var(--paper,#e8e4d9);margin-top:10px}'
    + '.fp-tag{font:600 11px/1 var(--font-mono,monospace);color:var(--paper-dim,#9a9888);border:1px solid var(--field-line,#2a3320);padding:3px 6px;border-radius:2px;margin-left:auto}'
    + '.fp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fp-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--paper-dim,#b0ad9d)}'
    + '.fp-grid input{min-height:44px;padding:8px;background:var(--field-dark,#0f130b);border:1px solid var(--field-line,#2a3320);color:var(--paper,#e8e4d9);font:15px var(--font-mono,monospace);border-radius:2px;width:100%;box-sizing:border-box}'
    + '.fp-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.fp-btns button{min-height:44px;padding:0 14px;background:var(--olive,#4a6a28);border:1px solid var(--olive-bright,#6a9a38);color:#fff;font:600 13px var(--font-mono,monospace);border-radius:2px;cursor:pointer}'
    + '.fp-btns .fp-sec{background:transparent;color:var(--paper,#e8e4d9);border-color:var(--field-line,#3a4528)}'
    + '.fp-msg{font-size:12px;margin-top:8px}';
  document.head.appendChild(st);

  /* ---------- Montaje ---------- */
  var host = null, sig = '';
  function anchorCard() {
    var ts = document.querySelectorAll('.card-title'), i;
    for (i = 0; i < ts.length; i++) { var t = ts[i].textContent.trim(); if (/^(¿LLEGO A SUB|WILL I HIT SUB)/i.test(t)) return ts[i].closest('.card'); }
    return null;
  }
  function mount() {
    var a = anchorCard(); if (!a || !a.parentNode) return;
    if (!host || !document.contains(host)) { host = document.createElement('section'); host.className = 'fp-wrap'; host.id = 'fc-pred'; sig = ''; }
    if (a.nextSibling !== host) a.parentNode.insertBefore(host, a.nextSibling);
    var s = lang() + '|' + a.textContent.length + '|' + a.textContent.replace(/\s+/g, '').slice(0, 80);
    if (sig !== s || host.getAttribute('data-dirty') === '1') draw(s);
  }
  function draw(s) {
    var act = document.activeElement, keep = act && host.contains(act) ? act.id : '';
    host.innerHTML = html(); sig = s || sig; host.removeAttribute('data-dirty');
    if (keep) { var el = document.getElementById(keep); if (el && el.focus) el.focus(); }
  }
  function flash(m, err) { msg = m; msgErr = !!err; host.setAttribute('data-dirty', '1'); mount(); }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('#fc-pred [data-fp]'); if (!b) return;
    var act = b.getAttribute('data-fp'), R = load();
    if (act === 'import') { var f = document.getElementById('fp-file'); if (f) f.click(); return; }
    if (act === 'clear') { if (window.confirm(lang() === 'es' ? '¿Quitar la carrera de referencia?' : 'Remove the reference run?')) { save({}); flash(tx('cleared'), false); } return; }
    if (act === 'tclr') { delete R.ter; save(R); flash('', false); return; }
    if (act === 'save') {
      var dist = parseFloat(document.getElementById('fp-dist').value), sec = parseTime(document.getElementById('fp-time').value), hr = parseInt(document.getElementById('fp-hr').value, 10);
      if (!(dist >= 0.5 && dist <= 60) || !(sec >= 300) || (hr && !(hr >= 60 && hr <= 230))) { flash(tx('bad'), true); return; }
      var N = { date: document.getElementById('fp-date').value, dist: dist, sec: sec, hr: hr || 0 };
      if (R.ter && R.dist === dist && R.sec === sec) N.ter = R.ter;
      flash(save(N) ? tx('saved') : tx('bad'), false);
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (!t || t.id !== 'fp-file' || !t.files || !t.files[0]) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var T = window.__fcRouteTest, raw = T.parseTrack(String(rd.result)); if (raw.length < 5) { flash(tx('badf'), true); return; }
        var rs = T.resample(raw); if (!rs) { flash(tx('badf'), true); return; }
        if (!rs.hasEle) { flash(tx('noele'), true); return; }
        var R = load(); R.ter = terrainFromPts(rs); flash(save(R) ? tx('tsaved') : tx('badf'), false);
      } catch (err) { flash(tx('badf'), true); }
    };
    rd.onerror = function () { flash(tx('badf'), true); };
    rd.readAsText(t.files[0]);
  });

  var raf = 0; function sched() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; try { mount(); } catch (e) { console.warn('fc-pred', e); } }); }
  new MutationObserver(sched).observe(document.body, { childList: true, subtree: true });
  mount();
  window.__fcPredTest = { parseTime: parseTime, project: project, terrainFromPts: terrainFromPts };
})();

</script>
</body>
