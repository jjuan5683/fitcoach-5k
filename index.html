<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FITCOACH // MISSION 5K</title>
  <meta name="theme-color" content="#0a0d08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitCoach 5K">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- PWA manifest: real file (manifest.json) served alongside this page -->
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --black-olive: #0a0d08;
      --field-dark: #11150d;
      --field-surface: #161b10;
      --field-surface2: #1c2215;
      --field-line: #2a3320;
      --olive: #3d5a1f;
      --olive-bright: #5a8530;
      --coyote: #c9a961;
      --coyote-dim: #8a7548;
      --paper: #e8e4d9;
      --paper-dim: #9a9888;
      --rust: #a8453a;
      --rust-bright: #d4574a;
      --signal-amber: #d4942e;
      --signal-blue: #3d6b8a;

      --font-display: 'Oswald', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    html, body { height: 100%; width: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--black-olive);
      color: var(--paper);
      overflow: hidden;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(61, 90, 31, 0.06) 39px, rgba(61, 90, 31, 0.06) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(61, 90, 31, 0.06) 39px, rgba(61, 90, 31, 0.06) 40px);
    }

    #app { height: 100vh; display: flex; flex-direction: column; background: transparent; }

    header {
      background: var(--field-dark);
      border-bottom: 1px solid var(--field-line);
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 100;
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--coyote) 0%, transparent 40%, transparent 60%, var(--coyote) 100%);
      opacity: 0.4;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .header-mark {
      width: 36px; height: 36px;
      border: 1.5px solid var(--coyote);
      transform: rotate(45deg);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .header-mark::before {
      content: '';
      position: absolute;
      width: 6px; height: 6px;
      background: var(--coyote);
      border-radius: 50%;
    }

    .header-info .callsign {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--coyote);
      text-transform: uppercase;
      margin: 0;
    }

    .header-info .name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--paper);
      margin: 0;
      letter-spacing: 0.3px;
    }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .status-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--olive-bright);
      border: 1px solid var(--field-line);
      padding: 5px 10px;
      text-transform: uppercase;
      cursor: pointer;
      background: var(--field-surface);
    }


    main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .view-container {
      padding: 18px 16px;
      max-width: 540px;
      margin: 0 auto;
      width: 100%;
      padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
    }

    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.25s ease-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--field-dark);
      border-top: 1px solid var(--field-line);
      display: flex;
      height: 64px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 50;
    }

    nav button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--paper-dim);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.2s;
      position: relative;
    }

    nav button.active { color: var(--coyote); }

    nav button.active::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 24px; height: 2px;
      background: var(--coyote);
    }

    nav button .nav-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

    .onboarding {
      min-height: 100vh;
      background: var(--black-olive);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .onboarding-card {
      width: 100%;
      max-width: 480px;
      background: var(--field-dark);
      border: 1px solid var(--field-line);
      padding: 0;
      position: relative;
    }

    .onboarding-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: repeating-linear-gradient(90deg, var(--coyote) 0px, var(--coyote) 12px, transparent 12px, transparent 18px);
      opacity: 0.5;
    }

    .step-track { display: flex; border-bottom: 1px solid var(--field-line); }

    .step-seg {
      flex: 1;
      height: 3px;
      background: var(--field-line);
      transition: background 0.3s;
    }

    .step-seg.done, .step-seg.current { background: var(--coyote); }

    .onboarding-body { padding: 28px 24px; }

    .onboarding-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--olive-bright);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .onboarding-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      color: var(--paper);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .onboarding-subtitle {
      font-size: 13px;
      color: var(--paper-dim);
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 18px; }

    .form-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--coyote-dim);
      font-weight: 500;
      margin-bottom: 8px;
      display: flex;
      gap: 4px;
      text-transform: uppercase;
    }

    .required { color: var(--rust-bright); }

    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      background: var(--field-surface);
      border: 1px solid var(--field-line);
      border-radius: 2px;
      padding: 11px 12px;
      color: var(--paper);
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--coyote); }

    .form-hint {
      font-size: 11px;
      color: var(--paper-dim);
      margin-top: 5px;
      font-style: italic;
    }

    .checkbox-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }

    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--coyote); }

    .btn-group { display: flex; gap: 10px; margin-top: 24px; }

    .btn {
      flex: 1;
      padding: 13px 0;
      border-radius: 2px;
      border: none;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--coyote); color: var(--black-olive); }
    .btn-primary:hover { background: #ddbb78; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      background: transparent;
      color: var(--paper-dim);
      border: 1px solid var(--field-line);
    }

    .btn-secondary:hover { border-color: var(--paper-dim); color: var(--paper); }

    .btn-small {
      background: var(--field-surface);
      border: 1px solid var(--field-line);
      padding: 7px 12px;
      color: var(--paper-dim);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .step-counter {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--paper-dim);
      margin-top: 18px;
      letter-spacing: 1px;
    }

    .card {
      background: var(--field-dark);
      border: 1px solid var(--field-line);
      padding: 18px;
      margin-bottom: 12px;
      position: relative;
    }

    .card-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--coyote-dim);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      width: 8px; height: 8px;
      border: 1px solid var(--coyote-dim);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .mission-clock {
      background: var(--field-dark);
      border: 1px solid var(--field-line);
      padding: 0;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .mission-clock::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(61, 90, 31, 0.15) 0%, transparent 50%),
        repeating-linear-gradient(135deg, transparent, transparent 18px, rgba(201, 169, 97, 0.03) 18px, rgba(201, 169, 97, 0.03) 19px);
      pointer-events: none;
    }

    .clock-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px 0;
      position: relative;
      z-index: 1;
    }

    .clock-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--olive-bright);
      text-transform: uppercase;
    }

    .clock-coords {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--paper-dim);
      letter-spacing: 0.5px;
    }

    .clock-main { padding: 6px 18px 18px; position: relative; z-index: 1; }

    .clock-countdown { display: flex; align-items: baseline; gap: 10px; }

    .clock-number {
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: 600;
      color: var(--paper);
      line-height: 0.9;
      letter-spacing: -1px;
    }

    .clock-unit {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--coyote);
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 8px;
    }

    .clock-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--paper-dim);
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .clock-divider { height: 1px; background: var(--field-line); margin: 0 18px; position: relative; z-index: 1; }

    .clock-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 14px 18px;
      gap: 4px;
      position: relative;
      z-index: 1;
    }

    .clock-stat { text-align: center; }

    .clock-stat-val {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--coyote);
    }

    .clock-stat-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--paper-dim);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .sitrep-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--coyote-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sitrep-label::after { content: ''; flex: 1; height: 1px; background: var(--field-line); }

    .session-card {
      background: var(--field-dark);
      border: 1px solid var(--field-line);
      border-left: 3px solid var(--olive);
      padding: 14px 16px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.15s;
    }

    .session-card:hover { border-left-color: var(--coyote); background: var(--field-surface); }
    .session-card.completed { opacity: 0.5; border-left-color: var(--olive-bright); }

    .session-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .session-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }

    .session-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--coyote);
      border: 1px solid var(--coyote-dim);
      padding: 3px 6px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .session-info h3 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 15px;
      color: var(--paper);
      margin-bottom: 2px;
    }

    .session-info p {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--paper-dim);
      margin: 0;
      letter-spacing: 0.3px;
    }

    .badge {
      background: var(--olive);
      color: var(--paper);
      padding: 5px 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge.day { background: transparent; border: 1px solid var(--field-line); color: var(--paper-dim); }

    .divider { height: 1px; background: var(--field-line); margin: 12px 0; }

    .toast {
      position: fixed;
      bottom: 84px; left: 50%;
      transform: translateX(-50%);
      background: var(--coyote);
      color: var(--black-olive);
      padding: 10px 18px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 1000;
      animation: slideUp 0.3s ease-out;
      white-space: nowrap;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--paper-dim);
      border: 1px dashed var(--field-line);
    }

    .empty-state .icon-mark {
      width: 32px; height: 32px;
      border: 1.5px solid var(--field-line);
      transform: rotate(45deg);
      margin: 0 auto 16px;
    }

    .empty-state p {
      margin: 6px 0;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .tcx-analysis {
      background: var(--field-dark);
      border: 1px solid var(--field-line);
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }

    .tcx-analysis::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 24px; height: 24px;
      border-top: 2px solid var(--coyote);
      border-left: 2px solid var(--coyote);
    }

    .tcx-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .tcx-date { font-family: var(--font-mono); font-size: 12px; color: var(--paper); font-weight: 600; }
    .tcx-meta { font-family: var(--font-mono); font-size: 11px; color: var(--paper-dim); margin-top: 4px; }

    .tcx-grade { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; }

    .grade-Aplus, .grade-A { color: var(--olive-bright); }
    .grade-B { color: var(--signal-blue); }
    .grade-C { color: var(--signal-amber); }
    .grade-D, .grade-F { color: var(--rust-bright); }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }

    .stat-box {
      background: var(--field-surface);
      border: 1px solid var(--field-line);
      padding: 10px;
      text-align: center;
    }

    .stat-box .value { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--coyote); }
    .stat-box .label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--paper-dim);
      margin-top: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .finding-line {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid var(--field-line);
      font-size: 12px;
    }

    .finding-line:first-of-type { border-top: none; }
    .finding-pos { color: var(--olive-bright); }
    .finding-warn { color: var(--signal-amber); }
    .finding-crit { color: var(--rust-bright); }

    .hr-zone { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .hr-zone-bar { flex: 1; height: 5px; background: var(--field-surface); overflow: hidden; }
    .hr-zone-fill { height: 100%; transition: width 0.3s; }
    .hr-zone-label { font-family: var(--font-mono); font-size: 10px; width: 90px; letter-spacing: 0.3px; }
    .hr-zone-pct { font-family: var(--font-mono); font-size: 11px; color: var(--paper); font-weight: 600; width: 32px; text-align: right; }

    .upload-zone {
      border: 1.5px dashed var(--field-line);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }

    .upload-zone:hover { border-color: var(--coyote-dim); }

    .upload-zone .upload-icon {
      width: 28px; height: 28px;
      border: 1.5px solid var(--coyote-dim);
      margin: 0 auto 12px;
      position: relative;
    }

    .upload-zone .upload-icon::before, .upload-zone .upload-icon::after {
      content: '';
      position: absolute;
      background: var(--coyote-dim);
    }

    .upload-zone .upload-icon::before { width: 12px; height: 1.5px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .upload-zone .upload-icon::after { width: 1.5px; height: 12px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--field-line); }

    @media (max-width: 480px) {
      .clock-number { font-size: 56px; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .onboarding-body { padding: 22px 18px; }
    }

    /* ═══ ACTIVITY DETAIL / SESSION DETAIL ═══ */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: var(--black-olive);
      z-index: 200;
      display: flex;
      flex-direction: column;
    }

    .detail-header {
      background: var(--field-dark);
      border-bottom: 1px solid var(--field-line);
      padding: 0 12px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .detail-back {
      background: transparent;
      border: 1px solid var(--field-line);
      color: var(--paper-dim);
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 16px;
    }

    .detail-header-title {
      font-family: var(--font-display);
      font-size: 15px;
      color: var(--paper);
      flex: 1;
    }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      max-width: 540px;
      margin: 0 auto;
      width: 100%;
      padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    }

    /* PLAN vs ACTUAL COMPARISON */
    .compare-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--field-line);
    }

    .compare-row:last-child { border-bottom: none; }

    .compare-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--paper-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      grid-column: 1 / -1;
      margin-bottom: 2px;
    }

    .compare-planned, .compare-actual {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
    }

    .compare-planned { color: var(--paper-dim); text-align: left; }
    .compare-actual { color: var(--coyote); text-align: right; }
    .compare-arrow { color: var(--field-line); font-size: 12px; }

    .compare-delta {
      font-family: var(--font-mono);
      font-size: 10px;
      text-align: center;
      grid-column: 1 / -1;
      margin-top: 2px;
    }

    .delta-good { color: var(--olive-bright); }
    .delta-bad { color: var(--rust-bright); }
    .delta-neutral { color: var(--paper-dim); }

    /* SUB-STEPS CHECKLIST */
    .substep-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--field-line);
      cursor: pointer;
    }

    .substep-item:last-child { border-bottom: none; }

    .substep-check {
      width: 20px;
      height: 20px;
      border: 1.5px solid var(--field-line);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--coyote);
    }

    .substep-check.checked {
      border-color: var(--coyote);
      background: rgba(201, 169, 97, 0.15);
    }

    .substep-text {
      font-size: 13px;
      color: var(--paper);
      flex: 1;
    }

    .substep-text.done { text-decoration: line-through; color: var(--paper-dim); }

    /* SPLITS TABLE */
    .splits-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .splits-table th {
      text-align: left;
      color: var(--coyote-dim);
      font-weight: 500;
      padding: 6px 4px;
      border-bottom: 1px solid var(--field-line);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-size: 9px;
    }

    .splits-table td {
      padding: 8px 4px;
      border-bottom: 1px solid var(--field-line);
      color: var(--paper);
    }

    .splits-table tr:last-child td { border-bottom: none; }
    .splits-table .num-cell { color: var(--coyote); font-weight: 600; }

    /* CADENCE SEGMENT BARS */
    .cadence-seg-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .cadence-seg-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--paper-dim);
      width: 50px;
    }

    .cadence-seg-bar {
      flex: 1;
      height: 16px;
      background: var(--field-surface);
      position: relative;
    }

    .cadence-seg-fill {
      height: 100%;
      background: var(--olive);
    }

    .cadence-seg-val {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--paper);
      width: 50px;
      text-align: right;
    }

    /* WALK SEGMENT TAGS */
    .walk-tag {
      display: inline-block;
      background: var(--field-surface);
      border: 1px solid var(--signal-blue);
      color: var(--signal-blue);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 8px;
      margin: 3px 4px 3px 0;
    }

    /* DRIFT INDICATOR */
    .drift-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--field-surface);
      border: 1px solid var(--field-line);
      margin-bottom: 8px;
    }

    .drift-value {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
    }

    .drift-good { color: var(--olive-bright); }
    .drift-warn { color: var(--signal-amber); }
    .drift-bad { color: var(--rust-bright); }

    /* MANUAL FIELD INPUTS (Training Effect, Load) */
    .manual-field-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .manual-field-row label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--paper-dim);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .manual-field-row input {
      padding: 8px 10px;
      font-size: 13px;
      text-align: right;
    }

    /* DATE PICKER ROW */
    .date-picker-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .date-picker-row input[type="date"] {
      flex: 1;
    }

    /* LINK SESSION SELECTOR */
    .link-session-select {
      width: 100%;
      margin-bottom: 12px;
    }

    /* MARKDOWN EXPORT MODAL */
    .md-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 13, 8, 0.92);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .md-modal-card {
      background: var(--field-dark);
      border: 1px solid var(--coyote-dim);
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .md-modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--field-line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .md-modal-title {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--coyote);
      text-transform: uppercase;
    }

    .md-modal-close {
      background: transparent;
      border: none;
      color: var(--paper-dim);
      font-size: 18px;
      cursor: pointer;
    }

    .md-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .md-textarea {
      width: 100%;
      min-height: 360px;
      background: var(--field-surface);
      border: 1px solid var(--field-line);
      color: var(--paper);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.6;
      padding: 12px;
      resize: vertical;
      white-space: pre;
    }

    .md-modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--field-line);
      display: flex;
      gap: 8px;
    }

    /* SECTION TOGGLES */
    .section-toggle {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .section-toggle button {
      flex-shrink: 0;
      background: var(--field-surface);
      border: 1px solid var(--field-line);
      color: var(--paper-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 7px 12px;
      cursor: pointer;
    }

    .section-toggle button.active {
      border-color: var(--coyote);
      color: var(--coyote);
      background: rgba(201, 169, 97, 0.1);
    }

    .activity-list-item {
      background: var(--field-dark);
      border: 1px solid var(--field-line);
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .activity-list-item:hover { border-color: var(--coyote-dim); }

    .activity-list-left .alt-date {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--paper);
      font-weight: 600;
    }

    .activity-list-left .alt-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--paper-dim);
      margin-top: 3px;
    }

    .link-pill {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--olive-bright);
      border: 1px solid var(--olive);
      padding: 2px 6px;
      margin-top: 4px;
      display: inline-block;
    }

    /* ── Accessibility ─────────────────────────────────────────────── */
    :focus-visible { outline: 2px solid var(--coyote, #c9a45c) !important; outline-offset: 2px; }
    input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--coyote, #c9a45c); }
    [role="button"] { cursor: pointer; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
    /* ── Tables / disclosure widgets added in 2026.10.13 ───────────── */
    details.fc-details > summary { list-style: none; cursor: pointer; }
    details.fc-details > summary::-webkit-details-marker { display: none; }
    .steps-table td { vertical-align: top; }
    @media (max-width: 420px) { nav button { font-size: 8px; letter-spacing: 0.3px; } }
    /* 2026.10.28: example text must not look like a filled value */
    input::placeholder, textarea::placeholder { color: var(--paper-dim); opacity: .55; font-style: italic; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    const STORAGE_KEY = 'fitcoach5k_tactical';
    const SCHEMA_VERSION = 2; // bump when state shape changes in a breaking way
    const DEFAULT_STATE = {
      schemaVersion: SCHEMA_VERSION,
      profile: null,
      plan: [],
      tcxSessions: [],
      manualSessions: [],
      bodyMeasurements: [], // [{ dateISO, weightLb, waistCm, chestCm, abdomenCm, bicepCm, forearmCm, thighCm, calfCm, notes }]
      paceOverrides: {}, // { 'easy': 660, 'tempo': 540, ... } in sec/mi
      injuries: [], // [{ id, dateISO, bodyPart, severity, description, resolved, resolvedDateISO }]
      // Shoes/boots. Mileage = baseMi (Garmin total as of baseAsOfISO) + sessions assigned after that date.
      gear: [], // [{ id, name, kind:'shoe'|'boot', uses:[...], baseMi, baseAsOfISO, limitMi, retired }]
      settings: {
        lang: 'en',
        lastGearId: null,      // remembered so the next imported activity is prefilled with it
        lastHrSource: 'hrm600', // 'hrm600' | 'hrm200' | 'optical'
        bodyMeasUnit: 'in', // 'in' | 'cm' — default in, persisted across reloads
        // Which circumference measures are shown in the history table / chart. Weight always shows.
        bodyMeasVisible: { waist: true, chest: true, abdomen: true, bicep: true, forearm: true, thigh: true, calf: true }
      },
      lastBackupISO: null // set whenever a full JSON backup is exported
    };

    
    // Report mode toggle: 'full' or 'quick'
    let reportMode = 'full';
    let mdModalActivityId = null; // which activity's markdown is currently loaded in the modal, so toggling can regenerate it

    function toggleReportMode() {
      reportMode = reportMode === 'full' ? 'quick' : 'full';
      if (mdModalActivityId) {
        const t = state.tcxSessions.find(a => a.id === mdModalActivityId);
        if (t) mdModalContent = buildActivityMarkdown(t);
      }
      render();
    }

    let state = loadState();
    let currentView = state.profile?.onboardingComplete ? 'home' : 'onboarding';
    let currentStep = 0;
    let onboardingData = {};
    let detailOverlay = null; // { type: 'session'|'activity', id: ... }
    let mdModalContent = null;
    let mdModalKind = 'report'; // 'report' | 'app' — which Markdown flavour the modal shows
    let activitySplitUnit = 'mi';
    let manualSessionFormOpen = false;
    // Persisted in state.settings so it survives reload; fall back to 'in' default for older saves.
    let bodyMeasUnit = state.settings?.bodyMeasUnit || 'in'; // 'in' | 'cm' — display/entry unit for circumferences
    let bodyMeasCompareA = null; // dateISO selected in the "compare 2 dates" picker
    let bodyMeasCompareB = null;
    // Set by an Enter/"Next" keypress right before a save-triggered render() destroys the DOM;
    // render() reads this afterward and refocuses the next field so mobile typing can keep going.
    let _focusAfterRender = null;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(saved);
        // Merge onto defaults so new fields (schemaVersion, lastBackupISO, etc.) always exist.
        const merged = { ...DEFAULT_STATE, ...parsed };
        // settings is a nested object — a shallow merge above would drop new sub-keys
        // (e.g. bodyMeasUnit, bodyMeasVisible) for anyone with an older save that only had { lang }.
        merged.settings = { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) };
        merged.settings.bodyMeasVisible = { ...DEFAULT_STATE.settings.bodyMeasVisible, ...(parsed.settings?.bodyMeasVisible || {}) };
        merged.schemaVersion = SCHEMA_VERSION;
        return merged;
      } catch (e) {
        return { ...DEFAULT_STATE };
      }
    }


    // ═══════════════════════════════════════════════════════════════════════
    // GEAR + HR SOURCE (2026.10.27). A Garmin TCX carries neither the shoe nor the HR sensor,
    // so both are chosen in the app. The activity is prefilled with the last choice and flagged
    // "auto" until the athlete confirms it. Optical-HR sessions get a visible warning because
    // they are not valid for zones, decoupling or LTHR.
    // ═══════════════════════════════════════════════════════════════════════
    const HR_SOURCES = {
      hrm600:  { es: 'Banda HRM 600', en: 'HRM 600 strap', strap: true },
      hrm200:  { es: 'Banda HRM 200', en: 'HRM 200 strap', strap: true },
      optical: { es: 'Sensor óptico del reloj', en: 'Watch optical sensor', strap: false }
    };
    const GEAR_USES = {
      race:      { es: 'Carrera / específica', en: 'Race / race-specific' },
      tempo:     { es: 'Tempo', en: 'Tempo' },
      intervals: { es: 'Intervalos y cuestas', en: 'Intervals & hills' },
      long:      { es: 'Larga', en: 'Long run' },
      easy:      { es: 'Fácil', en: 'Easy' },
      recovery:  { es: 'Recuperación', en: 'Recovery' },
      ruck:      { es: 'Marcha con carga', en: 'Ruck' }
    };
    const GEAR_SEED = [
      { id: 'g_rebel',  name: 'New Balance FuelCell Rebel', kind: 'shoe', uses: ['race', 'tempo', 'intervals'], baseMi: 33.8, baseAsOfISO: '2026-10-25', limitMi: 400, retired: false },
      { id: 'g_nova',   name: 'ASICS Novablast 6',          kind: 'shoe', uses: ['long', 'easy'],              baseMi: 94.9, baseAsOfISO: '2026-10-25', limitMi: 400, retired: false },
      { id: 'g_adren',  name: 'Brooks Adrenaline GTS',      kind: 'shoe', uses: ['easy', 'long'],              baseMi: 16.8, baseAsOfISO: '2026-10-25', limitMi: 400, retired: false },
      { id: 'g_bondi',  name: 'Hoka Bondi 9',               kind: 'shoe', uses: ['easy', 'recovery'],          baseMi: 15.2, baseAsOfISO: '2026-10-25', limitMi: 400, retired: false },
      { id: 'g_oakley', name: 'Botas Oakley',               kind: 'boot', uses: ['ruck'],                      baseMi: 0,    baseAsOfISO: '2026-10-25', limitMi: null, retired: false }
    ];

    function ensureGear() {
      if (!Array.isArray(state.gear)) state.gear = [];
      if (!state.settings) state.settings = { ...DEFAULT_STATE.settings };
      if (!state.settings.gearSeeded) {
        if (state.gear.length === 0) state.gear = GEAR_SEED.map(g => ({ ...g, uses: [...g.uses] }));
        state.settings.gearSeeded = true;
        // The athlete stated the Instinct 2 had no strap paired: mark those sessions optical.
        (state.tcxSessions || []).forEach(s => {
          if (/instinct 2/i.test(s.activityName || '') && s.manualFields && !s.manualFields.hrSource) s.manualFields.hrSource = 'optical';
        });
        saveState();
      }
      if (!state.settings.lastHrSource) state.settings.lastHrSource = 'hrm600';
    }

    const gearById = (id) => (state.gear || []).find(g => g.id === id) || null;
    const hrSourceLabel = (k) => HR_SOURCES[k] ? HR_SOURCES[k][getLang() === 'es' ? 'es' : 'en'] : (getLang() === 'es' ? 'Sin indicar' : 'Not set');
    const isOpticalHR = (act) => act?.manualFields?.hrSource === 'optical';

    function gearMiles(g) {
      if (!g) return 0;
      let mi = Number(g.baseMi) || 0;
      (state.tcxSessions || []).forEach(s => {
        if (s.manualFields?.gearId === g.id && (s.dateISO || '') > (g.baseAsOfISO || '')) mi += Number(s.totalDistMi) || 0;
      });
      (state.manualSessions || []).forEach(m => {
        if (m.gearId === g.id && (m.dateISO || '') > (g.baseAsOfISO || '')) mi += Number(m.distMi) || 0;
      });
      return Math.round(mi * 10) / 10;
    }
    const gearWearPct = (g) => g && g.limitMi ? Math.round(gearMiles(g) / g.limitMi * 100) : null;

    function gearLastUsedISO(g) {
      let last = '';
      (state.tcxSessions || []).forEach(s => { if (s.manualFields?.gearId === g.id && (s.dateISO || '') > last) last = s.dateISO; });
      return last;
    }

    // Plan session → gear use key. Race-specific and ruck days are recognised from the plan text.
    function gearUseForSession(sess) {
      if (!sess) return null;
      const txt = String(sess.notes || '').toLowerCase();
      if (/chaleco|ruck|mochila/.test(txt)) return 'ruck';
      if (sess.type === 'rest') return null;
      if (/recorrido de la carrera|específic|especific|race_sim/.test(txt) || sess.type === 'race_sim') return 'race';
      if (sess.type === 'tempo') return 'tempo';
      if (sess.type === 'intervals') return 'intervals';
      if (sess.type === 'long') return 'long';
      if (sess.type === 'easy') return /recuperaci|recovery/.test(txt) ? 'recovery' : 'easy';
      return null; // cross-training without load, strength
    }

    // Best gear for a use: active, under its limit, matching use. Quality, race, long and ruck keep a
    // fixed preference (first match in list order); easy/recovery rotate to the pair used longest ago.
    function recommendGear(use) {
      if (!use) return null;
      const es = getLang() === 'es';
      const active = (state.gear || []).filter(g => !g.retired && (!g.limitMi || gearMiles(g) < g.limitMi));
      let cands = active.filter(g => (g.uses || []).includes(use));
      if (!cands.length && use === 'recovery') cands = active.filter(g => (g.uses || []).includes('easy'));
      if (!cands.length) return null;
      let pick;
      if (use === 'race' || use === 'tempo' || use === 'intervals' || use === 'long' || use === 'ruck') {
        pick = cands[0];
      } else {
        pick = [...cands].sort((a, b) => gearLastUsedISO(a).localeCompare(gearLastUsedISO(b)) || (gearMiles(a) - gearMiles(b)))[0];
      }
      const pct = gearWearPct(pick);
      const why = {
        race: es ? 'mismo zapato que usarás en el 10K: se confirma en el recorrido' : 'same shoe you will race in',
        tempo: es ? 'liviano y reactivo para calidad; se reserva para calidad y carrera' : 'light and responsive; kept for quality and race',
        intervals: es ? 'liviano y reactivo para calidad; se reserva para calidad y carrera' : 'light and responsive; kept for quality and race',
        long: es ? 'más amortiguación para la duración' : 'more cushioning for duration',
        easy: es ? 'rotación: el par que lleva más días sin usarse' : 'rotation: the pair unused the longest',
        recovery: es ? 'máxima amortiguación para piernas cansadas' : 'max cushioning for tired legs',
        ruck: es ? 'botas domadas para la marcha con chaleco' : 'broken-in boots for the ruck'
      }[use] || '';
      const warn = pct != null && pct >= 85 ? (es ? ` · ⚠ ${pct}% de su vida útil` : ` · ⚠ ${pct}% of lifespan`) : '';
      return { gear: pick, use, why: why + warn };
    }

    function renderGearRecLine(sess) {
      const rec = recommendGear(gearUseForSession(sess));
      if (!rec) return '';
      const es = getLang() === 'es';
      return `<p style="font-size:11px; color:var(--paper-dim); margin-top:6px;">${rec.gear.kind === 'boot' ? '🥾' : '👟'} ${es ? 'Recomendado' : 'Recommended'}: <strong style="color:var(--paper);">${esc(rec.gear.name)}</strong> — ${rec.why}</p>`;
    }

    // Activity detail card: gear + HR source selectors, recommendation, optical warning.
    // Follow-up (phase 6) needs these notes in every report. Shown from the start of follow-up on. (2026.10.28)
    const FOLLOWUP_FROM = '2026-10-28';
    function renderFollowupMissing(act) {
      if (!act || (act.dateISO || '') < FOLLOWUP_FROM) return '';
      const es = getLang() === 'es';
      const mf = act.manualFields || {};
      const need = [
        ['rpe', es ? 'esfuerzo (RPE)' : 'effort (RPE)'], ['painNotes', es ? 'dolor' : 'pain'],
        ['sleepHours', es ? 'sueño' : 'sleep'], ['hrv', es ? 'VFC de la noche' : 'overnight HRV'],
        ['restingHR', es ? 'FC en reposo' : 'resting HR'], ['feelsLike', es ? 'sensación térmica' : 'feels-like'],
        ['gearId', es ? 'zapato' : 'shoe'], ['hrSource', es ? 'fuente de FC' : 'HR source']
      ].filter(([k]) => mf[k] === undefined || mf[k] === null || String(mf[k]).trim() === '').map(([, l]) => l);
      if (!need.length) return `<p style="font-size:11px; color:var(--olive-bright); margin:0 0 12px;">${es ? '✓ Notas del seguimiento completas.' : '✓ Follow-up notes complete.'}</p>`;
      return `<div class="card" style="border-left:3px solid var(--signal-amber);">
        <p style="font-size:11px; color:var(--signal-amber); line-height:1.5;">${es ? 'Faltan para el informe: ' : 'Missing for the report: '}<strong>${need.join(', ')}</strong>.${es ? ' En el dolor escribe "0" si no hay.' : ' For pain write "0" if none.'}</p>
      </div>`;
    }
    function renderGearHrCard(act) {
      const es = getLang() === 'es';
      const mf = act.manualFields || {};
      const linked = act.linkedPlanDay ? state.plan.find(s => s.day === act.linkedPlanDay) : null;
      const planSess = linked || state.plan.find(s => s.dateISO === act.dateISO) || null;
      const rec = recommendGear(gearUseForSession(planSess));
      const gears = (state.gear || []).filter(g => !g.retired || g.id === mf.gearId);
      const g = gearById(mf.gearId);
      return `
        <div class="card" style="${isOpticalHR(act) ? 'border-left:3px solid var(--rust);' : ''}">
          <div class="card-title">${es ? 'EQUIPO Y SENSOR DE FC' : 'GEAR & HR SENSOR'}</div>
          <div style="margin-bottom:10px;">
            <label class="form-label" style="display:block; margin-bottom:4px;">${es ? 'Calzado' : 'Footwear'}</label>
            <select id="mf-gearId-${act.id}" style="width:100%;" onchange="saveManualField('${act.id}', 'gearId', this.value)">
              <option value="">${es ? '— sin indicar —' : '— not set —'}</option>
              ${gears.map(x => `<option value="${esc(x.id)}" ${mf.gearId === x.id ? 'selected' : ''}>${esc(x.name)}${x.retired ? (es ? ' (retirado)' : ' (retired)') : ''}</option>`).join('')}
            </select>
          </div>
          <div style="margin-bottom:6px;">
            <label class="form-label" style="display:block; margin-bottom:4px;">${es ? 'Fuente de FC' : 'HR source'}</label>
            <select id="mf-hrSource-${act.id}" style="width:100%;" onchange="saveManualField('${act.id}', 'hrSource', this.value)">
              <option value="">${es ? '— sin indicar —' : '— not set —'}</option>
              ${Object.keys(HR_SOURCES).map(k => `<option value="${k}" ${mf.hrSource === k ? 'selected' : ''}>${hrSourceLabel(k)}</option>`).join('')}
            </select>
          </div>
          ${mf.gearAuto ? `<p style="font-size:10px; color:var(--signal-amber); margin-top:4px;">${es ? 'Rellenado con lo último que usaste. Confírmalo o cámbialo.' : 'Prefilled with your last choice. Confirm or change it.'}</p>` : ''}
          ${g ? `<p style="font-size:11px; color:var(--paper-dim); margin-top:6px;">${esc(g.name)}: ${gearMiles(g)} mi${g.limitMi ? ` / ${g.limitMi} (${gearWearPct(g)}%)` : ''}</p>` : ''}
          ${rec ? `<p style="font-size:11px; color:var(--paper-dim); margin-top:6px;">${rec.gear.kind === 'boot' ? '🥾' : '👟'} ${es ? 'Recomendado para esta sesión' : 'Recommended for this session'}: <strong style="color:var(--paper);">${esc(rec.gear.name)}</strong> — ${rec.why}</p>` : ''}
          ${isOpticalHR(act) ? `<p style="font-size:11px; color:var(--rust); margin-top:8px; line-height:1.4;">⚠ ${es ? 'FC del sensor óptico: no es válida para tiempo en zonas, decoupling ni cálculo de umbral. Úsala solo como referencia.' : 'Optical HR: not valid for time in zones, decoupling or threshold. Reference only.'}</p>` : ''}
        </div>`;
    }

    // "Más" view: gear list with mileage, add / edit / retire, default HR source.
    function renderGearManagementCard() {
      const es = getLang() === 'es';
      const rows = (state.gear || []).map(g => {
        const mi = gearMiles(g), pct = gearWearPct(g);
        const barColor = pct == null ? 'var(--olive-bright)' : pct >= 100 ? 'var(--rust)' : pct >= 85 ? 'var(--signal-amber)' : 'var(--olive-bright)';
        return `
          <div style="padding:10px 0; border-top:1px solid var(--field-line); ${g.retired ? 'opacity:0.5;' : ''}">
            <div style="display:flex; justify-content:space-between; gap:8px; align-items:center;">
              <input type="text" value="${esc(g.name)}" aria-label="${es ? 'Nombre' : 'Name'}" style="flex:1; min-width:0; font-size:12px;" onchange="updateGearField('${g.id}', 'name', this.value)" />
              <button class="btn-small" onclick="toggleGearRetired('${g.id}')">${g.retired ? (es ? 'Reactivar' : 'Reactivate') : (es ? 'Retirar' : 'Retire')}</button>
            </div>
            <div style="font-size:11px; color:var(--paper-dim); margin:6px 0 4px;">${g.kind === 'boot' ? '🥾' : '👟'} ${mi} mi${g.limitMi ? ` / ${g.limitMi} mi (${pct}%)` : ''}</div>
            ${g.limitMi ? `<div style="height:6px; background:var(--field-surface); border-radius:3px; overflow:hidden;"><div style="height:100%; width:${Math.min(100, pct)}%; background:${barColor};"></div></div>` : ''}
            <div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;">
              ${Object.keys(GEAR_USES).map(u => `<button class="btn-small" style="${(g.uses || []).includes(u) ? 'border-color:var(--coyote);color:var(--coyote);' : ''}" onclick="toggleGearUse('${g.id}', '${u}')">${GEAR_USES[u][es ? 'es' : 'en']}</button>`).join('')}
            </div>
            <div style="display:flex; gap:8px; margin-top:6px; font-size:10px; color:var(--paper-dim); align-items:center; flex-wrap:wrap;">
              <label>${es ? 'Millas base' : 'Base miles'} <input type="text" inputmode="decimal" value="${g.baseMi}" style="width:60px;" onchange="updateGearField('${g.id}', 'baseMi', this.value)" /></label>
              <label>${es ? 'al' : 'as of'} <input type="date" value="${g.baseAsOfISO || ''}" onchange="updateGearField('${g.id}', 'baseAsOfISO', this.value)" /></label>
              <label>${es ? 'Límite' : 'Limit'} <input type="text" inputmode="numeric" value="${g.limitMi || ''}" placeholder="—" style="width:64px;" onchange="updateGearField('${g.id}', 'limitMi', this.value)" /></label>
            </div>
          </div>`;
      }).join('');
      return `
        <div class="card">
          <div class="card-title">${es ? 'CALZADO Y SENSOR DE FC' : 'FOOTWEAR & HR SENSOR'}</div>
          <p style="font-size:10px; color:var(--paper-dim); margin-bottom:8px; line-height:1.4;">${es ? 'El TCX de Garmin no trae ni el zapato ni la banda: se eligen en cada actividad. Millas = millas base (de Garmin Connect) + actividades asignadas después de esa fecha. Los botones marcan para qué sesiones se recomienda cada par.' : 'Garmin TCX carries neither the shoe nor the strap: pick them per activity. Miles = base miles (from Garmin Connect) + activities assigned after that date. Buttons mark which sessions each pair is recommended for.'}</p>
          <div style="margin-bottom:8px;">
            <label class="form-label" style="display:block; margin-bottom:4px;">${es ? 'Fuente de FC por defecto' : 'Default HR source'}</label>
            <select style="width:100%;" onchange="setDefaultHrSource(this.value)">
              ${Object.keys(HR_SOURCES).map(k => `<option value="${k}" ${state.settings.lastHrSource === k ? 'selected' : ''}>${hrSourceLabel(k)}</option>`).join('')}
            </select>
          </div>
          ${rows}
          <div style="display:flex; gap:6px; margin-top:10px;">
            <input type="text" id="newGearName" placeholder="${es ? 'Nombre del nuevo par' : 'New pair name'}" style="flex:1; min-width:0; font-size:12px;" />
            <select id="newGearKind" style="font-size:12px;"><option value="shoe">👟</option><option value="boot">🥾</option></select>
            <button class="btn-small" onclick="addGear()">${es ? 'Añadir' : 'Add'}</button>
          </div>
        </div>`;
    }

    function updateGearField(id, field, value) {
      const g = gearById(id); if (!g) return;
      if (field === 'baseMi') { const v = parseFloat(value); if (isNaN(v) || v < 0) { showToast(getLang() === 'es' ? 'Millas inválidas' : 'Invalid miles'); render(); return; } g.baseMi = v; }
      else if (field === 'limitMi') { const v = parseFloat(value); g.limitMi = (isNaN(v) || v <= 0) ? null : v; }
      else if (field === 'name') { const v = String(value || '').trim(); if (!v) { render(); return; } g.name = v; }
      else g[field] = value;
      saveState(); render();
    }
    function toggleGearUse(id, use) {
      const g = gearById(id); if (!g) return;
      g.uses = (g.uses || []).includes(use) ? g.uses.filter(u => u !== use) : [...(g.uses || []), use];
      saveState(); render();
    }
    function toggleGearRetired(id) {
      const g = gearById(id); if (!g) return;
      g.retired = !g.retired;
      if (g.retired && state.settings.lastGearId === id) state.settings.lastGearId = null;
      saveState(); render();
    }
    function addGear() {
      const name = (document.getElementById('newGearName')?.value || '').trim();
      const kind = document.getElementById('newGearKind')?.value || 'shoe';
      if (!name) { showToast(getLang() === 'es' ? 'Escribe el nombre' : 'Enter a name'); return; }
      state.gear.push({ id: 'g_' + Date.now().toString(36), name, kind, uses: kind === 'boot' ? ['ruck'] : ['easy'], baseMi: 0, baseAsOfISO: addDaysISO(todayISO(), -1), limitMi: kind === 'boot' ? null : 400, retired: false });
      saveState(); render();
    }
    function setDefaultHrSource(v) {
      if (!HR_SOURCES[v]) return;
      state.settings.lastHrSource = v; saveState(); render();
    }

    // New TCX: prefill HR source and gear with the last choices (Instinct 2 files → optical).
    function prefillGearHr(act) {
      if (!act.manualFields) act.manualFields = {};
      const mf = act.manualFields;
      if (!mf.hrSource) mf.hrSource = /instinct 2/i.test(act.activityName || '') ? 'optical' : (state.settings.lastHrSource || 'hrm600');
      if (!mf.gearId && state.settings.lastGearId && gearById(state.settings.lastGearId) && !gearById(state.settings.lastGearId).retired) {
        mf.gearId = state.settings.lastGearId;
        mf.gearAuto = true;
      }
    }
    ensureGear(); // after the gear constants above are initialised

    let _quotaWarned = false;
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Most likely QuotaExceededError from too many stored TCX sessions with detailed splits.
        console.error('saveState failed:', e);
        if (!_quotaWarned) {
          _quotaWarned = true;
          const msg = getLang() === 'es'
            ? '⚠ Almacenamiento lleno. Exporta un backup (.json) y considera borrar actividades viejas para liberar espacio.'
            : '⚠ Storage full. Export a backup (.json) and consider deleting old activities to free space.';
          try { showToast(msg); } catch (_) { alert(msg); }
        }
      }
    }

    // Approximate size of stored state in KB (localStorage cap is typically ~5MB per origin).
    function getStorageSizeKB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || '';
        return Math.round((raw.length * 2) / 1024); // UTF-16 ≈ 2 bytes/char
      } catch (e) { return 0; }
    }

    const secToMMSS = (sec) => {
      if (!sec || sec <= 0) return '--:--';
      const m = Math.floor(sec / 60);
      const s = Math.round(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    };

    const secToHHMMSS = (sec) => {
      if (!sec || sec <= 0) return '--:--';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.round(sec % 60).toString().padStart(2, '0');
      return h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${s}` : `${m}:${s}`;
    };

    // Like secToMMSS but treats 0 as a valid elapsed-time offset, not "no data"
    const secToMMSSOffset = (sec) => {
      if (sec == null || isNaN(sec) || sec < 0) return '--:--';
      const m = Math.floor(sec / 60);
      const s = Math.round(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    };

    // HTML-escape for any user-typed text interpolated into innerHTML templates.
    const esc = (v) => String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    // LOCAL calendar date. toISOString() is UTC, which in Puerto Rico (UTC-4) flips to "tomorrow"
    // every evening after 8 PM — that made "today's session" and the backup date wrong at night.
    const todayISO = () => {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };

    // `new Date('YYYY-MM-DD')` parses as UTC midnight per spec, so calling local-timezone
    // getters (getDay/getDate/setDate) on it rolls back to the PREVIOUS calendar day for any
    // timezone behind UTC (e.g. Puerto Rico, UTC-4) — this bit us in the weekly calendar view
    // and plan import, where "today" kept resolving to Sunday instead of Monday. Use this
    // helper instead whenever a date-only ISO string needs to become a real local calendar date.
    const parseISODateLocal = (iso) => {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    };

    // Calendar days from today (local) to `iso` (local). new Date('YYYY-MM-DD') is UTC midnight —
    // 8 PM the day before in Puerto Rico — so the old formula said 45 where the races card said 46.
    const daysUntil = (iso) => {
      if (!iso) return 0;
      const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
      const now = new Date();
      const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.max(0, Math.round((new Date(y, m - 1, d) - t0) / 86400000));
    };

    // Round to whole seconds BEFORE splitting into m:ss — rounding only the seconds part printed
    // 839.6 s as "13:60/mi" instead of "14:00/mi".
    const fmtPace = (spm) => {
      if (!spm || spm <= 0) return '—';
      const r = Math.round(spm);
      const m = Math.floor(r / 60);
      const s = (r % 60).toString().padStart(2, '0');
      return `${m}:${s}/mi`;
    };

    const metersToMiles = (m) => m / 1609.344;
    const celsiusToF = (c) => c * 9 / 5 + 32;

    const SESSION_TAGS = {
      easy: 'EZ', tempo: 'TMP', intervals: 'INT',
      long: 'LNG', race_sim: 'SIM', rest: 'REST', cross_training: 'CRUZ'
    };
    // Per-session tag: cross-training days are either a vest march or strength-only.
    function sessionTag(s) {
      if (!s) return '—';
      if (s.type === 'cross_training') {
        const txt = String(s.notes || '').toLowerCase();
        if (/chaleco|caminata/.test(txt)) return getLang() === 'es' ? 'MARCHA' : 'RUCK';
        if (/fuerza/.test(txt)) return getLang() === 'es' ? 'FZA' : 'STR';
      }
      return SESSION_TAGS[s.type] || String(s.type || '—').toUpperCase();
    }

    const danielsVO2 = (v) => -4.60 + 0.182258 * v + 0.000104 * v * v;
    const danielsPct = (t) => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);

    // Decides whether a VDOT number from this session is physiologically meaningful.
    // Returns { valid, reason, reasonEs } — callers suppress the value when valid is false.
    function vdotValidity({ sport, avgHR, lthr, elevGainPerMi, totalTimeSec, sessionType }) {
      if (sport !== 'running') {
        return { valid: false, reason: 'not a run', reasonEs: 'no aplica a ciclismo' };
      }
      // An explicitly easy/recovery/cross session is never a valid VDOT effort, whatever the
      // heart rate happened to do. Matched as substrings because the label arrives in several
      // shapes: a plan-day type ('easy', 'cross_training') or a free-text manual tag
      // ('Z2 / Easy', 'Recovery run').
      if (sessionType) {
        const st = String(sessionType).toLowerCase();
        const easyMarkers = ['easy', 'facil', 'fácil', 'rest', 'descanso', 'recovery',
                             'recuperacion', 'recuperación', 'cross', 'z1', 'z2'];
        if (easyMarkers.some(m => st.includes(m))) {
          return { valid: false, reason: `session type '${sessionType}' is not a race effort`,
                   reasonEs: 'sesión fácil/recuperación' };
        }
      }
      if (elevGainPerMi > 30) {
        return {
          valid: false,
          reason: `${Math.round(elevGainPerMi)} m climb per mile`,
          reasonEs: `terreno (${Math.round(elevGainPerMi)} m/mi de desnivel)`
        };
      }
      if (totalTimeSec > 0 && totalTimeSec < 480) {
        return { valid: false, reason: 'effort under 8 minutes', reasonEs: 'esfuerzo menor a 8 minutos' };
      }
      // Threshold floor: below Z4 the runner was not racing, so the time does not represent
      // what they are capable of.
      const floor = zoneFloors(lthr || 174).z4;
      if (avgHR > 0 && avgHR < floor) {
        return {
          valid: false,
          reason: `avg HR ${Math.round(avgHR)} below threshold floor ${floor}`,
          reasonEs: `esfuerzo aeróbico (FC prom ${Math.round(avgHR)} < ${floor} bpm de umbral)`
        };
      }
      return { valid: true, reason: null, reasonEs: null };
    }

    function calcVDOT(distanceMeters, timeSecs) {
      if (distanceMeters < 400 || timeSecs < 60) return 0;
      const v = danielsVO2(distanceMeters / (timeSecs / 60));
      const p = danielsPct(timeSecs / 60);
      return p > 0 ? v / p : 0;
    }

    // Solves Daniels' VDOT equation for the finishing time at ANY distance, by Newton iteration.
    // vdotTo5K() is the 5,000 m case; keeping it as a named wrapper avoids touching the dozen
    // call sites that legitimately mean "5K".
    function vdotToTime(vdot, distanceMeters) {
      if (vdot <= 0 || !distanceMeters || distanceMeters <= 0) return 0;
      // Seed proportionally to distance so longer races converge (a 25-min seed for a 21 km
      // race lands far outside the model's valid window and the solver bails immediately).
      let T2 = (distanceMeters / 5000) * 25 * 60;
      const timeFor = (T) => {
        const Tm = T / 60;
        return danielsVO2(distanceMeters / Tm) / danielsPct(Tm);
      };
      for (let i = 0; i < 50; i++) {
        const f = timeFor(T2) - vdot;
        const h = 0.01;
        const df = (timeFor(T2 + h) - timeFor(T2)) / h;
        if (Math.abs(df) < 1e-10) break;
        T2 -= f / df;
        if (T2 < 120 || T2 > 4 * 3600) break;
      }
      return Math.round(T2);
    }

    function vdotTo5K(vdot) {
      return vdotToTime(vdot, 5000);
    }

    // The VDOT the athlete's goal time demands, at their actual race distance. Used to judge
    // whether a session's VDOT is above or below what the goal requires. Binary search because
    // vdotToTime is monotonically decreasing in VDOT and cheap to evaluate.
    function vdotRequiredForGoal(profile) {
      const p = profile || state.profile;
      if (!p) return null;
      const raceM = raceDistanceMeters(p);
      const goalSec = activeGoalSec(p, raceM);
      if (!goalSec) return null;
      let lo = 20, hi = 85;
      for (let i = 0; i < 40; i++) {
        const mid = (lo + hi) / 2;
        if (vdotToTime(mid, raceM) > goalSec) lo = mid; else hi = mid;
      }
      return +((lo + hi) / 2).toFixed(1);
    }

    // Common race distances the app can target.
    const RACE_DISTANCES = [
      { key: '5k',   meters: 5000,     label: { en: '5K', es: '5K' } },
      { key: '10k',  meters: 10000,    label: { en: '10K', es: '10K' } },
      { key: '15k',  meters: 15000,    label: { en: '15K', es: '15K' } },
      { key: 'half', meters: 21097.5,  label: { en: 'Half Marathon', es: 'Media Maratón' } },
      { key: 'full', meters: 42195,    label: { en: 'Marathon', es: 'Maratón' } }
    ];
    // ── MULTI-RACE ─────────────────────────────────────────────────────────────
    // profile.races = [{ id, name, dateISO, distanceKey, goalSec, inBoots, note, resultSec }]
    // The NEXT upcoming race is the "active" one. Its values are mirrored into the legacy
    // profile fields (raceDateISO, raceDistanceKey, raceInBoots, goalRaceSec, goalFiveKSec) so
    // every existing calculation (prediction, taper, ACWR, PDF) keeps working unchanged.
    // When a race date passes, the next race becomes active automatically (5K → 10K).
    function parseTimeToSec(str) {
      const parts = String(str || '').trim().split(':').map(x => parseInt(x, 10));
      if (!parts.length || parts.some(isNaN)) return null;
      let sec;
      if (parts.length === 2) sec = parts[0] * 60 + parts[1];
      else if (parts.length === 3) sec = parts[0] * 3600 + parts[1] * 60 + parts[2];
      else return null;
      return sec > 0 ? sec : null;
    }
    function fmtRaceTime(sec) {
      if (!sec) return '';
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s2 = Math.round(sec % 60);
      return h > 0 ? h + ':' + String(m).padStart(2, '0') + ':' + String(s2).padStart(2, '0')
                   : m + ':' + String(s2).padStart(2, '0');
    }
    function raceMetersByKey(key) {
      return (RACE_DISTANCES.find(r => r.key === key)?.meters) || 5000;
    }
    function raceLabelByKey(key) {
      const row = RACE_DISTANCES.find(r => r.key === key) || RACE_DISTANCES[0];
      return row.label.en;
    }
    // Goal time at the ACTUAL race distance. Prefers the exact goal typed for the active race;
    // falls back to Riegel-scaling the legacy 5K goal.
    function activeGoalSec(profile, raceM) {
      if (profile?.goalRaceSec > 0) return Math.round(profile.goalRaceSec);
      const goal5K = profile?.goalFiveKSec || 1800;
      return Math.abs(raceM - 5000) < 1 ? goal5K : Math.round(goal5K * Math.pow(raceM / 5000, 1.06));
    }
    function ensureRaces(p) {
      if (!p) return;
      if (!Array.isArray(p.races) || !p.races.length) {
        const key = p.raceDistanceKey || '5k';
        const m = raceMetersByKey(key);
        p.races = [{
          id: 'race_' + Date.now().toString(36),
          name: '',
          dateISO: p.raceDateISO || '',
          distanceKey: key,
          goalSec: activeGoalSec(p, m),
          inBoots: p.raceInBoots !== false,
          note: '',
          resultSec: null
        }];
      }
    }
    function pickActiveRace(p) {
      const today = todayISO();
      const dated = p.races.filter(r => r.dateISO);
      const upcoming = dated.filter(r => r.dateISO >= today).sort((a, b) => a.dateISO.localeCompare(b.dateISO));
      if (upcoming.length) return upcoming[0];
      const past = dated.sort((a, b) => b.dateISO.localeCompare(a.dateISO));
      return past[0] || p.races[0];
    }
    function syncActiveRace() {
      const p = state.profile;
      if (!p) return;
      ensureRaces(p);
      const r = pickActiveRace(p);
      if (!r) return;
      p.activeRaceId = r.id;
      if (r.dateISO) p.raceDateISO = r.dateISO;
      p.raceDistanceKey = r.distanceKey || '5k';
      p.raceInBoots = r.inBoots !== false;
      const m = raceMetersByKey(p.raceDistanceKey);
      if (r.goalSec > 0) {
        p.goalRaceSec = r.goalSec;
        p.goalFiveKSec = Math.abs(m - 5000) < 1 ? r.goalSec : Math.round(r.goalSec / Math.pow(m / 5000, 1.06));
      }
    }
    function activeRace() {
      const p = state.profile;
      if (!p || !Array.isArray(p.races)) return null;
      return p.races.find(r => r.id === p.activeRaceId) || null;
    }
    function fmtRaceDateShort(iso) {
      if (!iso) return '—';
      const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      const [y, m, d] = iso.split('-');
      return String(parseInt(d, 10)).padStart(2, '0') + M[parseInt(m, 10) - 1] + y.slice(2);
    }
    function activeRaceGoalPaceStr() {
      const p = state.profile;
      if (!p) return '—';
      const m = raceMetersByKey(p.raceDistanceKey || '5k');
      const goal = activeGoalSec(p, m);
      return fmtPaceNoUnit(goal / (m / 1609.344));
    }
    function updateRace(id, key, value) {
      const p = state.profile;
      if (!p) return;
      const r = p.races.find(x => x.id === id);
      if (!r) return;
      if (key === 'goalSec' || key === 'resultSec') {
        const sec = parseTimeToSec(value);
        if (value && !sec) { showToast(getLang() === 'es' ? 'Formato MM:SS o H:MM:SS' : 'Use MM:SS or H:MM:SS'); render(); return; }
        r[key] = sec;
      } else if (key === 'inBoots') {
        r.inBoots = !!value;
      } else {
        r[key] = value;
      }
      syncActiveRace();
      saveState();
      render();
      showToast(t('toast_saved'));
    }
    function addRace() {
      const p = state.profile;
      if (!p) return;
      ensureRaces(p);
      p.races.push({ id: 'race_' + Date.now().toString(36), name: '', dateISO: '', distanceKey: '10k', goalSec: 3600, inBoots: false, note: '', resultSec: null });
      saveState();
      render();
    }
    function deleteRace(id) {
      const p = state.profile;
      if (!p || !Array.isArray(p.races) || p.races.length <= 1) {
        showToast(getLang() === 'es' ? 'Debe quedar al menos una carrera' : 'Keep at least one race');
        return;
      }
      if (!confirm(getLang() === 'es' ? '¿Eliminar esta carrera?' : 'Delete this race?')) return;
      p.races = p.races.filter(r => r.id !== id);
      syncActiveRace();
      saveState();
      render();
    }
    function renderRacesStrip() {
      const p = state.profile;
      if (!p || !Array.isArray(p.races) || p.races.length < 2) return '';
      const es = getLang() === 'es';
      const today = todayISO();
      const rows = [...p.races].filter(r => r.dateISO).sort((a, b) => a.dateISO.localeCompare(b.dateISO)).map(r => {
        const past = r.dateISO < today;
        const isActive = r.id === p.activeRaceId && !past;
        const days = daysUntil(r.dateISO);
        const label = esc(r.name) || raceLabelByKey(r.distanceKey);
        const right = past
          ? (r.resultSec ? (es ? 'Resultado ' : 'Result ') + fmtRaceTime(r.resultSec) : (es ? 'Completada' : 'Done'))
          : days + (es ? ' días' : ' days');
        return `<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--field-line); ${past ? 'opacity:.55;' : ''}">
          <div><span style="font-family:var(--font-display); font-size:13px; color:${isActive ? 'var(--olive-bright)' : 'var(--paper)'};">${isActive ? '▶ ' : ''}${label}</span>
          <span style="font-size:10px; color:var(--paper-dim); margin-left:6px;">${raceLabelByKey(r.distanceKey)} · ${r.dateISO} · ${es ? 'meta' : 'goal'} ${fmtRaceTime(r.goalSec)}</span></div>
          <span style="font-family:var(--font-mono); font-size:11px; color:var(--paper-dim);">${right}</span></div>`;
      }).join('');
      return `<div class="card"><div class="card-title">${es ? 'CARRERAS' : 'RACES'}</div>${rows}</div>`;
    }
    function renderRaceConfigCard(L, field) {
      const p = state.profile;
      ensureRaces(p);
      const es = getLang() === 'es';
      const today = todayISO();
      const sorted = [...p.races].sort((a, b) => (a.dateISO || '9999').localeCompare(b.dateISO || '9999'));
      const blocks = sorted.map(r => {
        const past = r.dateISO && r.dateISO < today;
        const isActive = r.id === p.activeRaceId && !past;
        const id = esc(r.id);
        return `<div style="border:1px solid ${isActive ? 'var(--olive-bright)' : 'var(--field-line)'}; border-radius:6px; padding:10px; margin-bottom:10px; ${past ? 'opacity:.7;' : ''}">
          <div style="font-size:10px; letter-spacing:.08em; color:${isActive ? 'var(--olive-bright)' : 'var(--paper-dim)'}; margin-bottom:6px;">
            ${isActive ? (es ? '▶ CARRERA ACTIVA (próxima)' : '▶ ACTIVE RACE (next)') : (past ? (es ? 'COMPLETADA' : 'COMPLETED') : (es ? 'PROGRAMADA' : 'SCHEDULED'))}</div>
          <div class="manual-field-row"><label for="rn-${id}">${es ? 'Nombre' : 'Name'}</label>
            <input type="text" id="rn-${id}" value="${esc(r.name)}" placeholder="Orocovis 5K" onchange="updateRace('${id}','name',this.value)" style="max-width:170px; text-align:right;" /></div>
          <div class="manual-field-row"><label for="rd-${id}">${es ? 'Fecha' : 'Date'}</label>
            <input type="date" id="rd-${id}" value="${esc(r.dateISO)}" onchange="updateRace('${id}','dateISO',this.value)" style="max-width:150px; text-align:right;" /></div>
          <div class="manual-field-row"><label for="rk-${id}">${es ? 'Distancia' : 'Distance'}</label>
            <select id="rk-${id}" onchange="updateRace('${id}','distanceKey',this.value)" style="max-width:150px; text-align:right;">
              ${RACE_DISTANCES.map(d => `<option value="${d.key}" ${r.distanceKey === d.key ? 'selected' : ''}>${d.label[getLang()] || d.label.en}</option>`).join('')}
            </select></div>
          <div class="manual-field-row"><label for="rg-${id}">${es ? 'Meta (MM:SS o H:MM:SS)' : 'Goal (MM:SS or H:MM:SS)'}</label>
            <input type="text" id="rg-${id}" value="${fmtRaceTime(r.goalSec)}" placeholder="30:00" onchange="updateRace('${id}','goalSec',this.value)" style="max-width:100px; text-align:right;" /></div>
          ${past ? `<div class="manual-field-row"><label for="rr-${id}">${es ? 'Resultado' : 'Result'}</label>
            <input type="text" id="rr-${id}" value="${fmtRaceTime(r.resultSec)}" placeholder="—" onchange="updateRace('${id}','resultSec',this.value)" style="max-width:100px; text-align:right;" /></div>` : ''}
          <label class="checkbox-item" style="margin-top:6px;"><input type="checkbox" ${r.inBoots ? 'checked' : ''} onchange="updateRace('${id}','inBoots',this.checked)" />
            <span style="font-size:13px;">${es ? 'Corro en botas + OCP' : 'Race in boots + OCP'}</span></label>
          <div class="manual-field-row"><label for="rt-${id}">${es ? 'Nota (terreno, etc.)' : 'Note (terrain, etc.)'}</label>
            <input type="text" id="rt-${id}" value="${esc(r.note)}" placeholder="${es ? '~70% bajada' : '~70% downhill'}" onchange="updateRace('${id}','note',this.value)" style="max-width:170px; text-align:right;" /></div>
          <button class="btn btn-secondary" style="width:100%; margin-top:8px;" onclick="deleteRace('${id}')">${es ? 'Eliminar carrera' : 'Delete race'}</button>
        </div>`;
      }).join('');
      return `
          <div class="card">
            <div class="card-title">${L('CARRERAS','RACES')}</div>
            ${blocks}
            <button class="btn btn-primary" style="width:100%;" onclick="addRace()">${es ? '+ Agregar carrera' : '+ Add race'}</button>
            <div style="margin-top:12px;">
              ${field('taperDays', L('Días de taper','Taper days'), p.taperDays ?? 10, {min:5, max:21, ph:'10'})}
            </div>
            <p style="font-size:10px; color:var(--paper-dim); margin-top:8px; line-height:1.4;">
              ${L(`La próxima carrera se activa sola: al pasar su fecha, la app cambia a la siguiente (por ejemplo del 5K al 10K). Correr en botas añade ~4% al tiempo proyectado. La penalización por calor sigue el mes de la carrera (actualmente ${(raceHeatPenaltyPct(p.raceDateISO)*100).toFixed(1)}%). La app no modela terreno en bajada; usa la nota como recordatorio.`, `The next race activates itself: once its date passes the app switches to the following one (e.g. 5K → 10K). Racing in boots adds ~4% to projected time. Heat penalty follows the race month (currently ${(raceHeatPenaltyPct(p.raceDateISO)*100).toFixed(1)}%). The app does not model downhill terrain; use the note as a reminder.`)}
            </p>
          </div>`;
    }

    const raceDistanceMeters = (profile) =>
      (RACE_DISTANCES.find(r => r.key === (profile?.raceDistanceKey || '5k'))?.meters) || 5000;
    const raceDistanceLabel = (profile) => {
      const row = RACE_DISTANCES.find(r => r.key === (profile?.raceDistanceKey || '5k'));
      return row ? (row.label[getLang()] || row.label.en) : '5K';
    };

    // Typical Puerto Rico race-morning heat cost, as a fraction of finishing time. August and
    // September mornings are brutal; December and January are close to neutral. Applying August's
    // penalty to a December race would systematically under-predict the athlete.
    // Index 0 = January.
    const PR_HEAT_PENALTY_BY_MONTH = [0.005, 0.005, 0.010, 0.015, 0.025, 0.030,
                                      0.032, 0.032, 0.030, 0.022, 0.012, 0.005];
    function raceHeatPenaltyPct(raceDateISO) {
      if (!raceDateISO) return 0.03;
      const m = parseInt(String(raceDateISO).split('-')[1], 10) - 1;
      return (m >= 0 && m < 12) ? PR_HEAT_PENALTY_BY_MONTH[m] : 0.03;
    }

    const fmtPaceNoUnit = (spm) => {
      if (!spm || spm <= 0) return '—';
      const r = Math.round(spm);
      const m = Math.floor(r / 60);
      const s = (r % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    };

    // Converts a hex color + integer percent (0-100) to an rgba() string.
    // Needed because CSS var(--x) references cannot have an opacity suffix concatenated
    // onto them (e.g. 'var(--olive)20' is invalid CSS and is silently ignored by browsers).
    function hexAlpha(hex, pct) {
      const h = hex.replace('#', '');
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return `rgba(${r},${g},${b},${pct / 100})`;
    }

    // Reference pace/effort table by session type, derived from current 5K pace (updates
    // automatically whenever profile.currentFiveKSec or VDOT improves — no manual re-entry).
    const PACE_REF_ROWS = [
      { type: 'easy', label: { en: 'Easy Run', es: 'Carrera Fácil' }, durationMin: 30, factorFast: 1.20, factorSlow: 1.35, pctFast: 0.74, pctSlow: 0.59, zone: 'Z1-Z2' },
      { type: 'long', label: { en: 'Long Run', es: 'Carrera Larga' }, durationMin: 45, factorFast: 1.25, factorSlow: 1.35, pctFast: 0.74, pctSlow: 0.59, zone: 'Z2' },
      { type: 'tempo', label: { en: 'Tempo', es: 'Tempo' }, durationMin: 20, factorFast: 1.02, factorSlow: 1.10, pctFast: 0.88, pctSlow: 0.83, zone: 'Z3-Z4' },
      { type: 'intervals', label: { en: 'Intervals', es: 'Intervalos' }, reps: '4-6×800m', factorFast: 0.90, factorSlow: 0.98, pctFast: 1.00, pctSlow: 0.95, zone: 'Z4-Z5' },
      { type: 'hill', label: { en: 'Hill Repeats', es: 'Repeticiones en Cuesta' }, reps: '6-8×1min', factorFast: 0.95, factorSlow: 1.05, zone: 'Z3-Z4', effortOnly: true },
      { type: 'reps400', label: { en: 'Repeats 400m', es: 'Repeticiones 400m' }, reps: '4-8×400m', factorFast: 0.82, factorSlow: 0.90, pctFast: 1.10, pctSlow: 1.05, zone: 'Z5' }
    ];

    // Options for the "Training type" dropdown when reviewing a TCX activity — feeds the
    // Training Pace Reference table's "Actual" column via matching `type`.
    const WORKOUT_TYPE_OPTIONS = [
      ...PACE_REF_ROWS.map(r => ({ type: r.type, label: r.label })),
      { type: 'race_sim', label: { en: 'Race Simulation', es: 'Simulacro de Carrera' } },
      { type: 'cross_training', label: { en: 'Cross Training', es: 'Entrenamiento Cruzado' } }
    ];

    // Evaluate if a pace override is prudent based on fitness, fatigue, recent decoupling
    function evaluatePaceOverride(sessionType, overridePaceSec, autoCalcPaceSec) {
      const lang = getLang();
      const reasons = [];
      let recommendation = 'good'; // 'good' | 'fast' | 'slow'
      let riskLevel = 'low';

      const pctChange = ((overridePaceSec - autoCalcPaceSec) / autoCalcPaceSec) * 100;
      const isFaster = pctChange < -2;
      const isSlower = pctChange > 2;

      // Check recent decoupling
      const recentSessions = state.tcxSessions.slice(0, 3); // Last 3 activities
      const avgRecentDecoupling = recentSessions.length > 0
        ? recentSessions.reduce((s, a) => {
            // Only positive decoupling represents fatigue; an invalid (terrain-skewed) or
            // negative reading must not average in as if the athlete were fresh or failing.
            const d = a.analysis?.decouplingValid ? (a.analysis.aerobicDecouplingPct || 0) : 0;
            return s + Math.max(0, d);
          }, 0) / recentSessions.length
        : 0;

      if (avgRecentDecoupling > 8) {
        reasons.push(lang === 'es'
          ? 'Sesiones recientes muestran alto decoupling — se recomienda pace más fácil'
          : 'Recent sessions show high decoupling — easier pace recommended');
        if (isFaster) { recommendation = 'fast'; riskLevel = 'high'; }
      }

      // Check TSS impact
      const estimatedTSS = estimateTSS(10, sessionType === 'easy' ? 1800 : 1200, 140, state.profile?.lthr || 174);
      if (isFaster && estimatedTSS > 120) {
        reasons.push(lang === 'es'
          ? 'Generará TSS alto — cuidado con acumulación de fatiga'
          : 'Will generate high TSS — watch fatigue accumulation');
        recommendation = 'fast';
        riskLevel = 'high';
      } else if (isSlower && estimatedTSS < 60) {
        reasons.push(lang === 'es'
          ? 'Generará TSS bajo — considera un poco más rápido si te sientes fresco'
          : 'Will generate low TSS — consider a bit faster if feeling fresh');
      }

      // Check vs auto-calculated (default good recommendation for within range)
      if (!isFaster && !isSlower) {
        reasons.push(lang === 'es'
          ? 'Coincide bien con tu nivel de forma'
          : 'Good match for your fitness level');
      } else if (isFaster && recommendation === 'good') {
        reasons.push(lang === 'es'
          ? 'Más rápido que recomendado — riesgo alto de fatiga'
          : 'Faster than recommended — high fatigue risk');
        recommendation = 'fast';
        riskLevel = 'medium';
      } else if (isSlower && recommendation === 'good') {
        reasons.push(lang === 'es'
          ? 'Conservador — bueno para días de recuperación'
          : 'Conservative — good for recovery days');
      }
