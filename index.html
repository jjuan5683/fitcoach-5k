    // ═══ SESSION RE-SCORING ═══
    // Resolves the session type from whatever is known — linked plan day first (explicit and
    // structured), then the manual training-type tag — and rewrites the stored score/grade.
    // Returns true when the grade actually moved, so callers can tell the user.
    function resolveSessionType(activity) {
      if (!activity) return null;
      const linked = activity.linkedPlanDay
        ? state.plan.find(p => p.day === activity.linkedPlanDay)
        : null;
      return (linked && linked.type) || activity.manualFields?.trainingType || null;
    }

    function rescoreSession(activity) {
      const a = activity?.analysis;
      if (!a) return false;
      const before = a.sessionGrade;
      const lthr = state.profile?.lthr || 174;
      const sessionType = resolveSessionType(activity);
      const typeKey = normalizeSessionType(sessionType);
      const intent = ZONE_INTENT[typeKey] || null;
      const linked = activity.linkedPlanDay ? state.plan.find(p => p.day === activity.linkedPlanDay) : null;
      const sport = activity.sport || 'running';

      // ── Work block / planned reps (2026.10.29) ──
      a.workSegment = null; a.repMatch = null;
      try {
        if (typeKey === 'tempo') a.workSegment = detectWorkSegment(activity, linked, lthr);
        else if (typeKey === 'intervals' || typeKey === 'hill') a.repMatch = matchPlannedReps(activity, linked, lthr);
      } catch (e) { console.warn('structured analysis failed', e); }

      // ── Whole-session decoupling and drift: only meaningful for a continuous, steady run ──
      if (Array.isArray(a.realSplitsMi)) {
        const dec = calcAerobicDecoupling(a.realSplitsMi);
        const walkSec = (a.runWalk?.walkSegments || []).filter(w => w.durationSec >= 15).reduce((s, w) => s + w.durationSec, 0);
        const walkPct = activity.totalTimeSec ? walkSec / activity.totalTimeSec * 100 : 0;
        const structured = intent === 'threshold' || intent === 'maximal';
        let why = null;
        if (structured) why = 'sesión estructurada (calentamiento, aceleraciones o repeticiones): se evalúa el bloque de trabajo';
        else if (walkPct >= 5) why = `incluye caminatas (${Math.round(walkPct)} % del tiempo)`;
        if (why && dec.value != null) { dec.valid = false; dec.reasonEs = why; dec.reasonEn = why; }
        a.decouplingInfo = dec;
        a.aerobicDecouplingPct = dec.value;
        a.decouplingValid = dec.valid;
        a.decouplingRating = !dec.valid ? null : dec.value < 5 ? 'excellent' : dec.value < 7.5 ? 'good' : dec.value < 10 ? 'fair' : 'poor';
        a.cardiacDriftValid = !why;
        a.cardiacDriftInvalidReasonEs = why;
      }

      // Inputs for scoring: the work block for a tempo, the matched reps for intervals.
      const seg = a.workSegment && a.workSegment.main;
      const segDecValid = !!(seg && seg.decoupling && seg.decoupling.valid);
      const inp = seg ? {
        decoupling: seg.decoupling ? seg.decoupling.value : null, decouplingValid: segDecValid,
        cardiacDrift: seg.drift ? { driftPct: seg.drift.pct } : null,
        timeInZones: seg.timeInZones, pacingConsistency: seg.cvPct != null ? { cvPct: seg.cvPct } : null,
        cadenceBySegment: seg.splits, splits: seg.splits,
        runWalk: { runPct: seg.runPct, walkSegments: [], runTimeSec: seg.durSec - seg.walkSec, walkTimeSec: seg.walkSec }
      } : {
        decoupling: a.aerobicDecouplingPct, decouplingValid: a.decouplingValid,
        cardiacDrift: a.cardiacDriftValid === false ? null : a.cardiacDrift,
        timeInZones: a.repMatch ? a.repMatch.timeInZones : a.timeInZones,
        pacingConsistency: a.pacingConsistency,
        cadenceBySegment: a.cadenceSegments, splits: a.realSplitsMi,
        // Walking during planned recoveries is part of an interval session, not a lapse.
        runWalk: intent === 'maximal' ? null : a.runWalk
      };

      const scored = scoreSession({
        sport, sessionType,
        decoupling: inp.decoupling, decouplingValid: inp.decouplingValid,
        cardiacDrift: inp.cardiacDrift, timeInZones: inp.timeInZones, pacingConsistency: inp.pacingConsistency
      });
      a.sessionScore = scored.score;
      a.sessionGrade = scored.grade;
      a.scoredOn = seg ? 'work_block' : a.repMatch ? 'reps' : 'session';

      if (a.categoryGrades) {
        a.categoryGrades = calcCategoryGrades({
          sport, sessionType,
          pacingConsistency: inp.pacingConsistency,
          cadenceBySegment: inp.cadenceBySegment,
          runWalk: inp.runWalk,
          splits: inp.splits,
          decouplingValid: inp.decouplingValid,
          decouplingPct: inp.decoupling,
          cardiacDrift: inp.cardiacDrift,
          timeInZones: inp.timeInZones,
          hrDataQuality: a.hrDataQuality,
          totalTimeSec: activity.totalTimeSec
        });
      }

      // Refresh the findings that depend on decoupling/drift so they match the new verdicts.
      if (Array.isArray(a.keyFindings)) {
        a.keyFindings = a.keyFindings.filter(f => !/^(Decoupling|Cardiac drift|Eficiencia mejoró|Bloque de trabajo)/.test(f.text || ''));
        if (seg) {
          const d = seg.decoupling;
          a.keyFindings.push({ type: seg.longestAboveLthrSec > 60 ? 'crit' : seg.bandPct >= 70 ? 'pos' : 'warn',
            text: `Bloque de trabajo: ${secToMMSS(a.workSegment.workSec)} · ${fmtPace(seg.paceSecPerMi)} · FC ${seg.avgHR} · ${seg.bandPct}% en ${seg.bandLo}–${seg.bandHi} · racha máx. sobre ${lthr}: ${seg.longestAboveLthrSec} s${d && d.valid ? ` · desacople ${d.value}%` : ''}` });
        } else if (a.decouplingValid && a.aerobicDecouplingPct != null) {
          const v = a.aerobicDecouplingPct;
          a.keyFindings.push(v < 0 ? { type: 'pos', text: `Eficiencia mejoró ${Math.abs(v).toFixed(1)}% en la segunda mitad` }
            : v > 10 ? { type: 'crit', text: `Decoupling ${v.toFixed(1)}% — baja la intensidad hasta quedar bajo 7.5%` }
            : v > 7.5 ? { type: 'warn', text: `Decoupling ${v.toFixed(1)}% — aceptable, apunta a menos de 7.5%` }
            : { type: 'pos', text: `Decoupling ${v.toFixed(1)}% — base aeróbica sólida` });
        } else if (a.decouplingInfo && a.decouplingInfo.value != null) {
          a.keyFindings.push({ type: 'warn', text: `Decoupling no válido — ${a.decouplingInfo.reasonEs}.` });
        }
        if (!seg && a.cardiacDriftValid !== false && a.cardiacDrift && a.cardiacDrift.driftPct > 5) {
          a.keyFindings.push({ type: 'warn', text: `Cardiac drift +${a.cardiacDrift.driftPct}% (${a.cardiacDrift.avgHRFirstHalf}→${a.cardiacDrift.avgHRSecondHalf} bpm) — check hydration/heat` });
        }
      }

      return before !== scored.grade;
    }

    // One-time migration: sessions imported before type-aware scoring existed carry a grade
    // computed as if every workout were an easy run. Re-scoring them on load repairs the
    // history rather than leaving a mix of old and new grades in the same list.
    function rescoreAllSessions() {
      let changed = 0;
      (state.tcxSessions || []).forEach(act => { if (rescoreSession(act)) changed++; });
      return changed;
    }

    // ═══ ACTIVITY <-> PLAN LINKING ═══
    function linkActivityToSession(activityId, day) {
      day = parseInt(day);
      if (!activityId || !day || isNaN(day)) { showToast(t('toast_select_both')); return; }
      const activity = state.tcxSessions.find(t => t.id === activityId);
      const session = state.plan.find(p => p.day === day);
      if (!activity || !session) return;

      // Clear any previous links pointing at either side
      state.tcxSessions.forEach(t => { if (t.linkedPlanDay === day) t.linkedPlanDay = null; });
      state.plan.forEach(p => { if (p.linkedActivityId === activityId) p.linkedActivityId = null; });

      activity.linkedPlanDay = day;
      session.linkedActivityId = activityId;
      session.completed = true; // linking a real TCX to a planned session marks it complete — dashboard/CTL/ATL update immediately
      rescoreSession(activity);   // the plan day tells us what this session was trying to be
      saveState();
      render();
      showToast(`${t('toast_linked')} ${day} ↔ ${activity.dateISO}`);
    }

    function unlinkActivity(activityId) {
      const activity = state.tcxSessions.find(t => t.id === activityId);
      if (!activity) return;
      if (activity.linkedPlanDay) {
        const session = state.plan.find(p => p.day === activity.linkedPlanDay);
        if (session) { session.linkedActivityId = null; session.completed = false; }
      }
      activity.linkedPlanDay = null;
      rescoreSession(activity);   // falls back to the manual tag, or to the neutral default
      saveState();
      render();
      showToast(t('toast_unlinked'));
    }

    function unlinkSessionActivity(day) {
      const session = state.plan.find(p => p.day === day);
      if (!session) return;
      if (session.linkedActivityId) {
        const activity = state.tcxSessions.find(t => t.id === session.linkedActivityId);
        if (activity) { activity.linkedPlanDay = null; rescoreSession(activity); }
      }
      session.linkedActivityId = null;
      session.completed = false;
      saveState();
      render();
      showToast(t('toast_unlinked'));
    }

    // ═══ ACTIVITY FIELD EDITING ═══
    function updateActivityDate(activityId, newDateISO) {
      const act = state.tcxSessions.find(a => a.id === activityId);
      if (!act || !newDateISO) return;
      act.dateISO = newDateISO;
      saveState();
      render();
      showToast(t('toast_event_date_updated'));
    }

    function saveManualField(activityId, field, value) {
      const act = state.tcxSessions.find(a => a.id === activityId);
      if (!act) return;
      if (!act.manualFields) act.manualFields = { aerobicTE: '', anaerobicTE: '', trainingLoad: '', humidity: '', wind: '', feelsLike: '', surface: '', sleepHours: '', sleepQuality: '', energyLevel: '', stressLevel: '', painNotes: '', bodyWeight: '', hrv: '', restingHR: '', rpe: '', athleteNotes: '', sessionGoal: '', trainingType: '', locationName: '' };
      act.manualFields[field] = value;
      if (field === 'gearId') { delete act.manualFields.gearAuto; if (value) state.settings.lastGearId = value; }
      if (field === 'hrSource' && HR_SOURCES[value]) state.settings.lastHrSource = value;
      // The training-type tag is the other input to the grade, so a change here has to
      // propagate the same way a plan link does.
      if (field === 'trainingType') rescoreSession(act);
      saveState();
      // Re-render so selection highlights (RPE, surface, training type) update immediately.
      // Scroll position is preserved by render(), so this no longer bounces to the top.
      render();
    }

    function setSplitUnit(unit) {
      activitySplitUnit = unit;
      render();
    }

    // ═══ MANUAL SESSION ENTRY (strength / cardio without TCX) ═══
    function toggleManualSessionForm() {
      manualSessionFormOpen = !manualSessionFormOpen;
      render();
    }

    // ── Weather auto-fill via Open-Meteo (no API key required) ──
    // Uses the device's current location (per user request) to fill temperature (avg/min/max),
    // humidity, wind, and feels-like. Chooses the correct Open-Meteo endpoint by date:
    //   • forecast API (with past_days) for today and the last ~5 days
    //   • archive API for older dates
    // Manual entry always remains available as a fallback / correction.
    async function fetchWeatherForActivity(activityId) {
      const act = state.tcxSessions.find(a => a.id === activityId);
      if (!act) return;
      const statusEls = [
        document.getElementById(`weatherFetchStatus-${activityId}`),
        document.getElementById(`weatherFetchStatusTop-${activityId}`)
      ].filter(Boolean);
      const setStatus = (msg) => statusEls.forEach(el => { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; });

      async function getCoords() {
        if (navigator.geolocation) {
          const devicePos = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
              (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, source: 'device' }),
              () => resolve(null),
              { timeout: 10000, enableHighAccuracy: true }
            );
          });
          if (devicePos) return devicePos;
        }
        if (act.firstGPS?.lat) return { lat: act.firstGPS.lat, lon: act.firstGPS.lon, source: 'tcx' };
        return null;
      }

      setStatus(getLang()==='es' ? 'Buscando ubicación del dispositivo...' : 'Locating device...');
      const coords = await getCoords();
      if (!coords) {
        showToast(getLang()==='es' ? '✕ Sin ubicación — autoriza el permiso o ingresa manual' : '✕ No location — allow permission or enter manually');
        setStatus('');
        return;
      }

      setStatus(getLang()==='es' ? 'Consultando clima (Open-Meteo)...' : 'Fetching weather (Open-Meteo)...');
      try {
        const date = act.dateISO || todayISO();
        // Decide endpoint: archive for dates older than ~5 days, forecast otherwise.
        const daysAgo = Math.round((Date.now() - new Date(date + 'T12:00:00').getTime()) / 86400000);
        const useArchive = daysAgo > 5;
        const base = useArchive ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';

        let url = `${base}?latitude=${coords.lat.toFixed(4)}&longitude=${coords.lon.toFixed(4)}` +
          `&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean` +
          `&hourly=relative_humidity_2m,apparent_temperature,wind_speed_10m` +
          `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
        if (useArchive) {
          url += `&start_date=${date}&end_date=${date}`;
        } else {
          // forecast API: past_days covers recent days without needing start_date
          url += `&past_days=7&forecast_days=1`;
        }

        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        // ── Daily temps (avg/min/max) ──
        let avgTempF = null, minTempF = null, maxTempF = null;
        const dTimes = data.daily?.time || [];
        let dIdx = dTimes.indexOf(date);
        if (dIdx === -1 && dTimes.length) dIdx = dTimes.length - 1; // fall back to nearest available
        if (dIdx !== -1) {
          maxTempF = Math.round(data.daily.temperature_2m_max[dIdx]);
          minTempF = Math.round(data.daily.temperature_2m_min[dIdx]);
          avgTempF = Math.round(data.daily.temperature_2m_mean[dIdx]);
        }

        // ── Hourly humidity / wind / feels-like at the run's start hour (default 7 AM) ──
        let humidity = null, wind = null, feelsLike = null;
        const hTimes = data.hourly?.time || [];
        if (hTimes.length) {
          let targetHour = 7;
          if (act.startTimeISO) {
            const d = new Date(act.startTimeISO);
            if (!isNaN(d.getTime())) targetHour = d.getHours();
          }
          // Prefer an hour on the activity date; else midpoint.
          let idx = hTimes.findIndex(tstr => tstr.startsWith(date) && new Date(tstr).getHours() === targetHour);
          if (idx === -1) idx = hTimes.findIndex(tstr => tstr.startsWith(date));
          if (idx === -1) idx = Math.floor(hTimes.length / 2);
          humidity = Math.round(data.hourly.relative_humidity_2m[idx]);
          wind = Math.round(data.hourly.wind_speed_10m[idx]);
          feelsLike = Math.round(data.hourly.apparent_temperature[idx]);
        }

        if (avgTempF == null && humidity == null) throw new Error('No usable weather data');

        if (!act.manualFields) act.manualFields = {};
        if (humidity != null) act.manualFields.humidity = humidity;
        if (wind != null) act.manualFields.wind = wind;
        if (feelsLike != null) act.manualFields.feelsLike = feelsLike;
        // Store fetched temps separately so they show in the CONDITIONS table without
        // overwriting real TCX temperature data.
        if (avgTempF != null) act.manualFields.wxAvgTempF = avgTempF;
        if (minTempF != null) act.manualFields.wxMinTempF = minTempF;
        if (maxTempF != null) act.manualFields.wxMaxTempF = maxTempF;

        saveState();
        render();
        showToast(getLang()==='es'
          ? `✓ Clima obtenido (${coords.source === 'tcx' ? 'GPS del TCX' : 'ubicación del dispositivo'})`
          : `✓ Weather fetched (${coords.source === 'tcx' ? 'TCX GPS' : 'device location'})`);
      } catch (err) {
        console.error('Weather fetch error:', err);
        showToast(getLang()==='es' ? '✕ Error al obtener clima — ingresa manualmente' : '✕ Weather fetch failed — enter manually');
        setStatus('');
      }
    }

    // ── Reverse geocoding via OpenStreetMap Nominatim (no API key required) ──
    // Rate limit: 1 req/sec. Only called when user explicitly clicks "Get Location".
    async function fetchLocationFromGPS(activityId) {
      const act = state.tcxSessions.find(a => a.id === activityId);
      if (!act?.firstGPS?.lat) {
        showToast(getLang()==='es' ? '✕ Sin datos GPS en este archivo' : '✕ No GPS data in this file');
        return;
      }
      showToast(getLang()==='es' ? 'Buscando ubicación...' : 'Looking up location...');
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${act.firstGPS.lat}&lon=${act.firstGPS.lon}&format=json&zoom=14`;
        const resp = await fetch(url, { headers: { 'Accept-Language': getLang() === 'es' ? 'es' : 'en' } });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.suburb || '';
        const municipality = data.address?.county || data.address?.municipality || '';
        const country = data.address?.country || '';
        const locationStr = [city || municipality, country].filter(Boolean).join(', ');
        if (!act.manualFields) act.manualFields = {};
        act.manualFields.locationName = locationStr || data.display_name?.split(',').slice(0,2).join(',').trim();
        saveState();
        render();
        showToast(getLang()==='es' ? '✓ Ubicación obtenida' : '✓ Location found');
      } catch (err) {
        console.error('Geocoding error:', err);
        showToast(getLang()==='es' ? '✕ Error al obtener ubicación' : '✕ Location lookup failed');
      }
    }

    function saveManualSession() {
      const es = getLang() === 'es';
      const dateISO = document.getElementById('manualSessDate')?.value;
      const type = document.getElementById('manualSessType')?.value;
      const durationMin = parseInt(document.getElementById('manualSessDuration')?.value) || 0;
      const avgHR = parseInt(document.getElementById('manualSessHR')?.value) || null;
      const notes = document.getElementById('manualSessNotes')?.value || '';
      const hasDist = type === 'ruck' || type === 'run';
      const distMi = hasDist ? (parseFloat(document.getElementById('manualSessDist')?.value) || 0) : 0;

      if (!dateISO || !durationMin) {
        showToast(es ? '⚠ Fecha y duración requeridas' : '⚠ Date and duration required');
        return;
      }
      if (hasDist && distMi <= 0) {
        showToast(es ? '⚠ Pon la distancia en millas' : '⚠ Enter distance in miles');
        return;
      }

      if (!state.manualSessions) state.manualSessions = [];
      state.manualSessions.push({
        id: 'manual_' + Date.now(),
        dateISO, type, durationMin, distMi, avgHR, notes
      });
      saveState();
      manualSessionFormOpen = false;
      render();
      showToast(es ? '✓ SESIÓN REGISTRADA' : '✓ SESSION LOGGED');
    }

    function deleteManualSession(id) {
      state.manualSessions = (state.manualSessions || []).filter(m => m.id !== id);
      saveState();
      render();
    }

    function deleteActivity(activityId) {
      if (!confirm(t('confirm_delete_activity'))) return;
      const act = state.tcxSessions.find(a => a.id === activityId);
      if (act && act.linkedPlanDay) {
        const session = state.plan.find(p => p.day === act.linkedPlanDay);
        if (session) session.linkedActivityId = null;
      }
      state.tcxSessions = state.tcxSessions.filter(a => a.id !== activityId);
      saveState();
      detailOverlay = null;
      render();
      showToast(t('toast_activity_deleted'));
    }

    // ═══ TCX UPLOAD ═══
    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (e) => reject(e);
        reader.readAsText(file);
      });
    }

    async function handleTCXUpload(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const isBulk = files.length > 1;
      showToast(isBulk ? `${t('toast_parsing')} (0/${files.length})` : t('toast_parsing'));

      let loaded = 0, duplicates = 0, errors = 0, reprocessed = 0;
      let lastParsed = null;

      for (let i = 0; i < files.length; i++) {
        try {
          const xmlText = await readFileAsText(files[i]);
          const parsed = parseTCX(xmlText, state.profile?.lthr || 174);
          if (!parsed) { errors++; continue; }
          const existingById = state.tcxSessions.find(t => t.id === parsed.id);
          // Secondary dedup: same date + near-identical distance & duration = same run re-exported.
          const existingByMatch = state.tcxSessions.find(t =>
            t.dateISO === parsed.dateISO &&
            Math.abs((t.totalDistMi || 0) - (parsed.totalDistMi || 0)) < 0.05 &&
            Math.abs((t.totalTimeSec || 0) - (parsed.totalTimeSec || 0)) < 15
          );
          const existing = existingById || existingByMatch;
          if (existing) {
            // Re-uploading the same activity (e.g. after a calculation fix) should refresh the
            // auto-computed analysis, not silently no-op — but never discard what the athlete
            // typed in by hand (RPE, sleep, feelings, weather, linked plan day).
            const preservedManualFields = existing.manualFields;
            const preservedLinkedPlanDay = existing.linkedPlanDay;
            Object.assign(existing, parsed, { id: existing.id, manualFields: preservedManualFields, linkedPlanDay: preservedLinkedPlanDay });
            // The fresh parse carries a type-less provisional grade; re-apply the linked plan day.
            rescoreSession(existing);
            reprocessed++;
            lastParsed = existing;
            continue;
          }
          prefillGearHr(parsed);
          state.tcxSessions.unshift(parsed);
          lastParsed = parsed;
          loaded++;
        } catch (err) {
          console.error(err);
          errors++;
        }
        if (isBulk) showToast(`${t('toast_parsing')} (${i + 1}/${files.length})`);
      }

      if (loaded > 0 || reprocessed > 0) {
        state.tcxSessions.sort((a, b) => (b.dateISO || '').localeCompare(a.dateISO || ''));
        saveState();
      }
      render();

      if (isBulk) {
        showToast(t('toast_bulk_summary').replace('{n}', loaded).replace('{dup}', duplicates).replace('{err}', errors) + (reprocessed ? ` · ${reprocessed} ${getLang()==='es'?'actualizados':'updated'}` : ''));
      } else if (loaded === 1 && lastParsed) {
        showToast(`✓ ${lastParsed.totalDistMi.toFixed(2)} MI · ${t('toast_grade')} ${lastParsed.analysis.sessionGrade}`);
      } else if (reprocessed === 1 && lastParsed) {
        showToast(getLang() === 'es' ? `✓ Actividad reprocesada con el cálculo actualizado` : `✓ Activity reprocessed with updated calculation`);
      } else if (duplicates === 1) {
        showToast(t('toast_already_logged'));
      } else if (errors === 1) {
        showToast(t('toast_parse_error'));
      }

      event.target.value = '';
    }

    // ═══ MARKDOWN EXPORT ═══
    const SESSION_TYPE_LABELS = {
      easy: 'Z2 / Easy', tempo: 'Tempo', intervals: 'Intervalos', long: 'Long Run',
      race_sim: 'Race Simulation', rest: 'Rest'
    };

    function buildActivityMarkdown(t) {
      const a = t.analysis || {};
      const mf = t.manualFields || {};
      const isBike = t.sport === 'biking';
      const linkedSession = t.linkedPlanDay ? state.plan.find(s => s.day === t.linkedPlanDay) : null;
      const typeLabel = linkedSession ? (SESSION_TYPE_LABELS[linkedSession.type] || linkedSession.type) : (mf.trainingType || 'Sin vincular a sesión del plan');
      const ND = 'N/D';

      // ── VDOT validity, re-checked ──────────────────────────────────────
      // parseTCX() can only test terrain, intensity and duration. The session TYPE — the single
      // strongest signal that a VDOT number is meaningless — is only known once the activity is
      // linked to a plan day or tagged manually, which happens after parsing. Re-running the
      // check here means an easy run never reports a race-equivalent fitness number, and every
      // display site below agrees on one verdict.
      const vdotSessionType = (linkedSession && linkedSession.type) || mf.trainingType || null;
      const vdotRecheck = vdotValidity({
        sport: isBike ? 'biking' : 'running',
        avgHR: t.avgHR,
        lthr: state.profile?.lthr || 174,
        elevGainPerMi: a.elevGainPerMi || 0,
        totalTimeSec: t.totalTimeSec,
        sessionType: vdotSessionType
      });
      // A structured quality session is never a race effort; say so instead of quoting the
      // whole-session average HR (diluted by warm-up and walks) as the reason.
      const structuredVdot = !!a.workSegment || !!a.repMatch;
      const vdotOK = !!a.vdot && vdotRecheck.valid && !structuredVdot;
      const vdotWhy = structuredVdot ? 'sesión estructurada (calentamiento + bloque de trabajo): el VDOT solo se calcula con carreras o pruebas continuas'
        : (vdotRecheck.reasonEs || a.vdotInvalidReasonEs || null);

      // Auto-evaluation
      const { history, sameTypeOnly: fatigueSameTypeOnly } = buildFatigueHistory(t);
      const fatigue = calcFatigueIndex({ avgHR: t.avgHR, avgPaceSecPerMi: t.avgPaceSecPerMi }, history);
      fatigue.sameTypeOnly = fatigueSameTypeOnly;
      const autoEval = calcAutoEvaluation(a, fatigue, vdotSessionType);
      const seg = a.workSegment && a.workSegment.kind === 'tempo' ? a.workSegment : null;
      const lthrR = state.profile?.lthr || 174;

      // Zone time in MM:SS helper
      const zSec = a.timeInZones?.seconds || {};
      const zoneTimeFmt = z => {
        const s = Math.round(zSec[z] || 0);
        if (!s) return '0:00';
        const m = Math.floor(s / 60);
        const sec = (s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
      };
      const totalZoneSec = Object.values(zSec).reduce((a,b)=>a+b,0) || 1;
      const zonePct = z => Math.round((zSec[z]||0) / totalZoneSec * 100);

      const lines = [];
      
      // ── METADATA BLOCK (Claude parsing friendly) ─────────────────────────────
      lines.push('```');
      lines.push('ACTIVITY METADATA');
      lines.push(`Date: ${t.dateISO}`);
      lines.push(`Sport: ${isBike ? 'Biking' : 'Running'}`);
      lines.push(`Type: ${typeLabel}`);
      if (linkedSession) lines.push(`Linked Plan Day: ${linkedSession.day}`);
      lines.push(`LTHR: ${state.profile?.lthr || 174} bpm`);
      if (isBike) {
        lines.push(`Avg Speed: ${(t.avgSpeedMph || 0).toFixed(1)} mph`);
      } else {
        lines.push(`VDOT: ${vdotOK ? a.vdot.toFixed(1) : 'N/D'}`);
        let pred5K = a.predicted5KSec ? secToMMSS(a.predicted5KSec) : ND;
        lines.push(`Predicted 5K: ${pred5K}`);
      }
      let tss = estimateTSS(t.totalDistMi, t.totalTimeSec, t.avgHR, state.profile?.lthr || 174).toFixed(1);
      lines.push(`TSS: ${tss}`);
      if (seg) {
        lines.push(`Work Block: ${secToMMSS(seg.workSec)} @ ${fmtPace(seg.main.paceSecPerMi)}, HR ${seg.main.avgHR} (laps ${seg.lapFrom + 1}-${seg.lapTo + 1}, ${seg.method === 'plan' ? 'matched to plan' : 'auto-detected'})`);
        if (seg.main.decoupling && seg.main.decoupling.valid) lines.push(`Aerobic Decoupling (work block): ${seg.main.decoupling.value.toFixed(1)}%`);
      } else if (a.decouplingValid && a.aerobicDecouplingPct != null) lines.push(`Aerobic Decoupling: ${a.aerobicDecouplingPct.toFixed(1)}%`);
      lines.push(`Session Grade: ${a.sessionGrade || ND}${a.scoredOn === 'work_block' ? ' (work block)' : a.scoredOn === 'reps' ? ' (reps)' : ''}`);
      lines.push('```');
      lines.push('');
      
      lines.push(`# Reporte de Actividad — ${t.dateISO}`);
      lines.push('');
      
      // ── EXECUTIVE SUMMARY TABLE ─────────────────────────────────────────────
      lines.push('| Métrica | Valor | Estado |');
      lines.push('|---------|-------|--------|');
      lines.push(`| Distancia | ${t.totalDistMi.toFixed(2)} mi | — |`);
      lines.push(`| Tiempo | ${secToHHMMSS(t.totalTimeSec)} | — |`);
      if (isBike) {
        lines.push(`| Velocidad Promedio | ${(t.avgSpeedMph||0).toFixed(1)} mph | — |`);
      } else {
        lines.push(`| Pace Promedio | ${fmtPace(t.avgPaceSecPerMi)} | — |`);
      }
      const hrZoneLabel = t.avgHR > 0 ? 'Z' + hrZoneFromBpm(t.avgHR, state.profile?.lthr || 174) : ND;
      lines.push(`| FC Promedio / Máxima | ${t.avgHR} / ${t.maxHR} bpm | ${hrZoneLabel} |`);
      if (!isBike) {
        // VDOT the athlete's own goal requires — not a constant.
        const goalVdot = vdotRequiredForGoal();
        lines.push(`| VDOT | ${vdotOK ? a.vdot.toFixed(1) : ND} | ${vdotOK && goalVdot ? (a.vdot >= goalVdot ? '↑' : '↓') : '—'} |`);
      }
      lines.push(`| TSS | ${tss} | — |`);
      lines.push('');

      // ── INFORMACIÓN GENERAL ──────────────────────────────────────────────
      lines.push('## Información General');
      lines.push('');
      lines.push(`**Fecha:** ${t.dateISO}`);
      lines.push(`**Tipo de Entrenamiento:** ${typeLabel}`);
      lines.push(`**Objetivo del Entrenamiento:** ${mf.sessionGoal || ND}`);
      lines.push('');

      // ── RUTA EVALUADA ─────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Ruta Evaluada');
      lines.push('');
      lines.push(`**Nombre de Actividad:** ${t.activityName || ND}`);
      lines.push(`**Calzado:** ${gearById(mf.gearId)?.name || ND}${mf.gearAuto ? ' (automático, sin confirmar)' : ''}`);
      lines.push(`**Fuente de FC:** ${mf.hrSource ? (HR_SOURCES[mf.hrSource]?.es || mf.hrSource) : ND}${mf.hrSource === 'optical' ? ' — ⚠ no válida para zonas, decoupling ni umbral' : ''}`);
      lines.push(`**Ubicación:** ${mf.locationName || ND}`);
      if (t.firstGPS?.lat) lines.push(`**Coordenadas GPS (inicio):** ${t.firstGPS.lat.toFixed(5)}, ${t.firstGPS.lon.toFixed(5)}`);
      lines.push(`**Hora de Inicio:** ${t.startTimeISO ? new Date(t.startTimeISO).toLocaleString('es-PR') : ND}`);
      lines.push(`**Hora de Finalización:** ${t.endTimeISO ? new Date(t.endTimeISO).toLocaleString('es-PR') : ND}`);
      lines.push(`**Altitud Mínima:** ${t.altMinM != null ? t.altMinM + ' m' : ND}`);
      lines.push(`**Altitud Máxima:** ${t.altMaxM != null ? t.altMaxM + ' m' : ND}`);
      lines.push(`**Pendiente Máxima Subida:** ${t.maxGradeUp != null ? '+' + t.maxGradeUp + '%' : ND}`);
      lines.push(`**Pendiente Máxima Bajada:** ${t.maxGradeDown != null ? t.maxGradeDown + '%' : ND}`);
      lines.push('');
      lines.push('> Los campos de Nombre, Temperatura, Training Effect y Carga de Entrenamiento dependen de los datos que tu reloj Garmin incluye en el TCX. Viento, Humedad, Sensación Térmica y Superficie son campos manuales.');
      lines.push('');

      // ── ESTADO DEL ATLETA PRE-SESIÓN ─────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Estado del Atleta Antes de la Sesión');
      lines.push('');
      lines.push(`**Horas de Sueño:** ${mf.sleepHours ? mf.sleepHours + ' h' : ND}`);
      lines.push(`**Calidad del Sueño (1-10):** ${mf.sleepQuality || ND}`);
      lines.push(`**Nivel de Energía (1-10):** ${mf.energyLevel || ND}`);
      lines.push(`**Estrés (1-10):** ${mf.stressLevel || ND}`);
      lines.push(`**Dolor o Molestias:** ${mf.painNotes || 'Ninguno'}`);
      lines.push(`**Peso Corporal:** ${mf.bodyWeight ? mf.bodyWeight + ' lb' : ND}`);
      lines.push(`**HRV:** ${mf.hrv ? mf.hrv + ' ms' : (a.hrvProxy ? '~' + a.hrvProxy + ' (proxy TCX)' : ND)}`);
      lines.push(`**Frecuencia Cardíaca en Reposo:** ${mf.restingHR ? mf.restingHR + ' bpm' : ND}`);
      lines.push('');

      // ── CONDICIONES AMBIENTALES ──────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Condiciones Ambientales');
      lines.push('');
      lines.push(`**Temperatura Promedio:** ${t.hasTempData ? t.avgTempF + '°F' : (mf.temperature || ND)} ${t.hasTempData ? '(del TCX)' : '(manual)'}`);
      lines.push(`**Temperatura Mínima:** ${t.minTempF != null ? t.minTempF + '°F (del TCX)' : ND}`);
      lines.push(`**Temperatura Máxima:** ${t.maxTempF != null ? t.maxTempF + '°F (del TCX)' : ND}`);
      lines.push(`**Humedad:** ${mf.humidity ? mf.humidity + '%' : ND}`);
      lines.push(`**Viento:** ${mf.wind ? mf.wind + ' mph' : ND}`);
      lines.push(`**Sensación Térmica:** ${mf.feelsLike ? mf.feelsLike + '°F' : ND}`);
      lines.push(`**Superficie:** ${mf.surface || ND}`);
      lines.push('');

      // ── RESULTADOS ───────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Resultados de la Sesión');
      lines.push('');
      lines.push(`**Distancia:** ${t.totalDistMi.toFixed(2)} mi (${(t.totalDistMi * 1.60934).toFixed(2)} km)`);
      lines.push(`**Tiempo:** ${secToHHMMSS(t.totalTimeSec)}`);
      if (isBike) {
        lines.push(`**Velocidad Promedio:** ${(t.avgSpeedMph || 0).toFixed(1)} mph (${((t.avgSpeedMph||0)*1.60934).toFixed(1)} km/h)`);
      } else {
        lines.push(`**Pace Promedio:** ${fmtPace(t.avgPaceSecPerMi)}${seg ? ' — sesión completa, incluye calentamiento, pausas y trote final' : ''}`);
        if (seg) {
          lines.push(`**Ritmo del bloque sostenido:** ${fmtPace(seg.main.paceSecPerMi)} — ${secToMMSS(seg.main.durSec)}, ${seg.main.distMi.toFixed(2)} mi, FC ${seg.main.avgHR}/${seg.main.maxHR}`);
          if (seg.arranque) lines.push(`**Arranque (${Math.round(seg.arranque.durSec / 60)} min):** ${fmtPace(seg.arranque.paceSecPerMi)} — FC ${seg.arranque.hrStart}→${seg.arranque.hrEnd}`);
        } else if (t.workPaceSecPerMi) {
          lines.push(`**Pace de Repeticiones (solo esfuerzo):** ${fmtPace(t.workPaceSecPerMi)} — ${t.workLapsCount} tramo(s) de esfuerzo detectados`);
          lines.push(`**Pace de Recuperación:** ${fmtPace(t.recoveryPaceSecPerMi)} — ${t.recoveryLapsCount} tramo(s) de recuperación excluidos del promedio de arriba`);
        }
      }
      lines.push('');
      lines.push(`**FC Promedio:** ${t.avgHR} bpm`);
      lines.push(`**FC Máxima:** ${t.maxHR} bpm`);
      
      const vdot = vdotOK ? a.vdot.toFixed(1) : (vdotWhy ? `N/D — ${vdotWhy}` : 'N/D');
      pred5K = (vdotOK && a.predicted5KSec) ? secToMMSS(a.predicted5KSec) : 'N/D';
      // tss already computed above from estimateTSS() using real session data — reuse it
      
      if (!isBike) {
        lines.push(`**VDOT (VO2max):** ${vdotOK ? vdot + ' ml/kg/min' : vdot}`)  ;
        lines.push(`**Predicción 5K:** ${pred5K}`)  ;
      }
      lines.push(`**TSS (Training Stress Score):** ${tss}`)  ;
      lines.push('');
      lines.push(`**Cadencia Promedio:** ${t.avgCadSPM || ND} ${t.avgCadSPM ? (isBike ? 'rpm' : 'spm') : ''}`.trim());
      lines.push(`**Cadencia Máxima:** ${t.maxCadSPM || ND} ${isBike ? 'rpm' : 'spm'}`);
      if (seg && seg.main.avgCad) {
        lines.push(`**Cadencia Promedio (bloque sostenido):** ${seg.main.avgCad} spm`);
      } else if (!isBike && Array.isArray(t.laps) && t.workLapsCount >= 1) {
        // The line above blends effort strides with near-zero-cadence walk recoveries, which
        // silently drags a real ~168 spm effort cadence down to a misleading ~136 spm average.
        // This isolates cadence to work laps only — see "Splits por Repetición" for the per-rep detail.
        const workCads = t.laps.filter(l => l.repType === 'work' && l.avgCadSPM > 0).map(l => l.avgCadSPM);
        if (workCads.length) {
          const avgWorkCad = Math.round(workCads.reduce((a, b) => a + b, 0) / workCads.length);
          lines.push(`**Cadencia Promedio (solo esfuerzo):** ${avgWorkCad} spm — excluye caminatas de recuperación`);
        }
      }
      lines.push('');
      lines.push(`**Potencia Promedio:** ${a.powerStats ? a.powerStats.avgWatts + ' W' : ND}`);
      lines.push(`**Potencia Máxima:** ${a.powerStats ? a.powerStats.maxWatts + ' W' : ND}`);
      lines.push('');
      lines.push(`**Elevación Ganada:** +${t.elevGainM} m / +${t.elevGainFt || Math.round(t.elevGainM * 3.28084)} ft`);
      lines.push(`**Elevación Perdida:** -${t.elevLossM} m / -${t.elevLossFt || Math.round(t.elevLossM * 3.28084)} ft`);
      lines.push('');
      lines.push(`**Calorías:** ${t.calories || ND} kcal`);
      lines.push('');
      lines.push(`**Training Effect Aeróbico:** ${mf.aerobicTE || ND}`);
      lines.push(`**Training Effect Anaeróbico:** ${mf.anaerobicTE || ND}`);
      lines.push(`**Carga de Entrenamiento (Garmin):** ${mf.trainingLoad || ND}`);
      lines.push('');

      const loadStatus = getCurrentLoadStatus();
      if (loadStatus) {
        const formLabelEs = {
          'Building — normal training load': 'Construyendo — carga normal de entrenamiento',
          'Fresh — good time for key efforts': 'Fresco — buen momento para esfuerzos clave',
          'Loaded — active build block': 'Cargado — bloque de construcción activo',
          'Overloaded — excessive fatigue risk': 'Sobrecargado — riesgo de fatiga excesiva',
          'Possible fitness loss — train more': 'Posible pérdida de forma — entrena más'
        }[loadStatus.formLabel] || loadStatus.formLabel;
        lines.push('**Carga Calculada (modelo CTL/ATL/TSB):**');
        lines.push(`- CTL (Fitness, 42 días): ${loadStatus.ctl}`);
        lines.push(`- ATL (Fatiga, 7 días): ${loadStatus.atl}`);
        lines.push(`- TSB (Forma): ${loadStatus.tsb > 0 ? '+' : ''}${loadStatus.tsb} — ${formLabelEs}`);
        lines.push('');
      }

      // ── ZONAS CARDÍACAS ──────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Zonas Cardíacas');
      lines.push('');
      lines.push('### Configuración de Zonas (basada en LTHR)');
      lines.push('');
      const lthr = state.profile?.lthr || 174;
      const zoneRef = buildHRZoneReference(lthr);
      const zoneNames = { 1: 'Z1 Recuperación', 2: 'Z2 Aeróbica', 3: 'Z3 Aeróbica Moderada', 4: 'Z4 Umbral', 5: 'Z5 Máxima' };
      lines.push(`| Zona | Rango (LTHR ${lthr} bpm) | Objetivo |`);
      lines.push('|------|--------------------------|----------|');
      zoneRef.forEach(z => {
        lines.push(`| ${zoneNames[z.num]} | ${fmtZoneRange(z)} bpm | ${z.objective.es} |`);
      });
      lines.push('');
      lines.push('### Tiempo en Zonas');
      lines.push('');
      lines.push('| Zona | Tiempo | % |');
      lines.push('|------|--------|---|');
      [1,2,3,4,5].forEach(z => {
        lines.push(`| Z${z} | ${zoneTimeFmt(z)} | ${zonePct(z)}% |`);
      });
      lines.push('');
      if (seg) lines.push('> Sesión completa (incluye calentamiento, aceleraciones, pausas y trote final). La evaluación usa el bloque de trabajo de abajo.', '');

      // ── BLOQUE DE TRABAJO (ritmo sostenido) ─────────────────────────────
      if (seg) {
        const m = seg.main, tz = m.timeInZones;
        const mmss = s => secToMMSS(Math.round(s || 0));
        lines.push('---', '', '## Bloque de Trabajo — Ritmo Sostenido', '');
        lines.push(`**Detección:** ${seg.method === 'plan' ? `vueltas ${seg.lapFrom + 1}–${seg.lapTo + 1} del reloj, emparejadas con los pasos del plan` : `vueltas ${seg.lapFrom + 1}–${seg.lapTo + 1} con FC ≥ 90% del umbral (sin plan vinculado)`} · resolución ${m.sampleStepSec} s`);
        lines.push(`**Duración del bloque:** ${mmss(seg.workSec)}${seg.plannedWorkLoSec ? ` (plan: ${Math.round(seg.plannedWorkLoSec / 60)}${seg.plannedWorkHiSec !== seg.plannedWorkLoSec ? '–' + Math.round(seg.plannedWorkHiSec / 60) : ''} min)` : ''}`);
        if (seg.arranque) {
          const A = seg.arranque;
          lines.push(`**Arranque:** ${mmss(A.durSec)} a ${fmtPace(A.paceSecPerMi)}${A.targetFast ? ` (objetivo ${fmtPaceNoUnit(A.targetFast)}–${fmtPace(A.targetSlow)})` : ''} · FC ${A.hrStart}→${A.hrEnd}`);
        }
        lines.push(`**Parte sostenida:** ${mmss(m.durSec)} · ${m.distMi.toFixed(2)} mi · ${fmtPace(m.paceSecPerMi)} · FC ${m.avgHR}/${m.maxHR} · cadencia ${m.avgCad || ND} spm`);
        lines.push(`**FC en la franja ${m.bandLo}–${m.bandHi}:** ${mmss(m.bandSec)} (${m.bandPct}%)`);
        lines.push(`**FC sobre ${lthrR}:** ${mmss(m.aboveLthrSec)} en total · racha más larga ${m.longestAboveLthrSec} s (bajadas de menos de ${m.sampleStepSec} s no la cortan) ${m.longestAboveLthrSec > 60 ? '— **pasó la regla de 60 s**' : '(regla: bajar si pasa de 60 s seguidos)'}`);
        lines.push(`**Zonas del bloque:** Z1 ${tz.pct.z1}% · Z2 ${tz.pct.z2}% · Z3 ${tz.pct.z3}% · Z4 ${tz.pct.z4}% · Z5 ${tz.pct.z5}%`);
        if (m.drift) lines.push(`**Deriva en el bloque:** ${m.drift.bpm >= 0 ? '+' : ''}${m.drift.bpm} bpm (${m.drift.pct >= 0 ? '+' : ''}${m.drift.pct}%)`);
        if (m.decoupling) {
          const d = m.decoupling;
          lines.push(d.valid
            ? `**Desacople del bloque:** ${d.value.toFixed(1)}% (1ª mitad ${fmtPace(d.pace1)} · FC ${d.hr1} → 2ª mitad ${fmtPace(d.pace2)} · FC ${d.hr2}) — ${d.value < 5 ? 'excelente' : d.value < 7.5 ? 'aceptable' : d.value < 10 ? 'alto, revisa calor o ritmo de salida' : 'muy alto'}`
            : `**Desacople del bloque:** ${ND} — no válido (${d.reasonEs})`);
        }
        if (m.cvPct != null) lines.push(`**Consistencia del ritmo (bloques de 2 min):** CV ${m.cvPct}%`);
        lines.push('');
        if (m.splits.length) {
          lines.push('| Min | Ritmo | FC Prom | FC Máx | Cadencia |');
          lines.push('|-----|-------|---------|--------|----------|');
          m.splits.forEach(s => lines.push(`| ${s.fromMin}–${s.toMin}${s.partial ? '*' : ''} | ${fmtPace(s.paceSecPerUnit)} | ${s.avgHR ?? ND} | ${s.maxHR ?? ND} | ${s.avgCadence ?? ND} |`));
          lines.push('');
        }
        lines.push('### Pasos de la Sesión (por vuelta)', '');
        lines.push('| Vuelta | Paso | Duración | Dist. | Ritmo | FC Prom/Máx | Cadencia |');
        lines.push('|---|---|---|---|---|---|---|');
        seg.lapLabels.forEach(l => lines.push(`| ${l.lapIndex + 1} | ${l.label} | ${mmss(l.durSec)} | ${l.distMi.toFixed(2)} mi | ${l.paceSecPerMi > 0 && l.paceSecPerMi < 3600 ? fmtPace(l.paceSecPerMi) : ND} | ${l.avgHR}/${l.maxHR} | ${l.cad ? l.cad + ' spm' : ND} |`));
        lines.push('');
      }

      // ── DERIVA CARDÍACA ──────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Deriva Cardíaca');
      lines.push('');
      if (a.cardiacDrift && a.cardiacDriftValid === false) {
        lines.push(`**Deriva de la sesión completa:** ${ND} — no válida: ${a.cardiacDriftInvalidReasonEs}.`);
        if (seg && seg.main.drift) lines.push(`**Deriva en el bloque de trabajo:** ${seg.main.drift.bpm >= 0 ? '+' : ''}${seg.main.drift.bpm} bpm (${seg.main.drift.pct >= 0 ? '+' : ''}${seg.main.drift.pct}%) — ver sección anterior.`);
      } else if (a.cardiacDrift) {
        lines.push(`**FC Primera Mitad:** ${a.cardiacDrift.avgHRFirstHalf} bpm`);
        lines.push(`**FC Segunda Mitad:** ${a.cardiacDrift.avgHRSecondHalf} bpm`);
        const driftPctSign = a.cardiacDrift.driftPct >= 0 ? '+' : '';
        const driftBpmSign = a.cardiacDrift.driftBpm >= 0 ? '+' : '';
        lines.push(`**Deriva:** ${driftPctSign}${a.cardiacDrift.driftPct}% (${driftBpmSign}${a.cardiacDrift.driftBpm} bpm)`);
        lines.push(`**Pace cambió entre mitades:** ${a.cardiacDrift.pacingChanged ? 'Sí' : 'No'}`);
        lines.push('');
        lines.push(`**Interpretación:** ${autoEval.driftInterp || ND}`);
        lines.push('');
        lines.push('> Referencia: < 5% = Excelente | 5-8% = Normal | 8-10% = Fatiga o calor | > 10% = Exceso de intensidad');
      } else {
        lines.push(ND + ' — datos insuficientes');
      }
      lines.push('');

      // ── SPLITS ───────────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push(`## Splits Reales (por milla)`);
      lines.push('');
      const splits = a.realSplitsMi || [];
      if (splits.length) {
        lines.push(isBike ? '| # | Velocidad | FC Prom | FC Máx | Cadencia | Elev +/- |' : '| # | Pace | FC Prom | FC Máx | Cadencia | Elev +/- |');
        lines.push('|---|------|---------|--------|----------|----------|');
        splits.forEach(s => {
          const paceOrSpeed = isBike ? `${(s.paceSecPerUnit > 0 ? (3600/s.paceSecPerUnit).toFixed(1) : '0.0')} mph` : fmtPace(s.paceSecPerUnit);
          lines.push(`| ${s.splitNum}${s.partial ? '*' : ''} | ${paceOrSpeed} | ${s.avgHR ? Math.round(s.avgHR) : ND} | ${s.maxHR ? Math.round(s.maxHR) : ND} | ${s.avgCadence ? Math.round(s.avgCadence) : ND} | +${s.elevGainM}m/-${s.elevLossM}m |`);
        });
        if (splits.some(s => s.partial)) lines.push('');
        lines.push(`*  Parcial (distancia: ${(splits.find(s=>s.partial)?.distM/1609.344 || 0).toFixed(2)} mi)`);
      } else {
        lines.push(ND);
      }
      lines.push('');

      // ── SPLITS POR REPETICIÓN (INTERVALOS) ────────────────────────────────
      // "Splits Reales" above is per-mile — meaningless for a 0.5mi interval session, where a
      // single mile blends a fast rep with its walk-back recovery. t.laps carries Garmin's own
      // lap boundaries (manual/auto-lap), tagged 'work'/'recovery' by the same threshold that
      // already drives workPaceSecPerMi — this just exposes each individual rep instead of only
      // the blended average, which is what actually shows fatigue progression (or its absence)
      // across a set.
      if (!isBike && !seg && Array.isArray(t.laps) && t.workLapsCount >= 2) {
        const workReps = t.laps.filter(l => l.repType === 'work').sort((x, y) => x.lapIndex - y.lapIndex);
        const recoveryReps = t.laps.filter(l => l.repType === 'recovery').sort((x, y) => x.lapIndex - y.lapIndex);

        lines.push('---');
        lines.push('');
        lines.push('## Splits por Repetición (Intervalos)');
        lines.push('');
        if (a.repMatch) {
          lines.push(`> Repeticiones emparejadas con el plan: ${a.repMatch.matched} de ${a.repMatch.planned} (por duración de vuelta; calentamiento y aceleraciones excluidos).`);
          lines.push('');
        }
        lines.push('| Rep | Pace | FC Prom/Máx | Cadencia | Potencia | Elev+ |');
        lines.push('|---|------|------|----------|----------|-------|');
        workReps.forEach((l, idx) => {
          const cad = l.avgCadSPM ? Math.round(l.avgCadSPM) : ND;
          const watts = l.avgWatts ? `${l.avgWatts} W` : ND;
          const elev = `+${Math.round(l.elevGainM)}m`;
          lines.push(`| ${idx + 1} | ${fmtPace(l.avgPaceSecPerMi)} | ${Math.round(l.avgHR)}/${Math.round(l.maxHR)} | ${cad} spm | ${watts} | ${elev} |`);
        });
        lines.push('');

        if (recoveryReps.length) {
          lines.push('### Recuperaciones entre Repeticiones');
          lines.push('');
          lines.push('| # | Duración | FC Inicio→Fin |');
          lines.push('|---|----------|----------------|');
          recoveryReps.forEach((l, idx) => {
            const dur = `${Math.floor(l.totalTimeSec / 60)}:${Math.round(l.totalTimeSec % 60).toString().padStart(2, '0')}`;
            const hrTrend = (l.firstHR && l.lastHR) ? `${Math.round(l.firstHR)}→${Math.round(l.lastHR)}` : ND;
            lines.push(`| ${idx + 1} | ${dur} | ${hrTrend} |`);
          });
          lines.push('');
        }

        // Rep-to-rep HR drift at matched effort — a cleaner fatigue signal than whole-session
        // cardiac drift, which the elevation-asymmetry guard above frequently invalidates for
        // exactly this session type (short reps + long, uneven recoveries).
        if (workReps.length >= 2) {
          const first = workReps[0], last = workReps[workReps.length - 1];
          const hrDelta = Math.round(last.avgHR - first.avgHR);
          const paceDeltaSec = Math.round(last.avgPaceSecPerMi - first.avgPaceSecPerMi);
          const paceStable = Math.abs(paceDeltaSec) <= 15; // within ~15 sec/mi counts as held pace
          lines.push(`**Deriva HR entre reps:** ${hrDelta >= 0 ? '+' : ''}${hrDelta} bpm de la rep 1 a la rep ${workReps.length} (${fmtPace(first.avgPaceSecPerMi)} → ${fmtPace(last.avgPaceSecPerMi)})`);
          lines.push('');
          if (paceStable && hrDelta > 10) {
            lines.push(`**Interpretación:** Pace estable con FC subiendo ${hrDelta} bpm — costo cardiovascular/térmico creciente, no pérdida de potencia muscular. Revisa potencia por rep arriba para confirmar.`);
          } else if (!paceStable && paceDeltaSec > 0) {
            lines.push(`**Interpretación:** El pace se degradó ${paceDeltaSec}s/mi de la primera a la última rep junto con el cambio de FC — posible fatiga muscular sumándose a la cardiovascular.`);
          }
          lines.push('');
        }
      }

      // ── RUN / WALK ───────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      
      // Aerobic Decoupling — read from the stored analysis rather than recomputed here.
      // A second local implementation is exactly how the printed number and the number driving
      // the session grade drifted apart; calcAerobicDecoupling() is now the only place this is
      // calculated, and parseTCX() ran it on these same per-mile splits at import time.
      const dec = a.decouplingInfo;
      if (dec && dec.value != null) {
        lines.push('## Decoupling Aeróbico (HR/Pace Divergence)');
        lines.push('');
        lines.push(`**Primera Mitad:** ${dec.avgHRFirst} bpm avg, ${fmtPace(dec.avgPaceFirst)} pace`);
        lines.push(`**Segunda Mitad:** ${dec.avgHRSecond} bpm avg, ${fmtPace(dec.avgPaceSecond)} pace`);

        if (dec.excludedFirstMile) lines.push('*Calculado sin la milla 1 (calentamiento).*');
        if (!dec.valid) {
          lines.push(`**Decoupling:** ${ND} — no válido`);
          const why = dec.reasonEs || 'datos insuficientes';
          lines.push(`**Motivo:** ${why.charAt(0).toUpperCase() + why.slice(1)}.${/elevaci/.test(why) ? ' El cambio de ritmo lo explica la pendiente, no la fatiga.' : ''}`);
          if (seg && seg.main.decoupling && seg.main.decoupling.valid) lines.push(`**Desacople del bloque de trabajo:** ${seg.main.decoupling.value.toFixed(1)}% — ver "Bloque de Trabajo".`);
        } else {
          lines.push(`**Decoupling:** ${dec.value.toFixed(1)}%`);
          if (dec.value < 0) {
            lines.push(`**Interpretación:** Eficiencia mejoró ${Math.abs(dec.value).toFixed(1)}% — ritmo más rápido al mismo costo cardíaco.`);
          } else if (dec.value < 5) {
            lines.push('**Interpretación:** Excelente — motor aeróbico consistente y eficiente.');
          } else if (dec.value < 10) {
            lines.push('**Interpretación:** Normal — fatiga acumulada leve.');
          } else {
            lines.push('**Interpretación:** Alto — fatiga cardíaca significativa. Considera más volumen Z2.');
          }
        }
        lines.push('');
      }

      if (!isBike) {
        lines.push('## Run / Walk');
        lines.push('');
        if (a.runWalk) {
          lines.push(`**Tiempo corriendo:** ${secToHHMMSS(a.runWalk.runTimeSec)} (${a.runWalk.runPct}%)`);
          lines.push(`**Tiempo caminando:** ${secToHHMMSS(a.runWalk.walkTimeSec)} (${100-a.runWalk.runPct}%)`);
          lines.push(`**Pausas detectadas:** ${a.runWalk.walkSegments?.length || 0}`);
          if (a.slowSegments && a.slowSegments.totalSec > (a.runWalk.walkTimeSec || 0) + 10) {
            lines.push(`**Tramos lentos/caminata por cadencia:** ${a.slowSegments.segments.length} tramo(s), ${secToHHMMSS(a.slowSegments.totalSec)} (velocidad < 2.3 m/s y cadencia < 140 spm) — detalle en Análisis Avanzado`);
          }
          if (a.runWalk.walkSegments?.length) {
            lines.push('');
            lines.push('| # | Inicio | Duración |');
            lines.push('|---|--------|----------|');
            a.runWalk.walkSegments.forEach((w,i) => {
              lines.push(`| ${i+1} | @${secToMMSSOffset(w.startOffsetSec)} | ${Math.round(w.durationSec)}s |`);
            });
          }
        } else {
          lines.push(ND);
        }
        lines.push('');
      }

      // ── ANÁLISIS AVANZADO DEL TCX ────────────────────────────────────────
      if (!isBike && a.advanced) {
        const A = a.advanced, mm = secToMMSSOffset;
        lines.push('---');
        lines.push('');
        lines.push('## Análisis Avanzado del TCX');
        lines.push('');
        if (a.slowSegments && a.slowSegments.segments.length) {
          lines.push(`**Tramos lentos/caminata (velocidad < 2.3 m/s y cadencia < 140 spm):** ${a.slowSegments.segments.length} tramo(s), ${mm(a.slowSegments.totalSec)} en total`);
          lines.push('');
          lines.push('| # | Inicio | Dist. | Duración | Pace | FC | Cadencia |');
          lines.push('|---|--------|-------|----------|------|----|----------|');
          a.slowSegments.segments.forEach((x, i) => {
            lines.push(`| ${i + 1} | @${mm(x.startOffsetSec)} | ${x.startDistM != null ? (x.startDistM / 1609.344).toFixed(2) + ' mi' : ND} | ${x.durationSec}s | ${fmtPace(x.avgPaceSecPerMi)} | ${x.avgHR || ND} | ${x.avgCad || ND} |`);
          });
          lines.push('');
        }
        lines.push('### Cuartos de milla (0.25 mi)');
        lines.push('');
        lines.push('| Mi | Pace | FC Prom | FC Máx | Cad | Pendiente | Zancada (m) | Eficiencia |');
        lines.push('|----|------|---------|--------|-----|-----------|-------------|------------|');
        A.segments.forEach(x => {
          lines.push(`| ${x.startMi.toFixed(2)}–${x.endMi.toFixed(2)} | ${fmtPace(x.paceSecPerMi)} | ${x.avgHR || ND} | ${x.maxHR || ND} | ${x.avgCad || ND} | ${x.gradePct != null ? (x.gradePct > 0 ? '+' : '') + x.gradePct + '%' : ND} | ${x.strideM || ND} | ${x.effIdx || ND} |`);
        });
        lines.push('');
        lines.push('_Zancada = metros por paso (velocidad ÷ pasos/seg). Eficiencia = m/min por latido (más alto = mejor)._');
        lines.push('');
        if (A.bands.length) {
          lines.push('### Rendimiento por pendiente');
          lines.push('');
          lines.push('| Terreno | Dist. | Tiempo | Pace | FC Prom |');
          lines.push('|---------|-------|--------|------|---------|');
          A.bands.forEach(b => lines.push(`| ${b.label} | ${b.distMi.toFixed(2)} mi | ${mm(b.durSec)} | ${fmtPace(b.paceSecPerMi)} | ${b.avgHR || ND} |`));
          lines.push('');
        }
        lines.push('### Carga cardíaca');
        lines.push('');
        lines.push(`- **FC máxima observada:** ${A.obsMaxHR} bpm (${A.pctLthrAtMax}% de LTHR${A.pctHrMaxAtMax ? ', ' + A.pctHrMaxAtMax + '% de FC máx de perfil' : ''})`);
        lines.push(`- **Tiempo con FC ≥ LTHR:** ${mm(A.timeAboveLthrSec)}`);
        A.milestones.forEach(m => lines.push(`- **Primera vez en ${m.label}:** @${mm(m.tSec)} (mi ${m.distMi.toFixed(2)})`));
        lines.push('');
        lines.push('### Mitades y cierre');
        lines.push('');
        lines.push(`- **1ª mitad:** ${fmtPace(A.halves.firstPace)} · FC ${A.halves.firstHR || ND}`);
        lines.push(`- **2ª mitad:** ${fmtPace(A.halves.secondPace)} · FC ${A.halves.secondHR || ND}`);
        lines.push(`- **Diferencia:** ${A.halves.deltaSec > 0 ? '+' : ''}${Math.round(A.halves.deltaSec)} s/mi (${Math.abs(A.halves.deltaSec) < 3 ? 'parejo' : (A.halves.deltaSec > 0 ? 'positive split' : 'negative split')}; ojo: el perfil de elevación afecta esta lectura)`);
        if (A.finish) lines.push(`- **Últimos 400 m:** ${fmtPace(A.finish.lastPace)} vs ${fmtPace(A.finish.prevMilePace)} la milla previa (${A.finish.deltaSec > 0 ? '+' : ''}${Math.round(A.finish.deltaSec)} s/mi) · FC ${A.finish.lastHR || ND}`);
        if (A.best) lines.push(`- **Mejor cuarto:** mi ${A.best.startMi.toFixed(2)}–${A.best.endMi.toFixed(2)} a ${fmtPace(A.best.paceSecPerMi)} (${A.best.gradePct != null ? A.best.gradePct + '%' : ND})`);
        if (A.worst) lines.push(`- **Peor cuarto:** mi ${A.worst.startMi.toFixed(2)}–${A.worst.endMi.toFixed(2)} a ${fmtPace(A.worst.paceSecPerMi)} (${A.worst.gradePct != null ? A.worst.gradePct + '%' : ND})`);
        if (A.stride) lines.push(`- **Zancada 1er cuarto → último cuarto de la carrera:** ${A.stride.firstQuarterAvgM} m → ${A.stride.lastQuarterAvgM} m`);
        lines.push('');
        if (A.series && A.series.length) {
          lines.push('### Serie temporal (cada ~15 s, CSV)');
          lines.push('');
          lines.push('```csv');
          lines.push('t_sec,dist_mi,pace_sec_mi,hr,cad_spm,alt_ft');
          A.series.forEach(r => lines.push([r.tSec, r.distMi, r.paceSecPerMi ?? '', r.hr ?? '', r.cad ?? '', r.altFt ?? ''].join(',')));
          lines.push('```');
          lines.push('');
        }
      }

      // ── CADENCIA POR SEGMENTO ────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Cadencia por Segmento');
      lines.push('');
      if (a.cadenceSegments?.length) {
        a.cadenceSegments.forEach(s => lines.push(`- Segmento ${s.segment}: ${s.avgCadence} spm`));
      } else {
        lines.push(ND);
      }
      lines.push('');

      // ── POTENCIA ─────────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Potencia');
      lines.push('');
      if (a.powerStats) {
        lines.push(`**Promedio:** ${a.powerStats.avgWatts} W`);
        lines.push(`**Máxima:** ${a.powerStats.maxWatts} W`);
        lines.push(`**Desviación Estándar:** ±${a.powerStats.stdevWatts} W`);
      } else {
        lines.push(ND + ' — sin datos de potencia en este TCX');
      }
      lines.push('');

      // ── CONSISTENCIA DE RITMO ────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Consistencia de Ritmo');
      lines.push('');
      if (a.pacingConsistency) {
        lines.push(`**Coeficiente de Variación:** ${a.pacingConsistency.cvPct}%`);
        lines.push(`**Evaluación:** ${autoEval.consistencyLabel}`);
        lines.push('');
        lines.push('> Referencia: < 3% = Excelente | 3-6% = Buena | 6-10% = Variable | > 10% = Inconsistente');
      } else {
        lines.push(ND + ' — splits insuficientes');
      }
      lines.push('');

      // ── FATIGA ───────────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Fatiga Entre Sesiones');
      lines.push('');
      if (fatigue.available) {
        lines.push(`**FC Base (últimas ${fatigue.sessionsCompared}):** ${fatigue.baselineAvgHR} bpm`);
        lines.push(`**Delta FC:** ${fatigue.hrDeltaBpm > 0 ? '+' : ''}${fatigue.hrDeltaBpm} bpm`);
        lines.push(`**Delta Pace:** ${fatigue.paceDeltaSec > 0 ? '+' : ''}${fatigue.paceDeltaSec}s/mi (${fatigue.paceDeltaSec > 0 ? 'más lento' : 'más rápido'} que base)`);
        lines.push(`**Señal:** ${fatigue.signal}`);
        lines.push(fatigue.sameTypeOnly ? '*Comparado solo contra sesiones del mismo tipo.*' : '*⚠ Comparado contra sesiones de tipos mixtos — interpretar con cautela.*');
      } else {
        lines.push('No hay sesiones previas para comparar');
      }
      lines.push('');

      // ── HRV PROXY ────────────────────────────────────────────────────────
      // Only show the estimated proxy when the athlete has NOT entered a real measured HRV.
      // Printing both (e.g. "HRV: 44 ms" above and "HRV Proxy: 0.9" here) invites reading the
      // proxy as a second, contradictory measurement of the same thing.
      if (a.hrvProxy && !(mf && mf.hrv)) {
        lines.push('---');
        lines.push('');
        lines.push('## HRV (Aproximado del TCX)');
        lines.push('');
        lines.push(`**HRV Proxy:** ${a.hrvProxy} (variabilidad inter-latido estimada)`);
        lines.push('> Nota: Este valor es una aproximación basada en variaciones de FC entre trackpoints, no sustituye un HRV medido directamente por el reloj.');
        lines.push('');
      }

      // ── RPE Y SENSACIONES ────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Percepción del Esfuerzo (RPE)');
      lines.push('');
      lines.push('| Escala | Descripción |');
      lines.push('|--------|-------------|');
      lines.push('| 1 | Muy fácil |');
      lines.push('| 2 | Caminata relajada |');
      lines.push('| 3 | Conversacional muy cómoda |');
      lines.push('| 4 | Fácil |');
      lines.push('| 5 | Moderada |');
      lines.push('| 6 | Moderadamente difícil |');
      lines.push('| 7 | Difícil |');
      lines.push('| 8 | Muy difícil |');
      lines.push('| 9 | Casi máximo |');
      lines.push('| 10 | Máximo esfuerzo |');
      lines.push('');
      lines.push(`**RPE de esta sesión:** ${mf.rpe ? mf.rpe + '/10' : ND}`);
      lines.push('');
      lines.push('## Sensaciones del Atleta');
      lines.push('');
      lines.push(mf.athleteNotes || ND);
      lines.push('');

      // ── EVALUACIÓN POR CARACTERÍSTICA ───────────────────────────────────────
      // Eight independent axes, each graded on its own evidence — see calcCategoryGrades().
      // The point is diagnostic: "how good, overall" is one number (below, in Evaluación
      // Automática and the metadata header); "good/bad at WHAT specifically" needs several.
      // Only categories the session actually produced evidence for are shown.
      {
        const cg = a.categoryGrades;
        if (cg) {
          const CAT_LABELS = {
            pacing: 'Pacing', cadence: 'Cadencia', continuity: 'Continuidad',
            durability: 'Durabilidad', cvControl: 'Control cardiovascular',
            hrDataQuality: 'Calidad de datos FC',
            value5K: 'Valor para preparación 5K', valueEndurance: 'Valor para evaluar resistencia'
          };
          const order = ['pacing', 'cadence', 'continuity', 'durability', 'cvControl',
            'hrDataQuality', 'value5K', 'valueEndurance'];
          const rows = order.filter(k => cg[k] != null);
          if (rows.length) {
            lines.push('---');
            lines.push('');
            lines.push('## Evaluación por Característica');
            lines.push('');
            let anyFlagged = false;
            rows.forEach(k => {
              const c = cg[k];
              const mark = c.flagged ? '*' : '';
              if (c.flagged) anyFlagged = true;
              lines.push(`**${CAT_LABELS[k]}:** ${c.letter}${mark}`);
            });
            lines.push('');
            lines.push(`**Evaluación General:** ${a.sessionGrade} (${a.sessionScore}/100)`);
            if (anyFlagged) {
              lines.push('');
              lines.push('*Confiabilidad reducida por calidad de señal de FC.');
            }
            if (cg.hrQualityDiagnostics) {
              lines.push('');
              lines.push(`> Calidad de datos FC: ${cg.hrQualityDiagnostics.glitchPct}% de la sesión con saltos de FC implausibles${cg.hrQualityDiagnostics.worstFlatlineMin >= 1 ? `, racha más larga de lectura fija: ${cg.hrQualityDiagnostics.worstFlatlineMin} min` : ''}.`);
            }
            lines.push('');
          }
        }
      }

      // ── EVALUACIÓN AUTOMÁTICA ─────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Evaluación Automática');
      lines.push('');
      lines.push(`**Estado Aeróbico:** ${autoEval.aerobicState}`);
      lines.push(`**Consistencia de Ritmo:** ${autoEval.consistencyLabel}`);
      lines.push(`**Recuperación Recomendada:** ${autoEval.recovery}`);
      lines.push(`**Próxima Sesión Recomendada:** ${autoEval.nextSession}`);
      lines.push('');

      // ── PLANEADO VS REAL ─────────────────────────────────────────────────
      // A real comparison table: target, actual, delta, and a verdict per row. Rest days and
      // rep-based sessions are handled explicitly rather than printing zeros that read as
      // failures. Substep counts are shown only when the athlete has actually ticked something,
      // since an untouched checklist says nothing about how the session went.
      if (linkedSession) {
        lines.push('---');
        lines.push('');
        lines.push('## Planeado vs Real');
        lines.push('');

        const planType = normalizeSessionType(linkedSession.type) || linkedSession.type;
        const isRestPlan = planType === 'rest';
        const hasPaceTarget = linkedSession.pacePerMi > 0;
        const hasDistTarget = linkedSession.targetDistM > 0;
        const hasTimeTarget = linkedSession.targetTimeSec > 0;

        if (isRestPlan) {
          lines.push(`> El día ${linkedSession.day} era **descanso**. Registraste ${t.totalDistMi.toFixed(2)} mi en ${secToHHMMSS(t.totalTimeSec)} — el plan pedía no entrenar.`);
          lines.push('');
        } else if (!hasPaceTarget && !hasDistTarget && !hasTimeTarget) {
          lines.push(`> El día ${linkedSession.day} del plan no tiene objetivos configurados, así que no hay comparación posible. Edita el día en la pestaña PLAN o vuelve a importar el plan con pace/distancia.`);
          lines.push('');
        } else {
          const rows = planVsActualRows(linkedSession, t);
          if (rows.length) {
            lines.push('| Métrica | Objetivo | Real | Diferencia | Evaluación |');
            lines.push('|---------|----------|------|------------|------------|');
            rows.forEach(r => lines.push(`| ${r.join(' | ')} |`));
            lines.push('');
            const judged = rows.filter(r => r[4] !== 'Informativo');
            const offTarget = judged.filter(r => r[4] !== 'En objetivo').length;
            lines.push(offTarget === 0
              ? '**Adherencia:** sesión ejecutada según lo planificado.'
              : `**Adherencia:** ${judged.length - offTarget}/${judged.length} métricas en objetivo.`);
            if (a.workSegment) lines.push('', '*Ritmo, FC y zonas se miden en el bloque de trabajo; distancia y duración, en la sesión completa.*');
            lines.push('');
          }
        }

        const subs = linkedSession.substeps || [];
        const doneCount = subs.filter(x => x.done).length;
        if (doneCount > 0) {
          lines.push(`**Sub-pasos completados:** ${doneCount}/${subs.length}`);
          lines.push('');
        }
      }

      lines.push('---');
      lines.push('');
      lines.push(`*Generado por FitCoach 5K — ${todayISO()}*`); // local date (toISOString is UTC and flips after 8 PM in PR)

      // Filter sections if in quick mode — keep only the essentials for a coach-facing summary
      if (reportMode === 'quick') {
        const QUICK_MODE_SECTIONS = ['Información General', 'Ruta Evaluada', 'Resultados de la Sesión',
                                      'Zonas Cardíacas', 'Splits Reales', 'Decoupling Aeróbico', 'Evaluación Automática'];
        const finalLines = [];
        let currentSection = null; // null = before first "##" header (metadata block, title) — always kept
        let sectionAllowed = true;
        let skippingCodeBlock = false;
        for (const line of lines) {
          // Never filter the leading metadata code block
          if (line.startsWith('```')) { skippingCodeBlock = !skippingCodeBlock; finalLines.push(line); continue; }
          if (skippingCodeBlock) { finalLines.push(line); continue; }
          if (line.startsWith('## ')) {
            currentSection = line.replace(/##/g, '').trim();
            sectionAllowed = QUICK_MODE_SECTIONS.some(s => currentSection.includes(s));
          }
          if (currentSection === null || sectionAllowed) finalLines.push(line);
        }
        return finalLines.join('\n');
      }

      return lines.join('\n');
    }



    // ═══════════════════════════════════════════════════════════════════════
    // STRUCTURED .MD EXPORT — fixed schema for the companion coaching app
    // (Actividad / Estado_previo / Datos_principales / Zonas / Deriva_cardiaca / Ritmo /
    //  Esfuerzo_percibido / Evaluacion_entrenador). Units follow the schema: miles, min/mi,
    // °C, km/h, lb. A field with no data is left EMPTY (never guessed), so the receiving app
    // can tell "unknown" from "zero". Enumerated fields are derived from the rules below.
    // ═══════════════════════════════════════════════════════════════════════
    function buildAppMarkdown(act) {
      const a = act.analysis || {};
      const mf = act.manualFields || {};
      const lthr = state.profile?.lthr || 174;
      const isBike = act.sport === 'biking';
      const linked = act.linkedPlanDay ? state.plan.find(x => x.day === act.linkedPlanDay) : null;

      const num = (v, d) => (v == null || v === '' || isNaN(parseFloat(v))) ? '' : (d == null ? String(parseFloat(v)) : parseFloat(v).toFixed(d));
      const fToC = (f) => (f == null || f === '' || isNaN(parseFloat(f))) ? '' : ((parseFloat(f) - 32) * 5 / 9).toFixed(1);
      const mphToKmh = (m) => (m == null || m === '' || isNaN(parseFloat(m))) ? '' : (parseFloat(m) * 1.609344).toFixed(1);
      const oneLine = (x) => String(x == null ? '' : x).replace(/\s*\n\s*/g, ' ').trim();

      // ── tipo / objetivo_zona ──
      const TIPO = { easy: 'facil', tempo: 'tempo', intervals: 'intervalos', long: 'tirada', race_sim: 'carrera' };
      const ZONA = { easy: 'Z2', long: 'Z2', tempo: 'Z4', intervals: 'Z5', race_sim: 'Z4' };
      let rawType = (linked && linked.type) || '';
      let tipo = TIPO[rawType] || '';
      if (!tipo && mf.trainingType) {
        const tt = String(mf.trainingType).toLowerCase();
        if (/f[aá]cil|easy|z2|recuper/.test(tt)) tipo = 'facil';
        else if (/tempo|umbral|threshold/.test(tt)) tipo = 'tempo';
        else if (/interval|series|rep/.test(tt)) tipo = 'intervalos';
        else if (/larg|long|tirada/.test(tt)) tipo = 'tirada';
        else if (/fuerza|strength/.test(tt)) tipo = 'fuerza';
        else if (/test|prueba/.test(tt)) tipo = 'test';
        else if (/carrera|race/.test(tt)) tipo = 'carrera';
      }
      const zonaObj = tipo === 'fuerza' ? 'fuerza'
        : ({ facil: 'Z2', tirada: 'Z2', tempo: 'Z4', intervalos: 'Z5', carrera: 'Z4', test: 'Z4' }[tipo] || '');

      // ── terreno: manual surface text wins; otherwise inferred from elevation gain per mile ──
      let terreno = '';
      const surf = String(mf.surface || '').toLowerCase();
      if (surf) {
        if (/pista|track/.test(surf)) terreno = 'pista';
        else if (/llan|flat|plano/.test(surf)) terreno = 'llano';
        else if (/cuest|hill|subid|mont/.test(surf)) terreno = 'cuestas';
        else if (/ondul|roll/.test(surf)) terreno = 'ondulado';
        else terreno = 'mixto';
      } else if (a.elevGainPerMi != null) {
        terreno = a.elevGainPerMi < 20 ? 'llano' : (a.elevGainPerMi < 60 ? 'ondulado' : 'cuestas');
      }

      // ── clima (°F/mph in the app → °C/km/h in the schema) ──
      const tempF = act.hasTempData ? act.avgTempF : mf.temperature;

      // ── dolor enum ──
      const painRaw = oneLine(mf.painNotes);
      let dolor = '';
      if (painRaw) {
        const pl = painRaw.toLowerCase();
        if (/^(ninguno|ninguna|no|none|nada|n\/a|sin dolor)\b/.test(pl)) dolor = 'ninguno';
        else if (/alto|fuerte|severo|agudo|intenso|no puedo/.test(pl)) dolor = 'alto';
        else if (/moderad/.test(pl)) dolor = 'moderado';
        else dolor = 'leve';
      }

      // ── zonas ──
      const f = zoneFloors(lthr);
      const zs = a.timeInZones?.seconds || null;
      const zmin = (z) => zs ? (Math.round(((zs[z] || 0) / 60) * 10) / 10).toFixed(1) : '';
      const zTotal = zs ? Object.values(zs).reduce((x, y) => x + y, 0) : 0;
      const zShare = (list) => zTotal ? list.reduce((x, z) => x + (zs[z] || 0), 0) / zTotal : null;

      // ── deriva enum: <=3% excelente | <=5% normal | >5% → calor (>=85°F) o exceso_intensidad ──
      const cd = a.cardiacDrift || null;
      let derivaInterp = '';
      if (cd && cd.driftPct != null) {
        if (cd.driftPct <= 3) derivaInterp = 'excelente';
        else if (cd.driftPct <= 5) derivaInterp = 'normal';
        else derivaInterp = (parseFloat(tempF) >= 85) ? 'fatiga_calor' : 'exceso_intensidad';
      }

      // ── ritmo consistencia enum ──
      const cv = a.pacingConsistency?.cvPct;
      let ritmoEval = '';
      if (cv != null) ritmoEval = cv < 3 ? 'excelente' : (cv < 6 ? 'buena' : (cv < 10 ? 'variable' : 'inconsistente'));

      // ── evaluación del entrenador (rules stated in the header comment of this function) ──
      const score = a.sessionScore;
      const calidad = score == null ? '' : (score >= 75 ? 'alta' : (score >= 60 ? 'media' : 'baja'));
      let zonaCumplida = '';
      if (zTotal && zonaObj && zonaObj !== 'fuerza') {
        const share = { Z2: () => zShare([1, 2]), Z4: () => zShare([4]), Z5: () => zShare([4, 5]) }[zonaObj];
        const tgt = tipo === 'tempo' ? zShare([3, 4]) : (share ? share() : null);
        if (tgt != null) zonaCumplida = tgt >= 0.6 ? 'si' : (tgt >= 0.35 ? 'parcial' : 'no');
      }
      let fatigueSignal = null;
      try {
        const h = buildFatigueHistory(act);
        fatigueSignal = calcFatigueIndex({ avgHR: act.avgHR, avgPaceSecPerMi: act.avgPaceSecPerMi }, h.history)?.signal || null;
      } catch (_) {}
      const rpe = parseFloat(mf.rpe);
      let ajuste = 'mantener';
      if (dolor === 'alto') ajuste = 'descansar';
      else if (rpe >= 9 || (cd && cd.driftPct > 8) || fatigueSignal === 'high_fatigue' || dolor === 'moderado') ajuste = 'bajar_leve';
      else if (zonaCumplida === 'no' && ['tempo', 'intervalos'].includes(tipo)) ajuste = 'repetir';
      else if (calidad === 'alta' && rpe <= 6 && (!cd || cd.driftPct <= 3) && !dolor.match(/leve|moderado|alto/)) ajuste = 'subir_leve';
      const hasEvalData = calidad || zonaCumplida || cd || !isNaN(rpe);
      const notas = [
        a.sessionGrade ? 'Grado ' + a.sessionGrade + (score != null ? ' (' + Math.round(score) + ')' : '') : '',
        cd ? 'deriva ' + cd.driftPct + '%' : '',
        zonaCumplida ? 'zona objetivo ' + zonaCumplida : ''
      ].filter(Boolean).join('; ');

      // ── datos principales ──
      const timeMin = act.totalTimeSec ? (act.totalTimeSec / 60).toFixed(2) : '';
      const paceStr = (!isBike && act.avgPaceSecPerMi > 0) ? fmtPaceNoUnit(act.avgPaceSecPerMi) : '';
      const vOk = !!a.vdot && vdotValidity({
        sport: isBike ? 'biking' : 'running', avgHR: act.avgHR, lthr,
        elevGainPerMi: a.elevGainPerMi || 0, totalTimeSec: act.totalTimeSec,
        sessionType: rawType || mf.trainingType || null
      }).valid;
      const tss = (act.totalDistMi != null && act.totalTimeSec && act.avgHR) ? estimateTSS(act.totalDistMi, act.totalTimeSec, act.avgHR, lthr).toFixed(1) : '';
      const sensaciones = [oneLine(mf.athleteNotes), (painRaw && dolor && dolor !== 'ninguno') ? 'Dolor: ' + painRaw : ''].filter(Boolean).join(' | ');

      const L = [];
      L.push('## Actividad', '');
      L.push('- fecha: ' + act.dateISO);
      L.push('- deporte: ' + (isBike ? 'biking' : 'running'));
      L.push('- tipo: ' + tipo);
      L.push('- objetivo_zona: ' + zonaObj);
      L.push('- terreno: ' + terreno);
      L.push('- clima:');
      L.push('  - temperatura_c: ' + fToC(tempF));
      L.push('  - humedad_pct: ' + num(mf.humidity));
      L.push('  - viento_kmh: ' + mphToKmh(mf.wind));
      L.push('  - sensacion_termica_c: ' + fToC(mf.feelsLike));
      L.push('', '## Estado_previo', '');
      L.push('- horas_sueno: ' + num(mf.sleepHours));
      L.push('- calidad_sueno_1_10: ' + num(mf.sleepQuality));
      L.push('- energia_1_10: ' + num(mf.energyLevel));
      L.push('- estres_1_10: ' + num(mf.stressLevel));
      L.push('- dolor_molestias: ' + dolor);
      L.push('- peso_lb: ' + num(mf.bodyWeight));
      L.push('- hr_v_ms: ' + num(mf.hrv));
      L.push('- rhr_bpm: ' + num(mf.restingHR));
      L.push('', '## Datos_principales', '');
      L.push('- distancia_mi: ' + num(act.totalDistMi, 2));
      L.push('- tiempo_min: ' + timeMin);
      L.push('- pace_medio_min_milla: ' + paceStr);
      L.push('- fc_media_bpm: ' + (act.avgHR ? Math.round(act.avgHR) : ''));
      L.push('- fc_max_bpm: ' + (act.maxHR ? Math.round(act.maxHR) : ''));
      L.push('- lthr_bpm: ' + lthr);
      L.push('- vdot: ' + (vOk ? a.vdot.toFixed(1) : ''));
      L.push('- tss: ' + tss);
      L.push('- cadencia_media_spm: ' + (act.avgCadSPM ? Math.round(act.avgCadSPM) : ''));
      L.push('- potencia_media_w: ' + (a.powerStats ? Math.round(a.powerStats.avgWatts) : ''));
      L.push('', '## Zonas', '');
      L.push('- configuracion_zonas:');
      L.push('  - metodo: LTHR');
      L.push('  - lthr_bpm: ' + lthr);
      L.push('  - fc_max_bpm: ' + num(state.profile?.maxHR || state.profile?.fcMax));
      L.push('  - rangos:');
      L.push('    - Z1: <' + f.z2);
      L.push('    - Z2: ' + f.z2 + '-' + (f.z3 - 1));
      L.push('    - Z3: ' + f.z3 + '-' + (f.z4 - 1));
      L.push('    - Z4: ' + f.z4 + '-' + lthr);
      L.push('    - Z5: >' + lthr);
      L.push('- tiempo_en_zonas:');
      [1, 2, 3, 4, 5].forEach(z => L.push('  - Z' + z + '_min: ' + zmin(z)));
      L.push('', '## Deriva_cardiaca', '');
      L.push('- fc_primera_mitad_bpm: ' + (cd ? cd.avgHRFirstHalf : ''));
      L.push('- fc_segunda_mitad_bpm: ' + (cd ? cd.avgHRSecondHalf : ''));
