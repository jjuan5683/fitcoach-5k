    // ═══════════════════════════════════════════════════════════════════════
    // TRAINING LOAD SECTION — CTL/ATL/TSB chart + manual session entry
    // ═══════════════════════════════════════════════════════════════════════

    function renderLoadChart(curve, width = 540, height = 140) {
      if (!curve.length) return '';
      const recent = curve.slice(-56); // last 8 weeks max for readability
      const maxCTL = Math.max(...recent.map(c => Math.max(c.ctl, c.atl)), 10);
      const padding = 8;
      const chartW = width - padding * 2;
      const chartH = height - padding * 2;
      const stepX = chartW / Math.max(recent.length - 1, 1);

      const toPoints = (key) => recent.map((c, i) => {
        const x = padding + i * stepX;
        const y = padding + chartH - (c[key] / maxCTL) * chartH;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const ctlPoints = toPoints('ctl');
      const atlPoints = toPoints('atl');

      // TSB as filled area around zero baseline (using a secondary scale)
      const tsbVals = recent.map(c => c.tsb);
      const maxAbsTSB = Math.max(...tsbVals.map(Math.abs), 10);
      const tsbZeroY = padding + chartH / 2;
      const tsbScale = (chartH / 2) / maxAbsTSB;
      const tsbPoints = recent.map((c, i) => {
        const x = padding + i * stepX;
        const y = tsbZeroY - c.tsb * tsbScale;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      return `

    // Shows every session currently in state.plan sorted by date, with a delete button on each,
    // plus a "wipe everything" option. Exists because repeated plan imports on different real-world
    // days each anchor to "this week's Monday" at import time — if you re-upload a plan on a
    // different calendar day than the first time, the new import can't find the old entries (they're
    // anchored to a different week) and creates fresh ones instead, leaving orphaned duplicates
    // behind. This is the cleanup tool for when that happens.
    let planManagerOpen = false;
    function togglePlanManager() { planManagerOpen = !planManagerOpen; render(); }

    function renderPlanManagementCard() {
      const sorted = [...state.plan].filter(s => s.dateISO).sort((a, b) => a.dateISO.localeCompare(b.dateISO));
      return `
        <div class="card" style="margin-bottom:12px; border:1px solid var(--field-line);">

            <span style="font-size:11px; color:var(--coyote);">${planManagerOpen ? '▲' : '▼'}</span>
          </div>
          ${planManagerOpen ? `
            <p style="font-size:11px; color:var(--paper-dim); margin: 8px 0;">
              ${getLang() === 'es' ? 'Si ves fechas duplicadas o entrenamientos que no reconoces, bórralos aquí.' : 'If you see duplicate dates or sessions you do not recognize, delete them here.'}

            <button class="btn btn-secondary" style="width:100%; font-size:11px; margin-bottom:8px; color:#c94a4a; border-color:#c94a4a;" onclick="handleClearAllPlan()">
              ${getLang() === 'es' ? '🗑️ BORRAR TODO EL PLAN' : '🗑️ CLEAR ENTIRE PLAN'}
            </button>
            <div style="max-height:280px; overflow-y:auto; border-top:1px solid var(--field-line);">
              ${sorted.map(s => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--field-line); font-size:11px;">
                  <div style="flex:1; min-width:0;">
                    <span style="color:var(--paper);">${s.dateISO}</span>
                    <span style="color:var(--coyote);"> — ${tr(SESSION_TITLES[s.type]) || s.type}</span>
                    ${s.dist && s.dist !== '—' ? `<span style="color:var(--paper-dim);"> (${s.dist})</span>` : ''}

            </div>
          ` : ''}
        </div>`;
    }

    function handleDeletePlanSession(dateISO) {
      state.plan = state.plan.filter(s => s.dateISO !== dateISO);
      saveState();
      render();
      showToast(getLang() === 'es' ? '✓ Sesión borrada' : '✓ Session deleted');
    }

    function handleClearAllPlan() {
      if (!confirm(getLang() === 'es' ? '¿Borrar TODAS las sesiones del plan? Esto no se puede deshacer.' : 'Delete ALL plan sessions? This cannot be undone.')) return;
      state.plan = [];
      saveState();
      render();
      showToast(getLang() === 'es' ? '✓ Plan borrado por completo' : '✓ Entire plan cleared');
    }

    // Reads a .txt/.md file (e.g. the plan Claude generated for the weekly update) and drops
    // its content into the paste textarea so the athlete can review before importing.
    function handleClaudePlanFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const textarea = document.getElementById('claudePlanInput');
        if (textarea) textarea.value = e.target.result;
        showToast(getLang() === 'es' ? '✓ Archivo cargado — revisa y presiona importar' : '✓ File loaded — review and press import');
      };
      reader.onerror = () => {
        showToast(getLang() === 'es' ? '✕ Error al leer el archivo' : '✕ Error reading file');
      };
      reader.readAsText(file);
      event.target.value = ''; // allow re-selecting the same file later
    }

    function handleClaudeImport() {
      const text = document.getElementById('claudePlanInput').value;
      if (!text.trim()) { 
        showToast(getLang() === 'es' ? 'Pega tu plan primero' : 'Paste your plan first'); 
        return; 
      }
      importClaudePlan(text);
      document.getElementById('claudePlanInput').value = '';
    }

    function renderCalendarView() {
      const today = todayISO();
      const todayDate = parseISODateLocal(today);

      // Get Monday of current week
      const day = todayDate.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      const monday = new Date(todayDate);
      monday.setDate(todayDate.getDate() + mondayOffset);

      // Build 7-day week array
      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const iso = d.toISOString().split('T')[0];
        const session = state.plan.find(s => s.dateISO === iso);
        const activity = session?.linkedActivityId ? state.tcxSessions.find(t => t.id === session.linkedActivityId) : null;
        const dayName = d.toLocaleDateString(getLang() === 'es' ? 'es-PR' : 'en-US', { weekday: 'short' });
        const dayNum = d.getDate();
        weekDays.push({ iso, session, activity, dayName, dayNum, isToday: iso === today });
      }

      const dayAbbrevs = getLang() === 'es'
        ? ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']
        : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      const TYPE_COLORS = {
        easy: 'var(--signal-blue)', tempo: 'var(--signal-amber)', intervals: 'var(--rust-bright)',
        long: 'var(--olive-bright)', race_sim: 'var(--rust)',
        rest: 'var(--field-line)', strides: 'var(--paper-dim)', mobility: 'var(--coyote-dim)'
      };

      return `
        <div class="view-container">

          ${renderTrainingLoadSection()}

          ${renderClaudeImportCard()}

          <div class="sitrep-label">${getLang() === 'es' ? 'SEMANA ACTUAL' : 'CURRENT WEEK'}</div>

          <!-- WEEK STRIP -->
          <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; margin-bottom:16px;">
            ${weekDays.map(d => {
              const color = d.session ? TYPE_COLORS[d.session.type] : 'var(--field-line)';
              const done = d.session?.completed;
              return `
              <div onclick="${d.session ? `openSessionDetail(${d.session.day})` : ''}" style="text-align:center; cursor:${d.session ? 'pointer' : 'default'};">
                <div style="font-family:var(--font-mono); font-size:9px; color:${d.isToday ? 'var(--coyote)' : 'var(--paper-dim)'}; letter-spacing:0.5px; margin-bottom:3px;">${d.dayName.toUpperCase()}</div>
                <div style="background:${d.isToday ? 'rgba(201,169,97,0.1)' : 'var(--field-dark)'}; border:1px solid ${d.isToday ? 'var(--coyote)' : 'var(--field-line)'}; border-bottom: 3px solid ${color}; padding:8px 4px;">
                  <div style="font-family:var(--font-display); font-size:18px; color:${d.isToday ? 'var(--coyote)' : 'var(--paper)'};">${d.dayNum}</div>
                  <div style="font-family:var(--font-mono); font-size:8px; color:${color}; letter-spacing:0.3px; margin-top:2px;">
                    ${d.session ? SESSION_TAGS[d.session.type] : '—'}
                  </div>
                  ${done ? '<div style="font-size:8px; color:var(--olive-bright);">✓</div>' : (d.activity ? '<div style="font-size:8px; color:var(--signal-blue);">↑</div>' : '<div style="height:10px;"></div>')}
                </div>
              </div>
            `}).join('')}
          </div>

          <!-- DAY DETAILS -->
          ${weekDays.map(d => {
            if (!d.session) return '';
            const strength = STRENGTH_SCHEDULE[d.session.type] || [];
            const isToday = d.isToday;
            return `
              <div style="margin-bottom:14px;">
                <div class="sitrep-label" style="${isToday ? 'color:var(--coyote);' : ''}">${d.dayName.toUpperCase()} ${d.dayNum}${isToday ? ` · ${getLang()==='es'?'HOY':'TODAY'}` : ''}</div>
                <div class="session-card ${d.session.completed ? 'completed' : ''}" onclick="openSessionDetail(${d.session.day})" style="margin-bottom:6px;">
                  <div class="session-header">
                    <div class="session-left">
                      <span class="session-tag">${SESSION_TAGS[d.session.type]}</span>
                      <div class="session-info">
                        <h3>${sessionTitle(d.session)}</h3>
                        <p>${d.session.paceGuide} · ${d.session.dist}</p>
                      </div>
                    </div>
                    ${d.session.completed ? `<div class="badge">${t('badge_done')}</div>` : ''}
                    ${d.activity ? `<div class="badge day">TCX ✓</div>` : ''}
                  </div>
                </div>
                ${strength.length > 0 ? `
                  <div style="background:var(--field-surface); border:1px solid var(--field-line); border-left:3px solid var(--coyote-dim); padding:10px 12px;">
                    <div style="font-family:var(--font-mono); font-size:9px; color:var(--coyote-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;">
                      💪 ${getLang()==='es'?'FUERZA COMPLEMENTARIA':'STRENGTH COMPLEMENT'}
                    </div>
                    ${strength.map(cat => {
                      const s = STRENGTH_LIBRARY[cat];
                      const catName = tr(s.name);
                      const ex = s.exercises.slice(0,2).map(e => `${e.name} ${e.sets}`).join(' · ');
                      return `<div style="font-size:11px; color:var(--paper); margin-bottom:2px;"><strong>${catName}:</strong> ${ex}</div>`;
                    }).join('')}

              </div>

          }).join('')}

          <div class="card" style="cursor:pointer; text-align:center;" onclick="switchView('strength')">
            <div style="font-size:13px; color:var(--coyote); font-weight:600;">💪 ${getLang()==='es'?'Ver Biblioteca de Fuerza completa':'View full Strength Library'}</div>
            <p style="font-size:10px; color:var(--paper-dim); margin-top:4px;">${getLang()==='es'?'Todos los ejercicios por categoría, con recomendación del día':'All exercises by category, with the days recommendation'}</p>

    // ═══════════════════════════════════════════════════════════════════════════
    // STATS VIEW — Charts · Injuries · Reports · Context

    let statsInjurySeverity = 'leve'; // currently selected severity in the injury form

    function renderStatsView() {

      _scrollToTopNextRender = true;
      render();

    // ── CHARTS SECTION ──────────────────────────────────────────────────────
    function renderStatsCharts() {
      const sorted = [...state.tcxSessions].sort((a,b) => a.dateISO.localeCompare(b.dateISO));
      if (sorted.length === 0) {
        return `<div style="text-align:center; padding:40px; color:var(--paper-dim);">
          📊 ${t('stats_no_data')}<br/>
          <span style="font-size:12px;">Sube sesiones TCX para ver gráficas</span>
        </div>`;
      }

      const paceData = sorted.filter(t => t.avgPaceSecPerMi > 0).slice(-15);
      const hrData = sorted.filter(t => t.avgHR > 0).slice(-15);
      const vdotData = sorted.filter(t => t.analysis?.vdot).slice(-10);
      const lang = getLang();

      // ── Dynamic insight helpers: compare first half vs second half of the window ──
      const insight = (arr, getVal, opts) => {
        // opts: { lowerIsBetter, unit, name }
        if (arr.length < 3) return `<p style="font-size:11px; color:var(--paper-dim); margin-top:8px;">${lang==='es'?'Registra al menos 3 sesiones para ver tendencias.':'Log at least 3 sessions to see trends.'}</p>`;
        const half = Math.floor(arr.length / 2);
        const firstAvg = arr.slice(0, half).reduce((s,x)=>s+getVal(x),0) / half;
        const lastArr = arr.slice(half);
        const lastAvg = lastArr.reduce((s,x)=>s+getVal(x),0) / lastArr.length;
        const delta = lastAvg - firstAvg;
        const pctChange = firstAvg ? (delta / firstAvg) * 100 : 0;
        const improved = opts.lowerIsBetter ? delta < 0 : delta > 0;
        const meaningful = Math.abs(pctChange) >= 1.5;
        let color, icon, verb;
        if (!meaningful) { color='var(--paper-dim)'; icon='→'; verb = lang==='es'?'estable':'stable'; }
        else if (improved) { color='var(--signal-blue)'; icon='▲'; verb = lang==='es'?'mejorando':'improving'; }
        else { color='var(--signal-amber)'; icon='▼'; verb = lang==='es'?'retrocediendo':'declining'; }
        const fmt = opts.fmt || (v => v.toFixed(0));
        return `<div style="border-left:3px solid ${color}; padding-left:10px; margin-top:10px;">
          <p style="font-size:11px; color:${color}; font-weight:600;">${icon} ${opts.name}: ${verb} (${pctChange>0?'+':''}${pctChange.toFixed(1)}%)</p>
          <p style="font-size:10px; color:var(--paper-dim); margin-top:2px;">
            ${lang==='es'?'Primeras':'First'} ${fmt(firstAvg)} → ${lang==='es'?'últimas':'latest'} ${fmt(lastAvg)}${opts.unit||''}.
            ${meaningful ? (improved ? opts.goodMsg : opts.badMsg) : (lang==='es'?'Sin cambio significativo — mantén la consistencia.':'No significant change — keep consistency.')}
          </p>
        </div>`;
      };

      const paceInsight = insight(paceData, x=>x.avgPaceSecPerMi, {
        lowerIsBetter:true, name: lang==='es'?'Pace':'Pace', unit:'/mi',
        fmt: v=>secToMMSS(v),
        goodMsg: lang==='es'?'Tu ritmo promedio está bajando — señal de mejor forma. Mantén el volumen fácil.':'Your average pace is dropping — a sign of improving fitness. Keep the easy volume.',
        badMsg: lang==='es'?'Tu ritmo promedio está subiendo. Puede ser fatiga acumulada o calor — revisa descanso e hidratación.':'Your average pace is creeping up. Could be accumulated fatigue or heat — check rest and hydration.'
      });
      const hrInsight = insight(hrData, x=>x.avgHR, {
        lowerIsBetter:true, name:'HR', unit:' bpm',
        goodMsg: lang==='es'?'FC promedio bajando a paces similares = mejor eficiencia aeróbica. Excelente.':'Average HR dropping at similar paces = better aerobic efficiency. Excellent.',
        badMsg: lang==='es'?'FC promedio subiendo. Si el pace no bajó, vigila fatiga, calor o falta de sueño.':'Average HR rising. If pace did not drop, watch for fatigue, heat, or poor sleep.'
      });
      const vdotInsight = insight(vdotData, x=>x.analysis.vdot, {
        lowerIsBetter:false, name:'VDOT',
        goodMsg: lang==='es'?'VDOT subiendo = tu motor aeróbico crece. Tu 5K proyectado mejora.':'VDOT rising = your aerobic engine is growing. Your projected 5K improves.',
        badMsg: lang==='es'?'VDOT bajando. Revisa si las sesiones de calidad (tempo/intervalos) están siendo consistentes.':'VDOT dropping. Check whether quality sessions (tempo/intervals) have been consistent.'
      });

      return `
        <div style="space-y:3;">
          ${paceData.length >= 2 ? `
            <div class="card" style="margin-bottom:16px;">

          ${vdotData.length >= 2 ? `

          ${renderStatsSummaryCard()}

    // Weekly volume + consistency summary with dynamic verdict
    function renderStatsSummaryCard() {
      const lang = getLang();
      const now = new Date();
      const wkAgo = new Date(now); wkAgo.setDate(now.getDate()-7);
      const twoWkAgo = new Date(now); twoWkAgo.setDate(now.getDate()-14);
      const iso = d => d.toISOString().split('T')[0];
      const thisWk = state.tcxSessions.filter(s => s.dateISO >= iso(wkAgo));
      const lastWk = state.tcxSessions.filter(s => s.dateISO >= iso(twoWkAgo) && s.dateISO < iso(wkAgo));
      const miThis = thisWk.reduce((s,x)=>s+(x.totalDistMi||0),0);
      const miLast = lastWk.reduce((s,x)=>s+(x.totalDistMi||0),0);
      const deltaMi = miThis - miLast;
      const jump = miLast > 0 ? (deltaMi/miLast)*100 : 0;

      let verdict, vColor;
      if (miThis === 0) { verdict = lang==='es'?'Sin sesiones esta semana. Retoma con una carrera fácil.':'No sessions this week. Ease back in with an easy run.'; vColor='var(--signal-amber)'; }
      else if (jump > 10 && miLast > 0) { verdict = lang==='es'?`Subiste ${jump.toFixed(0)}% de volumen — cuida la regla del 10% para evitar lesión.`:`You jumped ${jump.toFixed(0)}% in volume — mind the 10% rule to avoid injury.`; vColor='var(--signal-amber)'; }
      else if (deltaMi >= 0) { verdict = lang==='es'?'Volumen estable o creciendo de forma segura. Buen trabajo.':'Volume stable or growing safely. Good work.'; vColor='var(--signal-blue)'; }
      else { verdict = lang==='es'?'Volumen bajó vs. semana pasada — normal en semana de descarga o si hubo descanso.':'Volume dropped vs last week — normal on a deload or rest week.'; vColor='var(--paper-dim)'; }

      return `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-title">${lang==='es'?'RESUMEN SEMANAL':'WEEKLY SUMMARY'}</div>
          <div class="stat-grid">
            <div class="stat-box"><div class="value">${miThis.toFixed(1)}</div><div class="label">${lang==='es'?'mi esta sem':'mi this wk'}</div></div>
            <div class="stat-box"><div class="value">${miLast.toFixed(1)}</div><div class="label">${lang==='es'?'mi sem pasada':'mi last wk'}</div></div>
            <div class="stat-box"><div class="value" style="color:${deltaMi>=0?'var(--signal-blue)':'var(--paper-dim)'};">${deltaMi>=0?'+':''}${deltaMi.toFixed(1)}</div><div class="label">Δ mi</div></div>
          </div>
          <p style="font-size:11px; color:${vColor}; margin-top:10px; line-height:1.4;">${verdict}</p>
        </div>`;
    }

    // Chart.js instances — tracked so we can destroy before re-creating (avoids memory leaks / duplicate canvases)
    let _paceChartInstance = null;
    let _hrChartInstance = null;
    let _vdotChartInstance = null;
    let _weightChartInstance = null;
    let _bodyCircChartInstance = null;

    // Weight-toward-goal chart, drawn in the Body Measurements card (MORE tab).
    function initWeightChart() {
      if (typeof Chart === 'undefined') return;
      const canvas = document.getElementById('weightChart');
      if (!canvas) return;
      const data = [...state.bodyMeasurements]
        .filter(m => m.weightLb > 0)
        .sort((a,b) => (a.dateISO||'').localeCompare(b.dateISO||''));
      if (_weightChartInstance) { _weightChartInstance.destroy(); _weightChartInstance = null; }
      if (data.length < 2) return;
      const goal = state.profile?.goalWeightLb;
      const labels = data.map(m => m.dateISO.slice(5));
      const weights = data.map(m => m.weightLb);
      const datasets = [{
        label: getLang()==='es'?'Peso (lb)':'Weight (lb)',
        data: weights, borderColor: '#c9a961', backgroundColor: 'rgba(201,169,97,0.12)',
        tension: 0.3, fill: true, pointRadius: 3
      }];
      if (goal) {
        datasets.push({
          label: getLang()==='es'?'Meta':'Goal',
          data: labels.map(() => goal), borderColor: '#5a8530', borderDash: [6,4],
          pointRadius: 0, fill: false
        });
      }
      _weightChartInstance = new Chart(canvas, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#9a9888', font: { size: 10 } } } },
          scales: {
            y: { ticks: { color: '#9a9888', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
            x: { ticks: { color: '#9a9888', font: { size: 9 } }, grid: { display: false } }
          }
        }
      });
    }

    // Circumference progress chart — one line per BODY_MEASURE_DEFS entry the user has toggled
    // visible, drawn in the Body Measurements card. Separate from weightChart since lb and
    // in/cm are different scales and weight already has its own goal-line chart.
    function initBodyCircChart() {

    // Called after DOM update when Stats > Charts tab is active. innerHTML does not execute

    function initStatsCharts() {

      const sorted = [...state.tcxSessions].sort((a,b) => a.dateISO.localeCompare(b.dateISO));

      // Destroy previous instances to prevent Chart.js "Canvas already in use" errors

      if (_vdotChartInstance) { _vdotChartInstance.destroy(); _vdotChartInstance = null; }

              x: { grid: { display: false } }

      const hrCanvas = document.getElementById('hrChart');
      if (hrCanvas && hrData.length >= 2) {
        _hrChartInstance = new Chart(hrCanvas, {
          type: 'line',
          data: {
            labels: hrData.map(t => t.dateISO.slice(5)),
            datasets: [
              { label: 'Avg HR', data: hrData.map(t => t.avgHR), borderColor: COLOR_COYOTE, tension: 0.3, borderWidth: 2, pointRadius: 2 },
              { label: 'Max HR', data: hrData.map(t => t.maxHR), borderColor: COLOR_RUST, tension: 0.3, borderWidth: 1, borderDash: [5,5], pointRadius: 2 }

            ]
          },

            plugins: { legend: { display: true, position: 'bottom' } },

              y: { position: 'left', grid: { color: 'rgba(255,255,255,0.05)' } },
              y1: { position: 'right', grid: { display: false } },

      const bp = document.getElementById('injuryBodyPart')?.value || 'otro';
      const desc = document.getElementById('injuryDesc')?.value || '';
      if (!bp) return;
      state.injuries.push({
        id: 'inj_' + Date.now(),

        severity: statsInjurySeverity,
        description: desc,
        resolved: false
      });
      saveState();
      statsShowInjuryForm = false;
      statsInjurySeverity = 'leve';
      render();

      const inj = state.injuries.find(i => i.id === id);

              </button>

                All
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function exportCSV(period) {
      const today = todayISO();
      let sessions = state.tcxSessions.sort((a,b) => a.dateISO.localeCompare(b.dateISO));
      
      if (period === 'week') {
        const cut = new Date(); cut.setDate(cut.getDate() - 7);
        sessions = sessions.filter(s => s.dateISO >= cut.toISOString().split('T')[0]);
      } else if (period === 'month') {
        const cut = new Date(); cut.setDate(cut.getDate() - 30);
        sessions = sessions.filter(s => s.dateISO >= cut.toISOString().split('T')[0]);
      }

      const headers = ['Date','Distance(mi)','Time','Pace(/mi)','HR Avg','HR Max','VDOT','Pred 5K','Decoupling(%)','Grade','TSS'];
      const rows = sessions.map(s => [
        s.dateISO,
        s.totalDistMi.toFixed(2),
        secToHHMMSS(s.totalTimeSec),
        secToMMSS(s.avgPaceSecPerMi),
        s.avgHR,
        s.maxHR,
        s.analysis?.vdot || '--',
        s.analysis?.predicted5KSec ? secToMMSS(s.analysis.predicted5KSec) : '--',
        s.analysis?.aerobicDecouplingPct != null ? s.analysis.aerobicDecouplingPct.toFixed(1) : '--',
        s.analysis?.sessionGrade || '--',
        estimateTSS(s.totalDistMi, s.totalTimeSec, s.avgHR, state.profile?.lthr || 174).toFixed(1)
      ]);

      const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], {type: 'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'FitCoach_TCX_' + period + '_' + today + '.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('✓ CSV Exported');
    }

                  <span style="font-size:10px; color:var(--paper-dim);">~${Math.round(weeklyPromptBlock.length / 4)} tokens</span>
                  <div style="display:flex; gap:6px;">
                    <button onclick="copyWeeklyPrompt()" style="padding:4px 10px; font-size:10px; border:1px solid var(--coyote); border-radius:4px; background:rgba(201,169,97,0.15); color:var(--coyote); cursor:pointer; font-weight:600;">${getLang()==='es'?'Copiar':'Copy'}</button>
                    <button onclick="downloadWeeklyPrompt()" style="padding:4px 10px; font-size:10px; border:1px solid var(--field-line); border-radius:4px; background:var(--field-surface); color:var(--paper-dim); cursor:pointer;">↓ .md</button>

              </div>
              <p style="font-size:10px; color:var(--paper-dim); margin-bottom:16px; line-height:1.4;">
                ${getLang()==='es'
                  ? 'Pega la respuesta del plan actualizado en "Importar Plan de Claude" (pestaña Calendario) para cargarlo directo en la app.'
                  : 'Paste the updated plan response into "Import Claude Plan" (Calendar tab) to load it straight into the app.'}
              </p>
            ` : ''}
          </div>

          <div class="card" style="margin-bottom:16px;">
            <div class="card-title">🤖 Context Block</div>
            <p style="font-size:11px; color:var(--paper-dim); margin-bottom:12px;">Export your state for Claude/ChatGPT</p>
            
            <button onclick="generateContextBlock()" style="width:100%; padding:12px; font-size:11px; border:none; border-radius:6px; background:var(--olive); color:var(--black-olive); cursor:pointer; font-weight:600; margin-bottom:12px;">
              Generate Context Block
            </button>

            ${hasContext ? `
              <div style="border:1px solid var(--field-line); border-radius:6px; padding:10px; background:var(--field-dark); margin-bottom:12px;">

                  <span style="font-size:10px; color:var(--paper-dim);">~${tokenCount} tokens</span>
                  <div style="display:flex; gap:6px;">

                    <button onclick="downloadContextBlock()" style="padding:4px 10px; font-size:10px; border:1px solid var(--field-line); border-radius:4px; background:var(--field-surface); color:var(--paper-dim); cursor:pointer;">↓ .md</button>

              </div>

    }

    // ── Weekly Update Prompt generator ──
    // Builds a self-contained prompt: last 7 days of activities, auto-derived wins/improvements,
    // and an explicit instruction to return next week's plan in a format compatible with
    // "Import Claude Plan" (parseClaudePlan expects lines like "Monday: Easy Run 5 miles").
    function generateWeeklyPrompt() {
      const lang = getLang();
      const today = todayISO();
      const cutDate = new Date(); cutDate.setDate(cutDate.getDate() - 7);
      const cutISO = cutDate.toISOString().split('T')[0];

      const weekActivities = [...state.tcxSessions]
        .filter(s => s.dateISO >= cutISO && s.dateISO <= today)
        .sort((a,b) => a.dateISO.localeCompare(b.dateISO));

      const weekPlanned = state.plan.filter(s => s.dateISO >= cutISO && s.dateISO <= today && s.type !== 'rest');
      const weekCompleted = weekPlanned.filter(s => s.completed);

      const totalMi = weekActivities.reduce((sum, s) => sum + (s.totalDistMi || 0), 0);
      const totalSec = weekActivities.reduce((sum, s) => sum + (s.totalTimeSec || 0), 0);
      const avgPaceSec = weekActivities.length ? weekActivities.reduce((sum, s) => sum + (s.avgPaceSecPerMi || 0), 0) / weekActivities.length : 0;

      // Heuristic wins / improvements from grade, decoupling, and pace-target adherence
      const wentWell = [];
      const toImprove = [];
      weekActivities.forEach(s => {
        const grade = s.analysis?.sessionGrade;
        const decoupling = s.analysis?.aerobicDecouplingPct;
        const label = `${s.dateISO} (${s.manualFields?.trainingType || 'sin tipo'}, ${s.totalDistMi?.toFixed(1)}mi)`;
        if (grade && ['A','A-','B+','B'].includes(grade)) wentWell.push(`${label}: grade ${grade}`);
        if (grade && ['D','D-','F'].includes(grade)) toImprove.push(`${label}: grade ${grade}`);
        if (decoupling != null && decoupling > 8) toImprove.push(`${label}: aerobic decoupling ${decoupling.toFixed(1)}% (alto)`);
        if (decoupling != null && decoupling <= 5) wentWell.push(`${label}: decoupling ${decoupling.toFixed(1)}% (bueno)`);
      });
      const missedSessions = weekPlanned.filter(s => !s.completed);

      const daysLeft = daysUntil(state.profile?.raceDateISO);

      let p = '';
      p += `# FitCoach — ${lang==='es' ? 'Actualización Semanal' : 'Weekly Update'}\n`;
      p += `${lang==='es' ? 'Semana' : 'Week'}: ${cutISO} → ${today} | ${lang==='es' ? 'Días para la carrera' : 'Days to race'}: ${daysLeft}\n\n`;

      p += `## ${lang==='es' ? 'Resumen de la semana' : 'Week summary'}\n`;
      p += `- ${lang==='es' ? 'Sesiones planeadas' : 'Planned sessions'}: ${weekPlanned.length} | ${lang==='es' ? 'completadas' : 'completed'}: ${weekCompleted.length}\n`;
      p += `- ${lang==='es' ? 'Actividades TCX registradas' : 'TCX activities logged'}: ${weekActivities.length}\n`;
      p += `- ${lang==='es' ? 'Distancia total' : 'Total distance'}: ${totalMi.toFixed(1)} mi | ${lang==='es' ? 'Tiempo total' : 'Total time'}: ${secToHHMMSS(totalSec)}\n`;
      p += `- ${lang==='es' ? 'Pace promedio' : 'Average pace'}: ${avgPaceSec ? secToMMSS(avgPaceSec) + '/mi' : 'N/D'}\n\n`;

      p += `## ${lang==='es' ? 'Historial de actividades' : 'Activity history'}\n`;
      if (weekActivities.length) {
        weekActivities.forEach(s => {
          const a = s.analysis || {};
          p += `- ${s.dateISO} | ${s.manualFields?.trainingType || (lang==='es'?'sin tipo':'untyped')} | ${s.totalDistMi?.toFixed(2)}mi | ${secToHHMMSS(s.totalTimeSec)} | ${secToMMSS(s.avgPaceSecPerMi)}/mi | HR ${s.avgHR} | ${lang==='es'?'grado':'grade'} ${a.sessionGrade || '--'}`;
          if (a.aerobicDecouplingPct != null) p += ` | decoupling ${a.aerobicDecouplingPct.toFixed(1)}%`;
          if (s.manualFields?.rpe) p += ` | RPE ${s.manualFields.rpe}/10`;
          p += '\n';
        });
      } else {
        p += `${lang==='es' ? 'Sin actividades registradas esta semana.' : 'No activities logged this week.'}\n`;
      }
      p += '\n';

      p += `## ${lang==='es' ? 'Dónde hice buen trabajo' : 'Where I did well'}\n`;
      p += (wentWell.length ? wentWell.map(w => `- ${w}`).join('\n') : `- ${lang==='es' ? '(sin datos suficientes — evalúa tú con lo anterior)' : '(not enough data — assess from the above)'}`) + '\n\n';

      p += `## ${lang==='es' ? 'Dónde puedo mejorar' : 'Where I can improve'}\n`;
      p += (toImprove.length ? toImprove.map(w => `- ${w}`).join('\n') : `- ${lang==='es' ? '(sin banderas rojas detectadas)' : '(no red flags detected)'}`) + '\n';
      if (missedSessions.length) {
        p += missedSessions.map(s => `- ${lang==='es'?'Sesión no completada':'Missed session'}: Day ${s.day} (${s.dateISO}) — ${SESSION_TYPE_LABELS[s.type] || s.type}`).join('\n') + '\n';
      }
      p += '\n';

      p += `## ${lang==='es' ? 'Qué debo mantener' : 'What to maintain'}\n`;
      p += `- ${lang==='es' ? 'Estructura semanal actual: intervalos, fácil, tempo progresivo, fácil+strides, larga.' : 'Current weekly structure: intervals, easy, progressive tempo, easy+strides, long run.'}\n`;
      p += `- ${lang==='es' ? 'LTHR de referencia' : 'Reference LTHR'}: ${state.profile?.lthr || 174} bpm.\n\n`;

      p += `## ${lang==='es' ? 'Instrucciones' : 'Instructions'}\n`;
      p += lang==='es'
        ? `Eres mi entrenador de 5K táctico. Con base en lo anterior, evalúa mi semana y genera el plan de la PRÓXIMA semana (7 días). Indica para cada día: tipo de sesión (fácil, tempo, intervalos, larga, descanso, cruzado), distancia o duración, y pace/HR objetivo. Devuélvelo en formato simple compatible con esta app, una línea por día, por ejemplo:\nLunes: Intervalos 4x800m\nMartes: Fácil 3 miles\nMiércoles: Tempo progresivo 25 min\nJueves: Fácil + Strides 3 miles\nViernes: Descanso\nSábado: Larga 5 miles\nDomingo: Descanso\nAjusta el volumen/intensidad según lo que mejoró o empeoró esta semana. Meta: 5K sub-30:00 el 16 AGO 2026 en botas y uniforme OCP.`
        : `You are my tactical 5K coach. Based on the above, evaluate my week and generate NEXT week's plan (7 days). For each day, specify: session type (easy, tempo, intervals, long, rest, cross), distance or duration, and target pace/HR. Return it in a simple format compatible with this app, one line per day, e.g.:\nMonday: Intervals 4x800m\nTuesday: Easy 3 miles\nWednesday: Progressive tempo 25 min\nThursday: Easy + Strides 3 miles\nFriday: Rest\nSaturday: Long run 5 miles\nSunday: Rest\nAdjust volume/intensity based on what improved or worsened this week. Goal: sub-30:00 5K on 16 AUG 2026 in boots and OCP uniform.`;

      weeklyPromptBlock = p;
      render();
    }

    function copyWeeklyPrompt() {
      navigator.clipboard.writeText(weeklyPromptBlock).then(() => {
        showToast(getLang()==='es' ? '✓ Copiado' : '✓ Copied to clipboard');
      });
    }

    function downloadWeeklyPrompt() {
      const blob = new Blob([weeklyPromptBlock], {type: 'text/markdown'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fitcoach_weekly_prompt_' + todayISO() + '.md';
      a.click();
      URL.revokeObjectURL(url);
    }

    function generateContextBlock() {
      const today = todayISO();
      const daysLeft = Math.max(0, Math.round((new Date(state.profile?.raceDateISO || '2026-08-16').getTime() - new Date().getTime()) / 86400000));
      const completed = state.plan.filter(s => s.completed).length;
      const total = state.plan.filter(s => !s.isRest).length;
      
      const recentTCX = [...state.tcxSessions].sort((a,b) => b.dateISO.localeCompare(a.dateISO)).slice(0,5);
      
      let block = '# FitCoach Context Block\n';
      block += 'Generated: ' + today + ' | Race: ' + (state.profile?.raceDateISO || '2026-08-16') + ' | Days Left: ' + daysLeft + '\n\n';
      block += '## Profile\n';
      block += (state.profile?.name || 'Athlete') + ' | ' + (state.profile?.age || '?') + 'y | ' + (state.profile?.weightLb || '?') + 'lb | Goal: sub-30min 5K | LTHR: ' + (state.profile?.lthr || 174) + 'bpm\n\n';
      block += '## Progress\n';
      block += completed + '/' + total + ' sessions (' + (total > 0 ? Math.round(completed/total*100) : 0) + '%) | Days Left: ' + daysLeft + '\n\n';
      
      if (recentTCX.length > 0) {
        block += '## Recent TCX Sessions (last ' + recentTCX.length + ')\n';
        for (const t of recentTCX) {
          block += t.dateISO + ' | ' + t.totalDistMi.toFixed(2) + 'mi | ' + secToHHMMSS(t.totalTimeSec) + ' | ' + secToMMSS(t.avgPaceSecPerMi) + '/mi | HR' + t.avgHR;
          if (t.analysis) block += ' | VDOT' + (t.analysis.vdot || '--') + ' | Decoupling' + (t.analysis.aerobicDecouplingPct != null ? t.analysis.aerobicDecouplingPct.toFixed(1) : '--') + '%';
          block += '\n';
        }
        block += '\n';
      }

      statsContextBlock = block;
      render();
    }

    function copyContextBlock() {
      navigator.clipboard.writeText(statsContextBlock).then(() => {
        showToast('✓ Copied to clipboard');
      });
    }

    function downloadContextBlock() {
      const blob = new Blob([statsContextBlock], {type: 'text/markdown'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fitcoach_context_' + todayISO() + '.md';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PROFILE VIEW — full editable athlete profile (all onboarding data)
    // ═══════════════════════════════════════════════════════════════════════
    function renderProfileView() {
      const lang = getLang();
      if (!state.profile) {
        return `<div class="view-container"><div class="card"><p style="color:var(--paper-dim);">${lang==='es'?'Completa el onboarding primero.':'Complete onboarding first.'}</p></div></div>`;
      }
      const p = state.profile;
      const cur5k = secToMMSS(p.currentFiveKSec || 1980);
      const goal5k = secToMMSS(p.goalFiveKSec || 1800);
      const L = (es,en) => lang==='es'?es:en;

      const field = (key, label, value, opts={}) => `
        <div class="manual-field-row">
          <label>${label}</label>
          <input type="${opts.type||'number'}" id="prof-${key}" value="${value ?? ''}"
            ${opts.step?`step="${opts.step}"`:''} ${opts.min!=null?`min="${opts.min}"`:''} ${opts.max!=null?`max="${opts.max}"`:''}
            placeholder="${opts.ph||''}" onblur="saveProfileField('${key}', this.value, '${opts.type||'number'}')" style="max-width:150px;" />
        </div>`;

      const selectField = (key, label, value, options) => `
        <div class="manual-field-row">
          <label>${label}</label>
          <select id="prof-${key}" onchange="saveProfileField('${key}', this.value, 'text')" style="text-align:right; max-width:170px;">
            ${options.map(o => `<option value="${o.val}" ${value===o.val?'selected':''}>${o.label}</option>`).join('')}
          </select>
        </div>`;

      return `
        <div class="view-container">
          <div class="sitrep-label">${L('PERFIL DEL ATLETA','ATHLETE PROFILE')}</div>

          <div class="card">
            <div class="card-title">${L('IDENTIDAD Y FÍSICO','IDENTITY & PHYSICAL')}</div>
            ${field('name', L('Nombre / indicativo','Name / callsign'), p.name, {type:'text', ph:'SSG Smith'})}
            ${field('age', L('Edad','Age'), p.age, {min:18, max:70})}
            ${field('heightIn', L('Estatura (pulgadas)','Height (inches)'), p.heightIn, {step:0.5, min:48, max:84, ph:'70'})}
            ${field('weightLb', L('Peso actual (lb)','Current weight (lb)'), p.weightLb, {min:100, max:350})}
            ${field('goalWeightLb', L('Peso meta (lb)','Target weight (lb)'), p.goalWeightLb, {min:100, max:350})}
            ${selectField('gender', L('Género','Gender'), p.gender, [
              {val:'', label:L('— elige —','— select —')},
              {val:'Male', label:L('Masculino','Male')},
              {val:'Female', label:L('Femenino','Female')}
            ])}
            <p style="font-size:10px; color:var(--paper-dim); margin-top:8px; line-height:1.4;">
              ${L('Estos datos calibran las paces objetivo, zonas de FC y penalización por calor/botas. Edita cualquier campo y se guarda automáticamente.','These calibrate target paces, HR zones, and heat/boot penalties. Edit any field and it saves automatically.')}
            </p>
          </div>

          <div class="card">
            <div class="card-title">${L('EXPERIENCIA DE CORREDOR','RUNNING EXPERIENCE')}</div>
            ${field('runningYears', L('Años corriendo','Years running'), p.runningYears, {min:0, max:50})}
            ${field('longestRunMi', L('Carrera más larga (mi)','Longest run (mi)'), p.longestRunMi, {step:0.1, min:1, max:100})}
            ${selectField('runningStyle', L('Estilo natural','Natural style'), p.runningStyle, [
              {val:'', label:L('— elige —','— select —')},
              {val:'Speed', label:L('Velocidad (400m–1K)','Speed (400m–1K)')},
              {val:'Distance', label:L('Distancia (10K+)','Distance (10K+)')},
              {val:'Balanced', label:L('Equilibrado','Balanced')}
            ])}
            <div class="manual-field-row">
              <label>${L('Mejor 5K actual','Current best 5K')}</label>
              <input type="text" id="prof-cur5k" value="${cur5k}" placeholder="33:00" onblur="saveProfile5K('current', this.value)" style="max-width:100px; text-align:right;" />
            </div>
          </div>

          <div class="card">
            <div class="card-title">${L('DISPONIBILIDAD','AVAILABILITY')}</div>
            ${selectField('daysPerWeek', L('Días / semana','Days / week'), p.daysPerWeek, [
              {val:'', label:L('— elige —','— select —')},
              {val:'4 days', label:L('4 días','4 days')},
              {val:'5 days', label:L('5 días','5 days')},
              {val:'6 days', label:L('6 días','6 days')},
              {val:'Flexible', label:'Flexible'}
            ])}
            ${selectField('sessionMinutes', L('Minutos / sesión','Minutes / session'), p.sessionMinutes, [
              {val:'', label:L('— elige —','— select —')},
              {val:'30-40', label:'30-40'},
              {val:'40-60', label:'40-60'},
              {val:'60-90', label:'60-90'},
              {val:'90+', label:'90+'}
            ])}
            <label class="checkbox-item" style="margin-top:8px;">
              <input type="checkbox" id="prof-hasGym" ${p.hasGym?'checked':''} onchange="saveProfileField('hasGym', this.checked, 'bool')" />
              <span style="font-size:13px;">${L('Acceso a gimnasio','Gym access')}</span>
            </label>
          </div>

          <div class="card">
            <div class="card-title">${L('TERRENO Y MISIÓN','TERRAIN & MISSION')}</div>
            ${field('unit', L('Unidad','Unit'), p.unit, {type:'text', ph:'1-1 IN BN'})}
            ${selectField('terrain', L('Terreno principal','Primary terrain'), p.terrain, [

            <div class="form-group" style="margin-top:8px;">

          <div class="card">
            <div class="card-title">${L('PARÁMETROS FISIOLÓGICOS','PHYSIOLOGICAL PARAMETERS')}</div>
            ${field('lthr', 'LTHR (bpm)', p.lthr, {min:120, max:200})}
            ${selectField('sleepAvg', L('Sueño promedio','Average sleep'), p.sleepAvg, [
              {val:'', label:L('— elige —','— select —')},
              {val:'< 6h', label:'< 6h'},
              {val:'6-7h', label:'6-7h'},
              {val:'7-8h', label:'7-8h'},
              {val:'8+ h', label:'8+ h'}
            ])}
            ${selectField('stressLevel', L('Nivel de estrés','Stress level'), p.stressLevel, [
              {val:'', label:L('— elige —','— select —')},
              {val:'Low', label:L('Bajo','Low')},
              {val:'Moderate', label:L('Moderado','Moderate')},
              {val:'High', label:L('Alto','High')},
              {val:'Very high', label:L('Muy alto','Very high')}
            ])}
            <p style="font-size:10px; color:var(--paper-dim); margin-top:8px; line-height:1.4;">
              ${L('El LTHR define tus zonas de FC. Si tu Garmin lo reinició, verifica que coincida con tu prueba de umbral más reciente.','LTHR defines your HR zones. If your Garmin reset it, verify it matches your most recent threshold test.')}
            </p>
          </div>

          <div class="card">
            <div class="card-title">${L('CONFIGURACIÓN DE CARRERA','RACE CONFIGURATION')}</div>

            </div>
            ${field('taperDays', L('Días de taper','Taper days'), p.taperDays ?? 10, {min:5, max:21, ph:'10'})}

            <p style="font-size:10px; color:var(--paper-dim); margin-top:8px; line-height:1.4;">

            </p>
          </div>

          <button class="btn btn-secondary" style="width:100%;" onclick="switchView('home')">${L('← Volver','← Back')}</button>
        </div>`;
    }

    // (Strength library, daily recommendation card, and tab view are built further down,
    // reusing the canonical STRENGTH_LIBRARY / STRENGTH_SCHEDULE defined near the calendar view.)

    function saveProfileField(key, value, type) {
      if (!state.profile) return;
      let v = value;
      if (type === 'number') v = value === '' ? null : parseFloat(value);
      if (type === 'bool') v = !!value;
      state.profile[key] = v;
      saveState();
      showToast(t('toast_saved'));
    }

    function saveProfile5K(which, mmss) {
      if (!state.profile) return;
      const parts = String(mmss).split(':');
      if (parts.length !== 2) { showToast(getLang()==='es'?'Formato MM:SS':'Format MM:SS'); return; }
      const sec = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      if (isNaN(sec) || sec <= 0) { showToast(getLang()==='es'?'Valor inválido':'Invalid value'); return; }
      if (which === 'current') state.profile.currentFiveKSec = sec;
      else state.profile.goalFiveKSec = sec;
      saveState();
      render(); // pace reference table depends on current 5K — refresh
      showToast(t('toast_saved'));

    // ── Weather auto-fill via Open-Meteo (no API key required) ──
    // Uses the device's current location (per user request) to fill temperature (avg/min/max),
    // humidity, wind, and feels-like. Chooses the correct Open-Meteo endpoint by date:
    //   • forecast API (with past_days) for today and the last ~5 days
    //   • archive API for older dates
    // Manual entry always remains available as a fallback / correction.
    async function fetchWeatherForActivity(activityId) {
      const act = state.tcxSessions.find(a => a.id === activityId);
      if (!act) return;
      const statusEls = [
        document.getElementById(`weatherFetchStatus-${activityId}`),
        document.getElementById(`weatherFetchStatusTop-${activityId}`)
      ].filter(Boolean);
      const setStatus = (msg) => statusEls.forEach(el => { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; });

      async function getCoords() {
        if (navigator.geolocation) {
          const devicePos = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
              (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, source: 'device' }),
              () => resolve(null),
              { timeout: 10000, enableHighAccuracy: true }
            );
          });
          if (devicePos) return devicePos;
        }
        if (act.firstGPS?.lat) return { lat: act.firstGPS.lat, lon: act.firstGPS.lon, source: 'tcx' };
        return null;
      }

      setStatus(getLang()==='es' ? 'Buscando ubicación del dispositivo...' : 'Locating device...');
      const coords = await getCoords();
      if (!coords) {
        showToast(getLang()==='es' ? '✕ Sin ubicación — autoriza el permiso o ingresa manual' : '✕ No location — allow permission or enter manually');
        setStatus('');
        return;
      }

      setStatus(getLang()==='es' ? 'Consultando clima (Open-Meteo)...' : 'Fetching weather (Open-Meteo)...');
      try {
        const date = act.dateISO || todayISO();
        // Decide endpoint: archive for dates older than ~5 days, forecast otherwise.
        const daysAgo = Math.round((Date.now() - new Date(date + 'T12:00:00').getTime()) / 86400000);
        const useArchive = daysAgo > 5;
        const base = useArchive ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';

        let url = `${base}?latitude=${coords.lat.toFixed(4)}&longitude=${coords.lon.toFixed(4)}` +
          `&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean` +
          `&hourly=relative_humidity_2m,apparent_temperature,wind_speed_10m` +
          `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
        if (useArchive) {
          url += `&start_date=${date}&end_date=${date}`;
        } else {
          // forecast API: past_days covers recent days without needing start_date
          url += `&past_days=7&forecast_days=1`;
        }

        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        // ── Daily temps (avg/min/max) ──
        let avgTempF = null, minTempF = null, maxTempF = null;
        const dTimes = data.daily?.time || [];
        let dIdx = dTimes.indexOf(date);
        if (dIdx === -1 && dTimes.length) dIdx = dTimes.length - 1; // fall back to nearest available
        if (dIdx !== -1) {
          maxTempF = Math.round(data.daily.temperature_2m_max[dIdx]);
          minTempF = Math.round(data.daily.temperature_2m_min[dIdx]);
          avgTempF = Math.round(data.daily.temperature_2m_mean[dIdx]);
        }

        // ── Hourly humidity / wind / feels-like at the run's start hour (default 7 AM) ──
        let humidity = null, wind = null, feelsLike = null;
        const hTimes = data.hourly?.time || [];
        if (hTimes.length) {
          let targetHour = 7;
          if (act.startTimeISO) {
            const d = new Date(act.startTimeISO);
            if (!isNaN(d.getTime())) targetHour = d.getHours();
          }
          // Prefer an hour on the activity date; else midpoint.
          let idx = hTimes.findIndex(tstr => tstr.startsWith(date) && new Date(tstr).getHours() === targetHour);
          if (idx === -1) idx = hTimes.findIndex(tstr => tstr.startsWith(date));
          if (idx === -1) idx = Math.floor(hTimes.length / 2);
          humidity = Math.round(data.hourly.relative_humidity_2m[idx]);
          wind = Math.round(data.hourly.wind_speed_10m[idx]);
          feelsLike = Math.round(data.hourly.apparent_temperature[idx]);
        }

        if (avgTempF == null && humidity == null) throw new Error('No usable weather data');

        if (!act.manualFields) act.manualFields = {};
        if (humidity != null) act.manualFields.humidity = humidity;
        if (wind != null) act.manualFields.wind = wind;
        if (feelsLike != null) act.manualFields.feelsLike = feelsLike;
        // Store fetched temps separately so they show in the CONDITIONS table without
        // overwriting real TCX temperature data.
        if (avgTempF != null) act.manualFields.wxAvgTempF = avgTempF;
        if (minTempF != null) act.manualFields.wxMinTempF = minTempF;
        if (maxTempF != null) act.manualFields.wxMaxTempF = maxTempF;

        saveState();
        render();
        showToast(getLang()==='es'
          ? `✓ Clima obtenido (${coords.source === 'tcx' ? 'GPS del TCX' : 'ubicación del dispositivo'})`
          : `✓ Weather fetched (${coords.source === 'tcx' ? 'TCX GPS' : 'device location'})`);
      } catch (err) {
        console.error('Weather fetch error:', err);
        showToast(getLang()==='es' ? '✕ Error al obtener clima — ingresa manualmente' : '✕ Weather fetch failed — enter manually');
        setStatus('');
      }
    }

    // ── Reverse geocoding via OpenStreetMap Nominatim (no API key required) ──
    // Rate limit: 1 req/sec. Only called when user explicitly clicks "Get Location".
    async function fetchLocationFromGPS(activityId) {
      const act = state.tcxSessions.find(a => a.id === activityId);
      if (!act?.firstGPS?.lat) {
        showToast(getLang()==='es' ? '✕ Sin datos GPS en este archivo' : '✕ No GPS data in this file');
        return;
      }
      showToast(getLang()==='es' ? 'Buscando ubicación...' : 'Looking up location...');
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${act.firstGPS.lat}&lon=${act.firstGPS.lon}&format=json&zoom=14`;
        const resp = await fetch(url, { headers: { 'Accept-Language': getLang() === 'es' ? 'es' : 'en' } });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.suburb || '';
        const municipality = data.address?.county || data.address?.municipality || '';
        const country = data.address?.country || '';
        const locationStr = [city || municipality, country].filter(Boolean).join(', ');
        if (!act.manualFields) act.manualFields = {};
        act.manualFields.locationName = locationStr || data.display_name?.split(',').slice(0,2).join(',').trim();
        saveState();
        render();
        showToast(getLang()==='es' ? '✓ Ubicación obtenida' : '✓ Location found');
      } catch (err) {
        console.error('Geocoding error:', err);
        showToast(getLang()==='es' ? '✕ Error al obtener ubicación' : '✕ Location lookup failed');
      }
    }

    // ═══ TCX UPLOAD ═══
    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (e) => reject(e);
        reader.readAsText(file);
      });
    }

    async function handleTCXUpload(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const isBulk = files.length > 1;
      showToast(isBulk ? `${t('toast_parsing')} (0/${files.length})` : t('toast_parsing'));

      let loaded = 0, duplicates = 0, errors = 0, reprocessed = 0;
      let lastParsed = null;

      for (let i = 0; i < files.length; i++) {
        try {
          const xmlText = await readFileAsText(files[i]);
          const parsed = parseTCX(xmlText, state.profile?.lthr || 174);
          if (!parsed) { errors++; continue; }
          const existingById = state.tcxSessions.find(t => t.id === parsed.id);
          // Secondary dedup: same date + near-identical distance & duration = same run re-exported.
          const existingByMatch = state.tcxSessions.find(t =>
            t.dateISO === parsed.dateISO &&
            Math.abs((t.totalDistMi || 0) - (parsed.totalDistMi || 0)) < 0.05 &&
            Math.abs((t.totalTimeSec || 0) - (parsed.totalTimeSec || 0)) < 15
          );
          const existing = existingById || existingByMatch;
          if (existing) {
            // Re-uploading the same activity (e.g. after a calculation fix) should refresh the
            // auto-computed analysis, not silently no-op — but never discard what the athlete
            // typed in by hand (RPE, sleep, feelings, weather, linked plan day).
            const preservedManualFields = existing.manualFields;
            const preservedLinkedPlanDay = existing.linkedPlanDay;
            Object.assign(existing, parsed, { id: existing.id, manualFields: preservedManualFields, linkedPlanDay: preservedLinkedPlanDay });
            reprocessed++;
            lastParsed = existing;
            continue;
          }
          state.tcxSessions.unshift(parsed);
          lastParsed = parsed;
          loaded++;
        } catch (err) {
          console.error(err);
          errors++;
        }
        if (isBulk) showToast(`${t('toast_parsing')} (${i + 1}/${files.length})`);
      }

      if (loaded > 0 || reprocessed > 0) {
        state.tcxSessions.sort((a, b) => (b.dateISO || '').localeCompare(a.dateISO || ''));
        saveState();
      }
      render();

      if (isBulk) {
        showToast(t('toast_bulk_summary').replace('{n}', loaded).replace('{dup}', duplicates).replace('{err}', errors) + (reprocessed ? ` · ${reprocessed} ${getLang()==='es'?'actualizados':'updated'}` : ''));
      } else if (loaded === 1 && lastParsed) {
        showToast(`✓ ${lastParsed.totalDistMi.toFixed(2)} MI · ${t('toast_grade')} ${lastParsed.analysis.sessionGrade}`);
      } else if (reprocessed === 1 && lastParsed) {
        showToast(getLang() === 'es' ? `✓ Actividad reprocesada con el cálculo actualizado` : `✓ Activity reprocessed with updated calculation`);
      } else if (duplicates === 1) {
        showToast(t('toast_already_logged'));
      } else if (errors === 1) {
        showToast(t('toast_parse_error'));
      }

      event.target.value = '';
    }

    // ═══ MARKDOWN EXPORT ═══
    const SESSION_TYPE_LABELS = {
      easy: 'Z2 / Easy', tempo: 'Tempo', intervals: 'Intervalos', long: 'Long Run',
      race_sim: 'Race Simulation', rest: 'Rest'
    };

    function buildActivityMarkdown(t) {
      const a = t.analysis || {};
      const mf = t.manualFields || {};
      const isBike = t.sport === 'biking';
      const linkedSession = t.linkedPlanDay ? state.plan.find(s => s.day === t.linkedPlanDay) : null;
      const typeLabel = linkedSession ? (SESSION_TYPE_LABELS[linkedSession.type] || linkedSession.type) : (mf.trainingType || 'Sin vincular a sesión del plan');
      const ND = 'N/D';

      // Auto-evaluation
      const { history, sameTypeOnly: fatigueSameTypeOnly } = buildFatigueHistory(t);
      const fatigue = calcFatigueIndex({ avgHR: t.avgHR, avgPaceSecPerMi: t.avgPaceSecPerMi }, history);
      fatigue.sameTypeOnly = fatigueSameTypeOnly;
      const autoEval = calcAutoEvaluation(a, fatigue);

      // Zone time in MM:SS helper
      const zSec = a.timeInZones?.seconds || {};
      const zoneTimeFmt = z => {
        const s = Math.round(zSec[z] || 0);
        if (!s) return '0:00';
        const m = Math.floor(s / 60);
        const sec = (s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
      };
      const totalZoneSec = Object.values(zSec).reduce((a,b)=>a+b,0) || 1;
      const zonePct = z => Math.round((zSec[z]||0) / totalZoneSec * 100);

      const lines = [];
      
      // ── METADATA BLOCK (Claude parsing friendly) ─────────────────────────────
      lines.push('```');
      lines.push('ACTIVITY METADATA');
      lines.push(`Date: ${t.dateISO}`);
      lines.push(`Sport: ${isBike ? 'Biking' : 'Running'}`);
      lines.push(`Type: ${typeLabel}`);
      if (linkedSession) lines.push(`Linked Plan Day: ${linkedSession.day}`);
      lines.push(`LTHR: ${state.profile?.lthr || 174} bpm`);
      if (isBike) {
        lines.push(`Avg Speed: ${(t.avgSpeedMph || 0).toFixed(1)} mph`);
      } else {
        lines.push(`VDOT: ${a.vdot ? a.vdot.toFixed(1) : 'N/D'}`);
        let pred5K = a.predicted5KSec ? secToMMSS(a.predicted5KSec) : ND;
        lines.push(`Predicted 5K: ${pred5K}`);
      }
      let tss = estimateTSS(t.totalDistMi, t.totalTimeSec, t.avgHR, state.profile?.lthr || 174).toFixed(1);
      lines.push(`TSS: ${tss}`);
      if (a.aerobicDecoupling != null) lines.push(`Aerobic Decoupling: ${a.aerobicDecoupling.toFixed(1)}%`);
      lines.push(`Session Grade: ${a.sessionGrade || ND}`);
      lines.push('```');
      lines.push('');
      
      lines.push(`# Reporte de Actividad — ${t.dateISO}`);
      lines.push('');
      
      // ── EXECUTIVE SUMMARY TABLE ─────────────────────────────────────────────
      lines.push('| Métrica | Valor | Estado |');
      lines.push('|---------|-------|--------|');
      lines.push(`| Distancia | ${t.totalDistMi.toFixed(2)} mi | — |`);
      lines.push(`| Tiempo | ${secToHHMMSS(t.totalTimeSec)} | — |`);
      if (isBike) {
        lines.push(`| Velocidad Promedio | ${(t.avgSpeedMph||0).toFixed(1)} mph | — |`);
      } else {
        lines.push(`| Pace Promedio | ${fmtPace(t.avgPaceSecPerMi)} | — |`);
      }
      lines.push(`| FC Promedio / Máxima | ${t.avgHR} / ${t.maxHR} bpm | ${a.sessionGrade || '?'} |`);
      if (!isBike) {
        lines.push(`| VDOT | ${a.vdot ? a.vdot.toFixed(1) : (a.vdotTerrainInvalid ? 'N/D (terreno)' : 'N/D')} | ${a.vdot && a.vdot > 31.5 ? '↑' : (a.vdot && a.vdot < 31.5 ? '↓' : '—') } |`);
      }
      lines.push(`| TSS | ${tss} | — |`);
      lines.push('');

      // ── INFORMACIÓN GENERAL ──────────────────────────────────────────────
      lines.push('## Información General');
      lines.push('');
      lines.push(`**Fecha:** ${t.dateISO}`);
      lines.push(`**Tipo de Entrenamiento:** ${typeLabel}`);
      lines.push(`**Objetivo del Entrenamiento:** ${mf.sessionGoal || ND}`);
      lines.push('');

      // ── RUTA EVALUADA ─────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Ruta Evaluada');
      lines.push('');
      lines.push(`**Nombre de Actividad:** ${t.activityName || ND}`);
      lines.push(`**Ubicación:** ${mf.locationName || ND}`);
      if (t.firstGPS?.lat) lines.push(`**Coordenadas GPS (inicio):** ${t.firstGPS.lat.toFixed(5)}, ${t.firstGPS.lon.toFixed(5)}`);
      lines.push(`**Hora de Inicio:** ${t.startTimeISO ? new Date(t.startTimeISO).toLocaleString('es-PR') : ND}`);
      lines.push(`**Hora de Finalización:** ${t.endTimeISO ? new Date(t.endTimeISO).toLocaleString('es-PR') : ND}`);
      lines.push(`**Altitud Mínima:** ${t.altMinM != null ? t.altMinM + ' m' : ND}`);
      lines.push(`**Altitud Máxima:** ${t.altMaxM != null ? t.altMaxM + ' m' : ND}`);
      lines.push(`**Pendiente Máxima Subida:** ${t.maxGradeUp != null ? '+' + t.maxGradeUp + '%' : ND}`);
      lines.push(`**Pendiente Máxima Bajada:** ${t.maxGradeDown != null ? t.maxGradeDown + '%' : ND}`);
      lines.push('');
      lines.push('> Los campos de Nombre, Temperatura, Training Effect y Carga de Entrenamiento dependen de los datos que tu reloj Garmin incluye en el TCX. Viento, Humedad, Sensación Térmica y Superficie son campos manuales.');
      lines.push('');

      // ── ESTADO DEL ATLETA PRE-SESIÓN ─────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Estado del Atleta Antes de la Sesión');
      lines.push('');
      lines.push(`**Horas de Sueño:** ${mf.sleepHours ? mf.sleepHours + ' h' : ND}`);
      lines.push(`**Calidad del Sueño (1-10):** ${mf.sleepQuality || ND}`);
      lines.push(`**Nivel de Energía (1-10):** ${mf.energyLevel || ND}`);
      lines.push(`**Estrés (1-10):** ${mf.stressLevel || ND}`);
      lines.push(`**Dolor o Molestias:** ${mf.painNotes || 'Ninguno'}`);
      lines.push(`**Peso Corporal:** ${mf.bodyWeight ? mf.bodyWeight + ' lb' : ND}`);
      lines.push(`**HRV:** ${mf.hrv ? mf.hrv + ' ms' : (a.hrvProxy ? '~' + a.hrvProxy + ' (proxy TCX)' : ND)}`);
      lines.push(`**Frecuencia Cardíaca en Reposo:** ${mf.restingHR ? mf.restingHR + ' bpm' : ND}`);
      lines.push('');

      // ── CONDICIONES AMBIENTALES ──────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Condiciones Ambientales');
      lines.push('');
      lines.push(`**Temperatura Promedio:** ${t.hasTempData ? t.avgTempF + '°F' : (mf.temperature || ND)} ${t.hasTempData ? '(del TCX)' : '(manual)'}`);
      lines.push(`**Temperatura Mínima:** ${t.minTempF != null ? t.minTempF + '°F (del TCX)' : ND}`);
      lines.push(`**Temperatura Máxima:** ${t.maxTempF != null ? t.maxTempF + '°F (del TCX)' : ND}`);
      lines.push(`**Humedad:** ${mf.humidity ? mf.humidity + '%' : ND}`);
      lines.push(`**Viento:** ${mf.wind ? mf.wind + ' mph' : ND}`);
      lines.push(`**Sensación Térmica:** ${mf.feelsLike ? mf.feelsLike + '°F' : ND}`);
      lines.push(`**Superficie:** ${mf.surface || ND}`);
      lines.push('');

      // ── RESULTADOS ───────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Resultados de la Sesión');
      lines.push('');
      lines.push(`**Distancia:** ${t.totalDistMi.toFixed(2)} mi (${(t.totalDistMi * 1.60934).toFixed(2)} km)`);
      lines.push(`**Tiempo:** ${secToHHMMSS(t.totalTimeSec)}`);
      if (isBike) {
        lines.push(`**Velocidad Promedio:** ${(t.avgSpeedMph || 0).toFixed(1)} mph (${((t.avgSpeedMph||0)*1.60934).toFixed(1)} km/h)`);
      } else {
        lines.push(`**Pace Promedio:** ${fmtPace(t.avgPaceSecPerMi)}`);
        if (t.workPaceSecPerMi) {
          lines.push(`**Pace de Repeticiones (solo esfuerzo):** ${fmtPace(t.workPaceSecPerMi)} — ${t.workLapsCount} tramo(s) de esfuerzo detectados`);
          lines.push(`**Pace de Recuperación:** ${fmtPace(t.recoveryPaceSecPerMi)} — ${t.recoveryLapsCount} tramo(s) de recuperación excluidos del promedio de arriba`);
        }
      }
      lines.push('');
      lines.push(`**FC Promedio:** ${t.avgHR} bpm`);
      lines.push(`**FC Máxima:** ${t.maxHR} bpm`);
      
      // VDOT calculation — running only, meaningless for a bike ride
      const vdot = a.vdot ? a.vdot.toFixed(1) : (a.vdotTerrainInvalid ? `N/D — terreno (${a.elevGainPerMi} m/mi de desnivel)` : 'N/D');
      pred5K = a.predicted5KSec ? secToMMSS(a.predicted5KSec) : 'N/D';
      // tss already computed above from estimateTSS() using real session data — reuse it
      
      if (!isBike) {
        lines.push(`**VDOT (VO2max):** ${a.vdot ? vdot + ' ml/kg/min' : vdot}`)  ;
        lines.push(`**Predicción 5K:** ${pred5K}`)  ;
      }
      lines.push(`**TSS (Training Stress Score):** ${tss}`)  ;
      lines.push('');
      lines.push(`**Cadencia Promedio:** ${t.avgCadSPM || ND} ${t.avgCadSPM ? (isBike ? 'rpm' : 'spm') : ''}`.trim());
      lines.push(`**Cadencia Máxima:** ${t.maxCadSPM || ND} ${isBike ? 'rpm' : 'spm'}`);
      lines.push('');
      lines.push(`**Potencia Promedio:** ${a.powerStats ? a.powerStats.avgWatts + ' W' : ND}`);
      lines.push(`**Potencia Máxima:** ${a.powerStats ? a.powerStats.maxWatts + ' W' : ND}`);
      lines.push('');
      lines.push(`**Elevación Ganada:** +${t.elevGainM} m / +${t.elevGainFt || Math.round(t.elevGainM * 3.28084)} ft`);
      lines.push(`**Elevación Perdida:** -${t.elevLossM} m / -${t.elevLossFt || Math.round(t.elevLossM * 3.28084)} ft`);
      lines.push('');
      lines.push(`**Calorías:** ${t.calories || ND} kcal`);
      lines.push('');
      lines.push(`**Training Effect Aeróbico:** ${mf.aerobicTE || ND}`);
      lines.push(`**Training Effect Anaeróbico:** ${mf.anaerobicTE || ND}`);
      lines.push(`**Carga de Entrenamiento (Garmin):** ${mf.trainingLoad || ND}`);
      lines.push('');

      const loadStatus = getCurrentLoadStatus();
      if (loadStatus) {
        const formLabelEs = {
          'Building — normal training load': 'Construyendo — carga normal de entrenamiento',
          'Fresh — good time for key efforts': 'Fresco — buen momento para esfuerzos clave',
          'Loaded — active build block': 'Cargado — bloque de construcción activo',
          'Overloaded — excessive fatigue risk': 'Sobrecargado — riesgo de fatiga excesiva',
          'Possible fitness loss — train more': 'Posible pérdida de forma — entrena más'
        }[loadStatus.formLabel] || loadStatus.formLabel;
        lines.push('**Carga Calculada (modelo CTL/ATL/TSB):**');
        lines.push(`- CTL (Fitness, 42 días): ${loadStatus.ctl}`);
        lines.push(`- ATL (Fatiga, 7 días): ${loadStatus.atl}`);
        lines.push(`- TSB (Forma): ${loadStatus.tsb > 0 ? '+' : ''}${loadStatus.tsb} — ${formLabelEs}`);
        lines.push('');
      }

      // ── ZONAS CARDÍACAS ──────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Zonas Cardíacas');
      lines.push('');
      lines.push('### Configuración de Zonas (basada en LTHR)');
      lines.push('');
      const lthr = state.profile?.lthr || 174;
      const zoneRef = buildHRZoneReference(lthr);
      const zoneNames = { 1: 'Z1 Recuperación', 2: 'Z2 Aeróbica', 3: 'Z3 Aeróbica Moderada', 4: 'Z4 Umbral', 5: 'Z5 Máxima' };
      lines.push(`| Zona | Rango (LTHR ${lthr} bpm) | Objetivo |`);
      lines.push('|------|--------------------------|----------|');
      zoneRef.forEach(z => {
        lines.push(`| ${zoneNames[z.num]} | ${fmtZoneRange(z)} bpm | ${z.objective.es} |`);
      });
      lines.push('');
      lines.push('### Tiempo en Zonas');
      lines.push('');
      lines.push('| Zona | Tiempo | % |');
      lines.push('|------|--------|---|');
      [1,2,3,4,5].forEach(z => {
        lines.push(`| Z${z} | ${zoneTimeFmt(z)} | ${zonePct(z)}% |`);
      });
      lines.push('');

      // ── DERIVA CARDÍACA ──────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Deriva Cardíaca');
      lines.push('');
      if (a.cardiacDrift) {
        lines.push(`**FC Primera Mitad:** ${a.cardiacDrift.avgHRFirstHalf} bpm`);
        lines.push(`**FC Segunda Mitad:** ${a.cardiacDrift.avgHRSecondHalf} bpm`);
        const driftPctSign = a.cardiacDrift.driftPct >= 0 ? '+' : '';
        const driftBpmSign = a.cardiacDrift.driftBpm >= 0 ? '+' : '';
        lines.push(`**Deriva:** ${driftPctSign}${a.cardiacDrift.driftPct}% (${driftBpmSign}${a.cardiacDrift.driftBpm} bpm)`);
        lines.push(`**Pace cambió entre mitades:** ${a.cardiacDrift.pacingChanged ? 'Sí' : 'No'}`);
        lines.push('');
        lines.push(`**Interpretación:** ${autoEval.driftInterp || ND}`);
        lines.push('');
        lines.push('> Referencia: < 5% = Excelente | 5-8% = Normal | 8-10% = Fatiga o calor | > 10% = Exceso de intensidad');
      } else {
        lines.push(ND + ' — datos insuficientes');
      }
      lines.push('');

      // ── SPLITS ───────────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push(`## Splits Reales (por milla)`);
      lines.push('');
      const splits = a.realSplitsMi || [];
      if (splits.length) {
        lines.push(isBike ? '| # | Velocidad | FC Prom | FC Máx | Cadencia | Elev +/- |' : '| # | Pace | FC Prom | FC Máx | Cadencia | Elev +/- |');
        lines.push('|---|------|---------|--------|----------|----------|');
        splits.forEach(s => {
          const paceOrSpeed = isBike ? `${(s.paceSecPerUnit > 0 ? (3600/s.paceSecPerUnit).toFixed(1) : '0.0')} mph` : fmtPace(s.paceSecPerUnit);
          lines.push(`| ${s.splitNum}${s.partial ? '*' : ''} | ${paceOrSpeed} | ${s.avgHR ? Math.round(s.avgHR) : ND} | ${s.maxHR ? Math.round(s.maxHR) : ND} | ${s.avgCadence ? Math.round(s.avgCadence) : ND} | +${s.elevGainM}m/-${s.elevLossM}m |`);
        });
        if (splits.some(s => s.partial)) lines.push('');
        lines.push(`*  Parcial (distancia: ${(splits.find(s=>s.partial)?.distM/1609.344 || 0).toFixed(2)} mi)`);
      } else {
        lines.push(ND);
      }
      lines.push('');

      // ── RUN / WALK ───────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      
      // Aerobic Decoupling Analysis — efficiency factor (HR:pace ratio) between first and second half.
      // Distinct from "Deriva Cardíaca" above (which only tracks raw HR drift): this metric also
      // accounts for pace changes between halves, so it stays meaningful even if the athlete
      // slowed down or sped up in the second half.
      const decSplits = (a.realSplitsMi || []).filter(sp => sp.avgHR != null && sp.paceSecPerUnit > 0);
      if (decSplits.length >= 2) {
        const mid = Math.floor(decSplits.length / 2);
        const firstHalf = decSplits.slice(0, mid);
        const secondHalf = decSplits.slice(mid);
        
        const firstHalfAvgHR = Math.round(firstHalf.reduce((s, sp) => s + sp.avgHR, 0) / firstHalf.length);
        const firstHalfAvgPace = firstHalf.reduce((s, sp) => s + sp.paceSecPerUnit, 0) / firstHalf.length;
        
        const secondHalfAvgHR = Math.round(secondHalf.reduce((s, sp) => s + sp.avgHR, 0) / secondHalf.length);
        const secondHalfAvgPace = secondHalf.reduce((s, sp) => s + sp.paceSecPerUnit, 0) / secondHalf.length;
        
        // Efficiency Factor = speed / HR. Pace is stored as sec/unit, so speed = 1/pace.
        // Decoupling = how much EF DEGRADED from first half to second half.
        //   positive  -> efficiency dropped (real aerobic decoupling / cardiac fatigue)
        //   negative  -> efficiency improved (ran faster at the same or lower HR) — this is GOOD
        // The previous formula was (HR2/pace2)/(HR1/pace1), which INVERTS the sign: speeding up
        // in the second half made the number large and positive and got reported as "significant
        // cardiac fatigue". Fixed to match the efficiency-factor math used in parseTCX().
        const efFirst  = (1 / firstHalfAvgPace)  / firstHalfAvgHR;
        const efSecond = (1 / secondHalfAvgPace) / secondHalfAvgHR;
        const decoupling = ((efFirst - efSecond) / efFirst) * 100;

        // Elevation validity guard: on an asymmetric course (climb out / descend back) the pace
        // difference between halves is driven by gradient, not by fitness, so the comparison is
        // physiologically meaningless. Threshold: 30 m of net elevation difference between halves.
        const netElev = (arr) => arr.reduce((sum, sp) => sum + ((sp.elevGainM || 0) - (sp.elevLossM || 0)), 0);
        const elevSkewM = Math.abs(netElev(secondHalf) - netElev(firstHalf));
        const decouplingValid = elevSkewM <= 30;

        lines.push('## Decoupling Aeróbico (HR/Pace Divergence)');
        lines.push('');
        lines.push(`**Primera Mitad:** ${firstHalfAvgHR} bpm avg, ${fmtPace(firstHalfAvgPace)} pace`)  ;
        lines.push(`**Segunda Mitad:** ${secondHalfAvgHR} bpm avg, ${fmtPace(secondHalfAvgPace)} pace`)  ;

        if (!decouplingValid) {
          lines.push(`**Decoupling:** N/D — no válido`);
          lines.push(`**Motivo:** Perfil de elevación asimétrico (${Math.round(elevSkewM)} m de diferencia neta entre mitades). El cambio de ritmo lo explica la pendiente, no la fatiga.`);
        } else {
          lines.push(`**Decoupling:** ${decoupling.toFixed(1)}%`)  ;
          if (decoupling < 0) {
            lines.push(`**Interpretación:** Eficiencia mejoró ${Math.abs(decoupling).toFixed(1)}% — ritmo más rápido al mismo costo cardíaco.`);
          } else if (decoupling < 5) {
            lines.push('**Interpretación:** Excelente — motor aeróbico consistente y eficiente.');
          } else if (decoupling < 10) {
            lines.push('**Interpretación:** Normal — fatiga acumulada leve.');
          } else {
            lines.push('**Interpretación:** Alto — fatiga cardíaca significativa. Considera más volumen Z2.');
          }
        }
        lines.push('');
      }

      if (!isBike) {
        lines.push('## Run / Walk');
        lines.push('');
        if (a.runWalk) {
          lines.push(`**Tiempo corriendo:** ${secToHHMMSS(a.runWalk.runTimeSec)} (${a.runWalk.runPct}%)`);
          lines.push(`**Tiempo caminando:** ${secToHHMMSS(a.runWalk.walkTimeSec)} (${100-a.runWalk.runPct}%)`);
          lines.push(`**Pausas detectadas:** ${a.runWalk.walkSegments?.length || 0}`);
          if (a.runWalk.walkSegments?.length) {
            lines.push('');
            lines.push('| # | Inicio | Duración |');
            lines.push('|---|--------|----------|');
            a.runWalk.walkSegments.forEach((w,i) => {
              lines.push(`| ${i+1} | @${secToMMSSOffset(w.startOffsetSec)} | ${Math.round(w.durationSec)}s |`);
            });
          }
        } else {
          lines.push(ND);
        }
        lines.push('');
      }

      // ── CADENCIA POR SEGMENTO ────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Cadencia por Segmento');
      lines.push('');
      if (a.cadenceSegments?.length) {
        a.cadenceSegments.forEach(s => lines.push(`- Segmento ${s.segment}: ${s.avgCadence} spm`));
      } else {
        lines.push(ND);
      }
      lines.push('');

      // ── POTENCIA ─────────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Potencia');
      lines.push('');
      if (a.powerStats) {
        lines.push(`**Promedio:** ${a.powerStats.avgWatts} W`);
        lines.push(`**Máxima:** ${a.powerStats.maxWatts} W`);
        lines.push(`**Desviación Estándar:** ±${a.powerStats.stdevWatts} W`);
      } else {
        lines.push(ND + ' — sin datos de potencia en este TCX');
      }
      lines.push('');

      // ── CONSISTENCIA DE RITMO ────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Consistencia de Ritmo');
      lines.push('');
      if (a.pacingConsistency) {
        lines.push(`**Coeficiente de Variación:** ${a.pacingConsistency.cvPct}%`);
        lines.push(`**Evaluación:** ${autoEval.consistencyLabel}`);
        lines.push('');
        lines.push('> Referencia: < 3% = Excelente | 3-6% = Buena | 6-10% = Variable | > 10% = Inconsistente');
      } else {
        lines.push(ND + ' — splits insuficientes');
      }
      lines.push('');

      // ── FATIGA ───────────────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Fatiga Entre Sesiones');
      lines.push('');
      if (fatigue.available) {
        lines.push(`**FC Base (últimas ${fatigue.sessionsCompared}):** ${fatigue.baselineAvgHR} bpm`);
        lines.push(`**Delta FC:** ${fatigue.hrDeltaBpm > 0 ? '+' : ''}${fatigue.hrDeltaBpm} bpm`);
        lines.push(`**Delta Pace:** ${fatigue.paceDeltaSec > 0 ? '+' : ''}${fatigue.paceDeltaSec}s/mi (${fatigue.paceDeltaSec > 0 ? 'más lento' : 'más rápido'} que base)`);
        lines.push(`**Señal:** ${fatigue.signal}`);
        lines.push(fatigue.sameTypeOnly ? '*Comparado solo contra sesiones del mismo tipo.*' : '*⚠ Comparado contra sesiones de tipos mixtos — interpretar con cautela.*');
      } else {
        lines.push('No hay sesiones previas para comparar');
      }
      lines.push('');

      // ── HRV PROXY ────────────────────────────────────────────────────────
      // Only show the estimated proxy when the athlete has NOT entered a real measured HRV.
      // Printing both (e.g. "HRV: 44 ms" above and "HRV Proxy: 0.9" here) invites reading the
      // proxy as a second, contradictory measurement of the same thing.
      if (a.hrvProxy && !(mf && mf.hrv)) {
        lines.push('---');
        lines.push('');
        lines.push('## HRV (Aproximado del TCX)');
        lines.push('');
        lines.push(`**HRV Proxy:** ${a.hrvProxy} (variabilidad inter-latido estimada)`);
        lines.push('> Nota: Este valor es una aproximación basada en variaciones de FC entre trackpoints, no sustituye un HRV medido directamente por el reloj.');
        lines.push('');
      }

      // ── RPE Y SENSACIONES ────────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Percepción del Esfuerzo (RPE)');
      lines.push('');
      lines.push('| Escala | Descripción |');

      lines.push('| 7 | Difícil |');
