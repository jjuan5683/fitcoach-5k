    // ═══════════════════════════════════════════════════════════════════════
    // GRIT 100 — 100 standard miles, Nov 1–30 (run + ruck). Home dashboard card.
    // Counts: TCX activities (any sport except biking) + manual "Ruck" and "Run" sessions.
    // ═══════════════════════════════════════════════════════════════════════
    const GRIT = {
      target: 100,
      start: '2026-11-01',
      end: '2026-11-30',
      weeklyPreMi: 20, // weekly volume to hold BEFORE Nov 1 (rolling 7 days)
      // Plan aprobado 27-oct-2026 (Fase 4): 22 + 24 + 26 + 28 = 100 al 28-nov; 29–30 nov = colchón (0).
      // run/ruck = reparto planificado de cada bloque (81 running / 19 marcha con chaleco).
      ramp: [
        { from: '2026-11-01', to: '2026-11-07', mi: 22, run: 20, ruck: 2 },
        { from: '2026-11-08', to: '2026-11-14', mi: 24, run: 19, ruck: 5 },
        { from: '2026-11-15', to: '2026-11-21', mi: 26, run: 20, ruck: 6 },
        { from: '2026-11-22', to: '2026-11-28', mi: 28, run: 22, ruck: 6 },
        { from: '2026-11-29', to: '2026-11-30', mi: 0,  run: 0,  ruck: 0 }
      ]
    };

    // Local-date helpers (never toISOString: it is UTC and flips the day after 8 PM in Puerto Rico).
    const isoFromDate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const addDaysISO = (iso, n) => { const d = parseISODateLocal(iso); d.setDate(d.getDate() + n); return isoFromDate(d); };
    const daysBetweenISO = (a, b) => Math.round((parseISODateLocal(b) - parseISODateLocal(a)) / 86400000);

    function gritMilesBetween(fromISO, toISO) {
      let run = 0, ruck = 0;
      (state.tcxSessions || []).forEach(s => {
        if (s.dateISO >= fromISO && s.dateISO <= toISO && s.sport !== 'biking') {
          // A TCX assigned to boots is a ruck (vest walk), not a run.
          if (gearById(s.manualFields?.gearId)?.kind === 'boot') ruck += Number(s.totalDistMi) || 0;
          else run += Number(s.totalDistMi) || 0;
        }
      });
      (state.manualSessions || []).forEach(m => {
        if (m.dateISO < fromISO || m.dateISO > toISO) return;
        if (m.type === 'ruck') ruck += Number(m.distMi) || 0;
        else if (m.type === 'run') run += Number(m.distMi) || 0;
      });
      return { run, ruck, total: run + ruck };
    }

    // Miles the ramp expects you to have logged through `throughISO` (prorated inside a block).
    function gritRampExpected(throughISO) {
      let sum = 0;
      GRIT.ramp.forEach(b => {
        const len = daysBetweenISO(b.from, b.to) + 1;
        if (throughISO >= b.to) sum += b.mi;
        else if (throughISO >= b.from) sum += b.mi * (daysBetweenISO(b.from, throughISO) + 1) / len;
      });
      return sum;
    }

    function gritStats() {
      const today = todayISO();
      const started = today >= GRIT.start;
      const finished = today > GRIT.end;
      const all = gritMilesBetween(GRIT.start, GRIT.end);
      const remaining = Math.max(0, GRIT.target - all.total);
      const daysLeft = finished ? 0 : (started ? daysBetweenISO(today, GRIT.end) + 1 : 30); // includes today
      const perDay = daysLeft > 0 ? remaining / daysLeft : 0;
      const expected = started ? gritRampExpected(finished ? GRIT.end : addDaysISO(today, -1)) : 0;
      const todayMi = started && !finished ? gritMilesBetween(today, today).total : 0;
      const block = GRIT.ramp.find(b => today >= b.from && today <= b.to) || null;
      const blockDone = block ? gritMilesBetween(block.from, block.to).total : 0;
      const rolling7 = gritMilesBetween(addDaysISO(today, -6), today);
      return { today, started, finished, all, remaining, daysLeft, perDay, expected, todayMi, block, blockDone, rolling7,
               daysToStart: started ? 0 : daysBetweenISO(today, GRIT.start) };
    }

    function renderGritCard() {
      if (!state.profile) return '';
      const es = getLang() === 'es';
      const g = gritStats();
      const f1 = (n) => (Math.round(n * 10) / 10).toFixed(1);
      const fmtMD = (iso) => parseISODateLocal(iso).toLocaleDateString(es ? 'es-PR' : 'en-US', { month: 'short', day: 'numeric' });
      const box = (v, l) => `<div class="stat-box"><div class="value">${v}</div><div class="label">${l}</div></div>`;
      let boxes, pct, color, line1, line2 = '', status;

      if (!g.started) {
        // Before Nov 1 there is no mileage target: the pre-challenge week is set by the plan
        // (Sat 31 is rest). The old "20 mi in the last 7 days" line pushed extra miles. (2026.10.28)
        const r = g.rolling7;
        const w1 = GRIT.ramp[0];
        boxes = box(f1(r.total), es ? 'mi · 7 días' : 'mi · 7 days') + box(w1.mi, es ? 'meta semana 1' : 'week 1 goal') + box(g.daysToStart, es ? 'días al 1 nov' : 'days to Nov 1');
        pct = 0;
        color = 'var(--paper-dim)';
        line1 = es ? `Últimos 7 días — Correr: ${f1(r.run)} mi · Marcha: ${f1(r.ruck)} mi (no cuentan para el reto)` : `Last 7 days — Run: ${f1(r.run)} mi · Ruck: ${f1(r.ruck)} mi (not counted)`;
        status = es ? `Empieza el ${fmtMD(GRIT.start)}. Semana 1: ${w1.mi} mi (${w1.run} corriendo + ${w1.ruck} marcha). Hasta entonces sigue el plan; no sumes millas extra.`
                    : `Starts ${fmtMD(GRIT.start)}. Week 1: ${w1.mi} mi (${w1.run} run + ${w1.ruck} ruck). Until then follow the plan; no extra miles.`;
      } else if (g.finished) {
        const ok = g.all.total >= GRIT.target;
        boxes = box(f1(g.all.total), es ? 'mi total' : 'total mi') + box(f1(g.remaining), es ? 'faltaron' : 'short') + box(GRIT.target, es ? 'meta' : 'goal');
        pct = Math.min(100, g.all.total / GRIT.target * 100);
        color = ok ? 'var(--olive-bright)' : 'var(--signal-amber)';
        line1 = es ? `Correr: ${f1(g.all.run)} mi · Ruck: ${f1(g.all.ruck)} mi` : `Run: ${f1(g.all.run)} mi · Ruck: ${f1(g.all.ruck)} mi`;
        status = ok ? (es ? '✓ Reto completado.' : '✓ Challenge complete.') : (es ? 'Reto cerrado sin completar.' : 'Challenge closed incomplete.');
      } else {
        const behind = g.all.total < g.expected - 0.05;
        boxes = box(f1(g.all.total), es ? 'mi total' : 'total mi') + box(f1(g.remaining), es ? 'faltan' : 'remaining') + box(f1(g.perDay), es ? 'mi/día necesarias' : 'mi/day needed');
        pct = Math.min(100, g.all.total / GRIT.target * 100);
        color = behind ? 'var(--signal-amber)' : 'var(--olive-bright)';
        line1 = es ? `Correr: ${f1(g.all.run)} mi · Ruck: ${f1(g.all.ruck)} mi · ${g.daysLeft} días restantes (con hoy)`
                   : `Run: ${f1(g.all.run)} mi · Ruck: ${f1(g.all.ruck)} mi · ${g.daysLeft} days left (incl. today)`;
        if (g.block) line2 = (es ? 'Bloque ' : 'Block ') + `${fmtMD(g.block.from)}–${fmtMD(g.block.to)}: ${f1(g.blockDone)} / ${g.block.mi} mi` + (g.todayMi > 0 ? (es ? ` · hoy ${f1(g.todayMi)} mi` : ` · today ${f1(g.todayMi)} mi`) : '');
        status = behind ? (es ? `Atrasado ${f1(g.expected - g.all.total)} mi contra el plan.` : `Behind plan by ${f1(g.expected - g.all.total)} mi.`)
                        : (es ? 'Al día con el plan.' : 'On plan.');
      }

      const rows = GRIT.ramp.map(b => {
        const done = gritMilesBetween(b.from, b.to).total;
        const mark = b.mi === 0 ? (es ? 'colchón' : 'buffer') : done >= b.mi ? '✓' : (g.today > b.to ? '✕' : (g.today >= b.from ? '…' : '—'));
        return `<tr><td>${fmtMD(b.from)}–${fmtMD(b.to)}</td><td class="num-cell">${b.mi}${b.mi ? `<span style="font-size:9px; color:var(--paper-dim);"> (${b.run}+${b.ruck})</span>` : ''}</td><td class="num-cell">${f1(done)}</td><td>${mark}</td></tr>`;
      }).join('');

      return `
        <div class="card" style="border-left:3px solid var(--coyote);">
          <div class="card-title">GRIT 100 · ${es ? 'NOVIEMBRE' : 'NOVEMBER'}</div>
          <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">${boxes}</div>
          <div style="height:10px; background:var(--field-surface); border-radius:5px; overflow:hidden; margin:2px 0 8px;" role="img" aria-label="GRIT 100 ${Math.round(pct)}%">
            <div style="height:100%; width:${pct.toFixed(0)}%; background:${color};"></div>
          </div>
          <p style="font-size:11px; color:var(--paper-dim);">${line1}</p>
          ${line2 ? `<p style="font-size:11px; color:var(--paper-dim); margin-top:2px;">${line2}</p>` : ''}
          <p style="font-size:11px; color:${color}; margin-top:4px; font-weight:600;">${status}</p>
          <details class="fc-details" style="margin-top:8px;">
            <summary style="font-size:10px; color:var(--coyote); font-family:var(--font-mono);">${es ? 'PLAN SEMANAL' : 'WEEKLY PLAN'} ▾</summary>
            <table class="splits-table" style="margin-top:6px;">
              <thead><tr><th>${es ? 'Bloque' : 'Block'}</th><th>${es ? 'Meta' : 'Goal'}</th><th>${es ? 'Hecho' : 'Done'}</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <p style="font-size:9px; color:var(--paper-dim); margin-top:6px; line-height:1.4;">${es
              ? 'Cuentan: TCX (corrida u otros, no bici) + Ruck y Corrida manuales. Si subes el TCX no lo registres también a mano.'
              : 'Counts: TCX (run or other, not biking) + manual Ruck and Run. If you upload the TCX, do not also log it by hand.'}</p>
          </details>
        </div>`;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // CALC TAB — VDOT calculator (Daniels) + goal gap + pace zones + HR zones
    // ═══════════════════════════════════════════════════════════════════════
    function calcInputs() {
      const p = state.profile || {};
      const saved = (state.settings && state.settings.calc) || {};
      const ar = activeRace();
      const goalDistM = saved.goalDistM || (ar ? raceMetersByKey(ar.distanceKey || '5k') : 5000);
      const goalSec = saved.goalSec || activeGoalSec(p, goalDistM);
      return {
        distM: saved.distM || 5000,
        timeSec: saved.timeSec || p.currentFiveKSec || 1800,
        goalDistM, goalSec
      };
    }

    function calcEnter(e) { if (e && e.key === 'Enter') { e.preventDefault(); calcSubmit(); } }

    function calcSubmit() {
      const es = getLang() === 'es';
      const distM = parseFloat(document.getElementById('calcDist')?.value);
      const timeSec = parseTimeToSec(document.getElementById('calcTime')?.value);
      const goalDistM = parseFloat(document.getElementById('calcGoalDist')?.value);
      const goalSec = parseTimeToSec(document.getElementById('calcGoalTime')?.value);
      if (!(distM >= 1000 && distM <= 50000)) { showToast(es ? '⚠ Distancia de prueba: 1000–50000 m' : '⚠ Test distance: 1000–50000 m'); return; }
      if (!timeSec) { showToast(es ? '⚠ Tiempo de prueba: MM:SS o H:MM:SS' : '⚠ Test time: MM:SS or H:MM:SS'); return; }
      if (!goalDistM) { showToast(es ? '⚠ Elige la distancia de la meta' : '⚠ Pick the goal distance'); return; }
      if (!goalSec) { showToast(es ? '⚠ Tiempo de meta: MM:SS o H:MM:SS' : '⚠ Goal time: MM:SS or H:MM:SS'); return; }
      const vdot = calcVDOT(distM, timeSec);
      if (!(vdot >= 20 && vdot <= 85)) { showToast(es ? '⚠ Esa prueba da un VDOT fuera de rango (20–85). Revisa distancia y tiempo.' : '⚠ That test gives a VDOT outside 20–85. Check distance and time.'); return; }
      if (!state.settings) state.settings = {};
      state.settings.calc = { distM, timeSec, goalDistM, goalSec };
      saveState();
      render();
    }

    function calcApplyToProfile() {
      const es = getLang() === 'es';
      if (!state.profile) return;
      const inp = calcInputs();
      const vdot = calcVDOT(inp.distM, inp.timeSec);
      if (!(vdot >= 20 && vdot <= 85)) return;
      const sec = vdotTo5K(vdot);
      if (!sec) return;
      const msg = es
        ? `¿Cambiar tu 5K actual a ${secToMMSS(sec)}? Esto recalcula los paces objetivo (Daniels) en toda la app.`
        : `Set your current 5K to ${secToMMSS(sec)}? This recalculates target paces (Daniels) across the app.`;
      if (!confirm(msg)) return;
      state.profile.currentFiveKSec = sec;
      saveState();
      render();
      showToast(t('toast_saved'));
    }

    function renderCalcView() {
      const es = getLang() === 'es';
      if (!state.profile) return `<div class="view-container"><p style="font-size:12px; color:var(--paper-dim);">${es ? 'Completa tu perfil primero.' : 'Complete your profile first.'}</p></div>`;
      const inp = calcInputs();
      const vdot = calcVDOT(inp.distM, inp.timeSec);
      const valid = vdot >= 20 && vdot <= 85;
      const km = (m) => (m / 1000).toFixed(2);
      const miOf = (m) => (m / 1609.344).toFixed(2);

      let results = '';
      if (valid) {
        const predGoal = vdotToTime(vdot, inp.goalDistM);
        let lo = 20, hi = 85;
        for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (vdotToTime(mid, inp.goalDistM) > inp.goalSec) lo = mid; else hi = mid; }
        const need = (lo + hi) / 2;
        const gap = need - vdot;
        const pct = Math.max(0, Math.min(100, vdot / need * 100));
        const goalPace = inp.goalSec / (inp.goalDistM / 1609.344);
        const thrPace = (1609.344 / danielsVelFromVO2(vdot * 0.88)) * 60;
        const fiveK = vdotTo5K(vdot);
        const box = (v, l) => `<div class="stat-box"><div class="value">${v}</div><div class="label">${l}</div></div>`;
        const goalLabel = (RACE_DISTANCES.find(r => Math.abs(r.meters - inp.goalDistM) < 1) || { label: { en: km(inp.goalDistM) + ' km', es: km(inp.goalDistM) + ' km' } }).label[es ? 'es' : 'en'];
        results = `
          <div class="card">
            <div class="card-title">${es ? 'RESUMEN' : 'SUMMARY'}</div>
            <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
              ${box(vdot.toFixed(1), 'VDOT')}
              ${box(fmtRaceTime(predGoal), (es ? 'predicho ' : 'predicted ') + goalLabel)}
              ${box(fmtPaceNoUnit(thrPace) + '/mi', es ? 'umbral (T)' : 'threshold (T)')}
            </div>
          </div>

          <div class="card">
            <div class="card-title">${es ? 'META' : 'GOAL'}: ${goalLabel} · ${fmtRaceTime(inp.goalSec)}</div>
            <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
              ${box(need.toFixed(1), es ? 'VDOT requerido' : 'VDOT required')}
              ${box(fmtPaceNoUnit(goalPace) + '/mi', es ? 'ritmo meta' : 'goal pace')}
              ${box((gap >= 0 ? '+' : '') + gap.toFixed(1), es ? 'brecha VDOT' : 'VDOT gap')}
            </div>
            <div style="height:10px; background:var(--field-surface); border-radius:5px; overflow:hidden; margin:2px 0 8px;" role="img" aria-label="${es ? 'Avance hacia la meta' : 'Progress to goal'} ${Math.round(pct)}%">
              <div style="height:100%; width:${pct.toFixed(0)}%; background:${gap <= 0 ? 'var(--olive-bright)' : 'var(--coyote)'};"></div>
            </div>
            <p style="font-size:11px; color:var(--paper-dim); line-height:1.5;">${gap <= 0
              ? (es ? 'Tu VDOT ya alcanza la meta.' : 'Your VDOT already reaches the goal.')
              : (es ? `Tu VDOT cubre el ${pct.toFixed(0)}% de lo que pide la meta; faltan +${gap.toFixed(1)} puntos. Úsala como techo y chequea el avance a mitad del bloque.`
                    : `Your VDOT covers ${pct.toFixed(0)}% of what the goal needs; +${gap.toFixed(1)} points to go. Treat it as a ceiling and check progress mid-block.`)}</p>
          </div>

          <div class="card">
            <div class="card-title">${es ? 'PREDICCIONES (DANIELS)' : 'PREDICTIONS (DANIELS)'}</div>
            <table class="splits-table">
              <thead><tr><th>${es ? 'Distancia' : 'Distance'}</th><th>${es ? 'Tiempo' : 'Time'}</th><th>${es ? 'Ritmo /mi' : 'Pace /mi'}</th></tr></thead>
              <tbody>
                ${RACE_DISTANCES.map(r => {
                  const sec = vdotToTime(vdot, r.meters);
                  return `<tr><td>${r.label[es ? 'es' : 'en']}</td><td class="num-cell">${fmtRaceTime(sec)}</td><td class="num-cell">${fmtPaceNoUnit(sec / (r.meters / 1609.344))}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
            <button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="calcApplyToProfile()">${es ? 'USAR COMO MI 5K ACTUAL' : 'USE AS MY CURRENT 5K'} (${secToMMSS(fiveK)})</button>
            <p style="font-size:10px; color:var(--paper-dim); margin-top:6px; line-height:1.4;">${es
              ? 'Actualiza el 5K del perfil y, con él, los paces de la tabla de abajo. Te pide confirmación.'
              : 'Updates the profile 5K and, with it, the pace table below. Asks for confirmation.'}</p>
          </div>`;
      } else {
        results = `<div class="card"><p style="font-size:12px; color:var(--signal-amber);">${es ? 'Esa prueba da un VDOT fuera de rango (20–85). Revisa distancia y tiempo.' : 'That test gives a VDOT outside 20–85. Check distance and time.'}</p></div>`;
      }

      return `
        <div class="view-container">
          <div class="sitrep-label">${es ? 'CALCULADORA DE ZONAS Y META' : 'ZONES & GOAL CALCULATOR'}</div>

          <div class="card">
            <div class="card-title">${es ? 'PRUEBA DE REFERENCIA' : 'REFERENCE TEST'}</div>
            <div class="manual-field-row">
              <label for="calcDist">${es ? 'Distancia (m)' : 'Distance (m)'}</label>
              <input type="number" id="calcDist" value="${Math.round(inp.distM)}" min="1000" step="1" inputmode="decimal" onkeydown="calcEnter(event)" />
            </div>
            <div class="manual-field-row">
              <label for="calcTime">${es ? 'Tiempo (MM:SS)' : 'Time (MM:SS)'}</label>
              <input type="text" id="calcTime" value="${fmtRaceTime(inp.timeSec)}" inputmode="numeric" autocomplete="off" onkeydown="calcEnter(event)" />
            </div>
            <p style="font-size:10px; color:var(--paper-dim); line-height:1.4; margin-bottom:12px;">${es
              ? `Mejor esfuerzo reciente con distancia real del GPS (ahora: ${miOf(inp.distM)} mi). No uses una carrera con botas o a medio esfuerzo.`
              : `Best recent effort with the real GPS distance (now: ${miOf(inp.distM)} mi). Do not use a boots race or a half-effort.`}</p>
            <div class="card-title">${es ? 'META' : 'GOAL'}</div>
            <div class="manual-field-row" style="grid-template-columns:1fr 130px;">
              <label for="calcGoalDist">${es ? 'Distancia' : 'Distance'}</label>
              <select id="calcGoalDist" style="text-align:right;">
                ${RACE_DISTANCES.map(r => `<option value="${r.meters}" ${Math.abs(r.meters - inp.goalDistM) < 1 ? 'selected' : ''}>${r.label[es ? 'es' : 'en']}</option>`).join('')}
              </select>
            </div>
            <div class="manual-field-row">
              <label for="calcGoalTime">${es ? 'Tiempo meta' : 'Goal time'}</label>
              <input type="text" id="calcGoalTime" value="${fmtRaceTime(inp.goalSec)}" inputmode="numeric" autocomplete="off" onkeydown="calcEnter(event)" />
            </div>
            <button class="btn btn-primary" style="width:100%; margin-top:6px;" onclick="calcSubmit()">${es ? 'CALCULAR' : 'CALCULATE'}</button>
          </div>

          ${results}

          ${renderPaceReferenceCard()}
          ${renderHRZoneReferenceCard()}

          <details class="card fc-details">
            <summary style="font-size:11px; color:var(--coyote); font-family:var(--font-mono);">${es ? 'CÓMO SE CALCULA' : 'HOW IT IS CALCULATED'} ▾</summary>
            <p style="font-size:10px; color:var(--paper-dim); margin-top:8px; line-height:1.5;">${es
              ? 'VDOT: fórmula de Daniels (VO2 de la velocidad media entre el % de VO2max sostenible para esa duración). Las predicciones y el VDOT requerido salen de la misma ecuación, igual que la tarjeta de predicción de carrera. Los paces objetivo son % de VDOT (E 59–74, T 83–88, I 95–100, R ≈105–110) y dependen del 5K del perfil. Todo es estimación: confirma con pruebas reales y con la FC.'
              : 'VDOT: Daniels formula (VO2 at average speed divided by the % of VO2max sustainable for that duration). Predictions and required VDOT come from the same equation as the race prediction card. Target paces are % of VDOT (E 59–74, T 83–88, I 95–100, R ≈105–110) and depend on the profile 5K. All of it is an estimate: confirm with real tests and heart rate.'}</p>
          </details>
        </div>`;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SESSION DETAIL — structured steps as a table (segment | duration | HR · pace)
    // ═══════════════════════════════════════════════════════════════════════
    const STEP_NOTE_ES = {
      'Warm-up walk': 'Caminata de calentamiento', 'Warm-up jog': 'Trote de calentamiento',
      'Warm-up + strides': 'Calentamiento + strides', 'Cool-down walk': 'Caminata de enfriamiento',
      'Cool-down jog': 'Trote de enfriamiento', 'Easy pace': 'Ritmo fácil', 'Long run pace': 'Ritmo de larga',
      'Tempo effort': 'Esfuerzo de tempo', 'Recovery jog': 'Trote de recuperación',
      'Race pace simulation': 'Simulacro a ritmo de carrera'
    };

    function stepLabel(note, step) {
      if (step && step.label) return step.label;
      if (getLang() !== 'es') return note;
      const m = /^Interval (\d+)\/(\d+)$/.exec(note);
      if (m) return 'Intervalo ' + m[1] + '/' + m[2];
      return STEP_NOTE_ES[note] || note;
    }

    function stepCue(session, step) {
      if (step.fromPlan) return step.cue || '';
      const es = getLang() === 'es';
      if (step.intensity === 'warmup') return es ? 'Sube la FC poco a poco; termina en Z1–Z2.' : 'Raise HR gradually; finish in Z1–Z2.';
      if (step.intensity === 'cooldown') return es ? 'Baja la FC; camina si hace falta.' : 'Bring HR down; walk if needed.';
      if (step.intensity === 'rest') return es ? 'Recupera la respiración antes de la próxima.' : 'Recover your breathing before the next one.';
      if (session.type === 'easy' || session.type === 'long') return es ? 'Guíate por la FC: si sube de la zona, baja el paso.' : 'Run by HR: if it rises above the zone, slow down.';
      if (session.type === 'tempo') return es ? 'Esfuerzo sostenido y controlado, sin arrancar fuerte.' : 'Sustained, controlled effort; do not start hard.';
      if (session.type === 'intervals') return es ? 'Fuerte pero repetible: la última igual que la primera.' : 'Hard but repeatable: last one as good as the first.';
      if (session.type === 'race_sim') return es ? 'Ritmo de carrera; no salgas más rápido que la meta.' : 'Race pace; do not start faster than goal.';
      return '';
    }

    function stepPaceText(session, step) {
      if (step.fromPlan) return step.paceText || '';
      if (step.intensity !== 'active') return '';
      if (session.type === 'race_sim') return activeRaceGoalPaceStr() + '/mi';
      const row = PACE_REF_ROWS.find(r => r.type === session.type && !r.effortOnly);
      if (!row) return '';
      const band = paceBandSec(row, state.profile);
      return fmtPaceNoUnit(band.fast) + '–' + fmtPaceNoUnit(band.slow) + '/mi';
    }

    function renderStepsTable(session, steps) {
      const es = getLang() === 'es';
      const lthr = state.profile?.lthr || 174;
      const COLORS = { warmup: 'var(--paper-dim)', cooldown: 'var(--paper-dim)', rest: 'var(--signal-blue)', active: 'var(--coyote)' };
      const rows = steps.map((st, i) => {
        let dur;
        if (st.durationType === 'time') dur = secToMMSS(st.durationValue);
        else if (st.durationType === 'distance') dur = (st.durationValue / 1609.344).toFixed(2) + ' mi<br><span style="color:var(--paper-dim); font-size:9px;">' + Math.round(st.durationValue) + ' m</span>';
        else dur = es ? 'Libre<br><span style="color:var(--paper-dim); font-size:9px;">botón Vuelta</span>' : 'Open<br><span style="color:var(--paper-dim); font-size:9px;">Lap button</span>';
        let hr = '';
        if (st.targetType === 'heart_rate') {
          const z = hrZoneFromBpm(Math.round((st.targetLow + st.targetHigh) / 2), lthr);
          hr = st.targetLow + '–' + st.targetHigh + ' <span style="color:' + ZONE_COLORS[z] + ';">Z' + z + '</span>';
        }
        const pace = stepPaceText(session, st);
        const cue = stepCue(session, st);
        return `
          <tr>
            <td class="num-cell">${i + 1}</td>
            <td style="border-left:3px solid ${COLORS[st.intensity] || 'var(--field-line)'}; padding-left:6px;">
              <div style="font-size:12px; font-weight:600;">${stepLabel(st.note, st)}</div>
              ${cue ? `<div style="font-size:9px; color:var(--paper-dim); margin-top:2px; line-height:1.4;">${cue}</div>` : ''}
            </td>
            <td class="num-cell" style="white-space:nowrap;">${dur}</td>
            <td style="font-size:10px; white-space:nowrap;">${hr || '—'}${pace ? `<br><span style="color:var(--coyote);">${pace.replace('/mi', '')}</span>` : ''}</td>
          </tr>`;
      }).join('');
      return `
        <table class="splits-table steps-table">
          <thead><tr><th>#</th><th>${es ? 'Segmento' : 'Segment'}</th><th>${es ? 'Duración' : 'Duration'}</th><th>${es ? 'FC · Ritmo' : 'HR · Pace'}</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function renderDashboard() {
      if (!state.profile) return renderOnboarding();

      const { profile } = state;
      const today = todayISO();
      const daysLeft = daysUntil(profile.raceDateISO);
      const todaySess = state.plan.find(s => s.dateISO === today);
      const completed = state.plan.filter(s => s.completed).length;
      const total = state.plan.filter(s => s.type !== 'rest').length;
      const pct = total ? Math.round((completed / total) * 100) : 0;
      const recentPast = state.plan.filter(s => s.dateISO < today && s.type !== 'rest').slice(-4).reverse();

      return `
        <div class="view-container">
          <div class="mission-clock">
            <div class="clock-top">
              <span class="clock-label">${t('clock_label').replace('5K', raceLabelByKey(profile.raceDistanceKey || '5k'))}</span>
              <span class="clock-coords">${fmtRaceDateShort(profile.raceDateISO)} · ${activeRaceGoalPaceStr()}/MI</span>
            </div>
            <div class="clock-main">
              <div class="clock-countdown">
                <span class="clock-number">${daysLeft}</span>
                <span class="clock-unit">${t('clock_unit')}</span>
              </div>
              <div class="clock-meta">${esc((activeRace()?.name) || raceLabelByKey(profile.raceDistanceKey || '5k'))} · ${fmtRaceTime(activeGoalSec(profile, raceMetersByKey(profile.raceDistanceKey || '5k')))}</div>
            </div>
            <div class="clock-divider"></div>
            <div class="clock-stats">
              <div class="clock-stat">
                <div class="clock-stat-val">${completed}/${total}</div>
                <div class="clock-stat-label">${t('stat_sessions')}</div>
              </div>
              <div class="clock-stat">
                <div class="clock-stat-val">${pct}%</div>
                <div class="clock-stat-label">${t('stat_complete')}</div>
              </div>
              <div class="clock-stat">
                <div class="clock-stat-val">${state.tcxSessions.length}</div>
                <div class="clock-stat-label">${t('stat_tcx_logs')}</div>
              </div>
            </div>
          </div>

          ${renderRacesStrip()}
          ${renderRecalcBanner()}
          ${renderTaperCard()}
          ${renderTodayHero()}
          ${(() => { const ts = state.plan.find(s => s.dateISO === todayISO()); return ts ? renderStrengthRecCard(ts) : ''; })()}
          ${renderGritCard()}
          ${renderRacePredictionCard()}
          ${renderACWRCard()}

          ${(() => {
            const load = getCurrentLoadStatus();
            if (!load) return '';
            return `
            <div class="card" style="cursor:pointer;" onclick="switchView('calendar')">
              <div class="card-title">${getLang()==='es' ? 'CARGA DE ENTRENAMIENTO' : 'TRAINING LOAD'}</div>
              <div class="stat-grid">
                <div class="stat-box"><div class="value">${load.ctl}</div><div class="label">CTL · ${getLang()==='es'?'Fitness':'Fitness'}</div></div>
                <div class="stat-box"><div class="value">${load.atl}</div><div class="label">ATL · ${getLang()==='es'?'Fatiga':'Fatigue'}</div></div>
                <div class="stat-box"><div class="value" style="color:${load.formColor};">${load.tsb > 0 ? '+' : ''}${load.tsb}</div><div class="label">TSB · ${getLang()==='es'?'Forma':'Form'}</div></div>
              </div>
              <p style="font-size:11px; color:${load.formColor}; margin-top:8px;">${load.formLabel}</p>
            </div>
            `;
          })()}

          <div class="sitrep-label">${t('upcoming_label')}</div>
          ${state.plan.filter(s => s.dateISO > today && s.type !== 'rest').slice(0, 4).map(s => `
            <div class="session-card" onclick="openSessionDetail(${s.day})">
              <div class="session-header">
                <div class="session-left">
                  <span class="session-tag">${sessionTag(s)}</span>
                  <div class="session-info">
                    <h3>${sessionTitle(s)}</h3>
                    <p>${s.dateISO}</p>
                  </div>
                </div>
                <div class="badge day">D${s.day}</div>
              </div>
            </div>
          `).join('')}

          ${recentPast.length > 0 ? `
            <div class="sitrep-label">${t('recent_label')}</div>
            ${recentPast.map(s => `
              <div class="session-card ${s.completed ? 'completed' : ''}" onclick="openSessionDetail(${s.day})">
                <div class="session-header">
                  <div class="session-left">
                    <span class="session-tag">${sessionTag(s)}</span>
                    <div class="session-info">
                      <h3>${sessionTitle(s)}</h3>
                      <p>${s.dateISO}${s.linkedActivityId ? ' · ' + t('linked_suffix') : ''}</p>
                    </div>
                  </div>
                  ${s.completed ? `<div class="badge">${t('badge_done')}</div>` : `<div class="badge day">D${s.day}</div>`}
                </div>
              </div>
            `).join('')}
          ` : ''}
        </div>`;
    }

    function renderTCX() {
      return `
        <div class="view-container">
          <div class="sitrep-label">${t('upload_telemetry')}</div>
          <div class="upload-zone" onclick="document.getElementById('tcxUpload').click();">
            <div class="upload-icon"></div>
            <p style="font-family: var(--font-mono); font-size: 12px; color: var(--paper); margin-bottom: 4px;">${t('select_tcx_file')}</p>
            <p style="font-family: var(--font-mono); font-size: 10px; color: var(--paper-dim);">${t('garmin_export_hint')}</p>
          </div>
          <input type="file" accept=".tcx" id="tcxUpload" multiple style="display:none;" onchange="handleTCXUpload(event)" />

          ${state.tcxSessions.length > 0 ? `
            <div class="sitrep-label">${t('activity_log')} (${state.tcxSessions.length})</div>
            ${state.tcxSessions.map(act => {
              const gradeClass = act.analysis?.sessionGrade?.replace('+', 'plus');
              const linkedSession = act.linkedPlanDay ? state.plan.find(s => s.day === act.linkedPlanDay) : null;
              const dayWord = getLang() === 'es' ? 'DÍA' : 'DAY';
              return `
              <div class="activity-list-item" onclick="openActivityDetail('${act.id}')">

    // Parse AI-generated training plan (Claude/ChatGPT format)
    // Pulls an explicit pace target out of a plan line. Accepts "11:15/mi", "pace 11:15",
    // "ritmo 11:15-11:45/mi" and returns the MIDPOINT of a range, in sec/mi.
    function parsePaceFromLine(line) {
      if (!line) return 0;
      const range = line.match(/(\d{1,2}):([0-5]\d)\s*[-–—]\s*(\d{1,2}):([0-5]\d)\s*\/?\s*(mi|mile|milla|km)?/i);
      if (range) {
        const a = parseInt(range[1]) * 60 + parseInt(range[2]);
        const b = parseInt(range[3]) * 60 + parseInt(range[4]);
        return Math.round((a + b) / 2);
      }
      const single = line.match(/(?:pace|ritmo)?\s*(\d{1,2}):([0-5]\d)\s*\/\s*(mi|mile|milla)/i);
      if (single) return parseInt(single[1]) * 60 + parseInt(single[2]);
      return 0;
    }

    // Target pace for a session type from the athlete's own settings: an explicit override if
    // they set one, otherwise the midpoint of the pace-reference band for their current fitness.
    function targetPaceForType(type) {
      const override = state.paceOverrides?.[type];
      if (override > 0) return Math.round(override);
      const row = PACE_REF_ROWS.find(r => r.type === type);
      if (!row || row.effortOnly) return 0;
      const band = paceBandSec(row, state.profile);
      return Math.round((band.fast + band.slow) / 2);
    }

    function parseClaudePlan(text) {
      const dayMap = { 'mon': 0, 'lun': 0, 'tue': 1, 'mar': 1, 'wed': 2, 'mié': 2, 'thu': 3, 'jue': 3, 'fri': 4, 'vie': 4, 'sat': 5, 'sab': 5, 'sáb': 5, 'sun': 6, 'dom': 6 };
      const typeMap = {
        easy: 'easy', fácil: 'easy', facil: 'easy', 'z1-z2': 'easy',
        tempo: 'tempo', 'z3-z4': 'tempo', 'threshold': 'tempo',
        intervals: 'intervals', intervalos: 'intervals', 'z4-z5': 'intervals', '800': 'intervals', '1600': 'intervals',
        long: 'long', 'long run': 'long', 'largas': 'long',
        rest: 'rest', descanso: 'rest', recovery: 'rest',
        cross: 'cross_training', 'cross-training': 'cross_training', cruzado: 'cross_training'
      };

      const sessions = {};
      const lines = text.split('\n').filter(l => l.trim());

      lines.forEach(line => {
        const lowerLine = line.toLowerCase();
        let dayIndex = -1;
        let dayName = '';

        // Extract day
        for (const [key, idx] of Object.entries(dayMap)) {
          if (lowerLine.includes(key)) { dayIndex = idx; dayName = key; break; }
        }
        if (dayIndex === -1) return;

        // Extract session type
        let sessionType = 'easy';
        for (const [key, type] of Object.entries(typeMap)) {
          if (lowerLine.includes(key)) { sessionType = type; break; }
        }

        // Extract distance/duration (look for "5 miles", "10k", "30 min", etc.)
        const distMatch = line.match(/(\d+\.?\d*)\s*(miles?|km|k)/i);
        const durMatch = line.match(/(\d+)\s*min/i);
        // Don't guess a distance when the line doesn't state one — a rest/cross day with no
        // explicit distance should stay distance-less, not silently inherit an invented "5 mi".
        let distMi = distMatch ? parseFloat(distMatch[1]) * (distMatch[2].toLowerCase().includes('k') ? 0.621371 : 1) : null;
        if (sessionType === 'rest' || sessionType === 'cross_training') distMi = null;

        // NOTE: "dayOfWeek" here is a Mon=0..Sun=6 index, purely for locating which day of THIS
        // calendar week the session belongs to. It is intentionally kept separate from the
        // auto-generated plan's `day` field, which is a sequential day-of-program counter
        // (1, 2, 3, ...) — the two are on different scales and must never be compared directly.
        sessions[dayIndex] = {
          dayOfWeek: dayIndex,
          type: sessionType,
          distMi: distMi > 0 ? distMi : null,
          durationMin: durMatch ? parseInt(durMatch[1]) : (distMi > 0 ? Math.round(distMi * 10) : 30),
          notes: line
        };
      });

      return Object.values(sessions).sort((a, b) => a.dayOfWeek - b.dayOfWeek);
    }

    // Import plan from Claude/ChatGPT and merge into current plan
    function importClaudePlan(planText) {
      try {
        const newSessions = parseClaudePlan(planText);
        if (!newSessions || newSessions.length === 0) {
          showToast(t('claude_import_error'));
          return;
        }

        // Anchor to the Monday of THIS calendar week (same logic renderCalendarView uses),
        // so "Monday" in the pasted plan always lands on this week's real Monday date —
        // regardless of where that date falls in the auto-generated plan's day-of-program counter.
        const todayDate = parseISODateLocal(todayISO());
        const dow = todayDate.getDay(); // JS convention: 0=Sun..6=Sat
        const mondayOffset = dow === 0 ? -6 : 1 - dow;
        const monday = new Date(todayDate);
        monday.setDate(todayDate.getDate() + mondayOffset);

        let maxDay = state.plan.length ? Math.max(...state.plan.map(s => s.day || 0)) : 0;

        newSessions.forEach(session => {
          const d = new Date(monday);
          d.setDate(monday.getDate() + session.dayOfWeek);
          const dateISO = d.toISOString().split('T')[0];

          // ── Derive the targets "Planeado vs Real" compares against ──────
          // A rest day has nothing to hit, so it stays blank on purpose.
          const isRestDay = session.type === 'rest';
          const pacePerMi = isRestDay ? 0
            : (parsePaceFromLine(session.notes || session.raw || '') || targetPaceForType(session.type));

          let distMi = session.distMi;
          // Duration-only sessions ("tempo 20 min") still have an implied distance once a target
          // pace is known — without it the comparison has nothing to measure.
          if (!distMi && !isRestDay && session.durationMin > 0 && pacePerMi > 0) {
            distMi = +((session.durationMin * 60) / pacePerMi).toFixed(2);
          }
          const targetDistM = distMi ? Math.round(distMi * 1609.344) : 0;
          const targetTimeSec = isRestDay ? 0
            : (targetDistM > 0 && pacePerMi > 0
                ? Math.round((targetDistM / 1609.344) * pacePerMi)
                : Math.round((session.durationMin || 0) * 60));

          // Match by the actual calendar date, never by the ambiguous `day` counter —
          // that field means something different in the auto-generated 66-day plan (a
          // sequential day-of-program number) than it does here (a weekday index).
          // IMPORTANT: always overwrite dist/targetDistM/targetTimeSec unconditionally (not just
          // when a new value is present) — otherwise a bad value written by an earlier broken
          // import (e.g. a guessed "5 mi" on a rest day) stays stuck forever, since a later,
          // correct import that specifies no distance would silently "preserve" the stale one.
          const existing = state.plan.find(s => s.dateISO === dateISO);
          if (existing) {
            existing.type = session.type;
            existing.dist = distMi ? `${distMi} mi` : '—';
            existing.targetDistM = targetDistM;
            existing.pacePerMi = pacePerMi;
            existing.paceGuide = pacePerMi > 0 ? fmtPace(pacePerMi) : '—';
            existing.targetTimeSec = targetTimeSec;
            existing.targetDurationMin = session.durationMin || 0;
            existing.substeps = buildSubsteps(session.type);
            existing.notes = session.notes;
          } else {
            maxDay += 1;
            state.plan.push({
              day: maxDay, dateISO, type: session.type,
              pacePerMi, paceGuide: pacePerMi > 0 ? fmtPace(pacePerMi) : '—',
              dist: distMi ? `${distMi} mi` : '—', targetDistM,
              targetTimeSec,
              targetDurationMin: session.durationMin || 0,
              phase: 1,
              completed: false, rating: null,
              substeps: buildSubsteps(session.type),
              linkedActivityId: null,
              notes: session.notes
            });
          }
        });

        state.plan.sort((a, b) => (a.dateISO || '').localeCompare(b.dateISO || ''));
        saveState();
        render();
        showToast(t('claude_import_success'));
      } catch (e) {
        console.error('Plan import error:', e);
        showToast(t('claude_import_error'));
      }
    }

    function editPaceOverride(sessionType, currentOverrideSec, autoCalcSec) {
      const newPaceStr = prompt(getLang() === 'es' ? 'Nuevo pace (MM:SS/mi):' : 'New pace (MM:SS/mi):', currentOverrideSec ? fmtPaceNoUnit(currentOverrideSec) : fmtPaceNoUnit(autoCalcSec));
      if (!newPaceStr) return;
      
      const parts = newPaceStr.split(':');
      if (parts.length !== 2) { showToast(getLang() === 'es' ? 'Formato inválido' : 'Invalid format'); return; }
      const newSec = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      
      state.paceOverrides = state.paceOverrides || {};
      state.paceOverrides[sessionType] = newSec;
      saveState();
      
      // Evaluate and show
      const eval_ = evaluatePaceOverride(sessionType, newSec, autoCalcSec);
      const evalDiv = document.getElementById('paceOverrideEval');
      if (evalDiv) {
        const riskColor = eval_.riskLevel === 'high' ? 'var(--rust)' : (eval_.riskLevel === 'medium' ? 'var(--signal-amber)' : 'var(--signal-blue)');
        const recTitle = getLang() === 'es' ? 'Evaluación: ' : 'Evaluation: ';
        const reasonsHTML = eval_.reasons.map(r => '• ' + r).join('<br/>');
        evalDiv.innerHTML = '<div style="border-left:3px solid ' + riskColor + '; padding-left:10px; color:' + riskColor + ';">' +
          '<strong>' + recTitle + eval_.recommendation.toUpperCase() + '</strong><br/>' +
          reasonsHTML +
          '</div>';
        evalDiv.style.display = 'block';
      }
      
      render();
    }

                      <p style="font-size:10px; color:var(--paper-dim); margin-top:4px; line-height:1.4;">${adj.advice}</p>

    function renderSplitsTable(splits, unit) {
      if (!splits || !splits.length) return `<p style="font-size:12px; color: var(--paper-dim);">${getLang() === 'es' ? 'Sin splits disponibles.' : 'No splits available.'}</p>`;
      return `
        <table class="splits-table">
          <thead><tr><th>#</th><th>${getLang() === 'es' ? 'PACE' : 'PACE'}</th><th>FC</th><th>${getLang() === 'es' ? 'CAD' : 'CAD'}</th><th>ELEV</th></tr></thead>
          <tbody>
            ${splits.map(s => `
              <tr>
                <td class="num-cell">${s.splitNum}${s.partial ? '*' : ''}</td>
                <td>${fmtPace(s.paceSecPerUnit)}</td>
                <td>${s.avgHR ? Math.round(s.avgHR) : '—'}</td>
                <td>${s.avgCadence ? Math.round(s.avgCadence) : '—'}</td>
                <td>+${s.elevGainM}/-${s.elevLossM}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${splits.some(s => s.partial) ? `<p style="font-size:9px; color:var(--paper-dim); margin-top:6px;">* ${getLang() === 'es' ? 'split final parcial' : 'partial final split'}</p>` : ''}
      `;
    }

    function renderFatigueBlock(activity) {
      const { history, sameTypeOnly } = buildFatigueHistory(activity);
      const fatigue = calcFatigueIndex({ avgHR: activity.avgHR, avgPaceSecPerMi: activity.avgPaceSecPerMi }, history);
      fatigue.sameTypeOnly = sameTypeOnly;

      if (!fatigue.available) {
        return `<p style="font-size:12px; color: var(--paper-dim);">${t(fatigue.reasonKey)}</p>`;
      }

      const signalKeys = {
        normal: 'signal_normal', fresh: 'signal_fresh', elevated_fatigue: 'signal_elevated', high_fatigue: 'signal_high'
      };
      const signalColor = {
        normal: 'var(--paper)', fresh: 'var(--olive-bright)', elevated_fatigue: 'var(--signal-amber)', high_fatigue: 'var(--rust-bright)'
      }[fatigue.signal];

      return `
        <div class="stat-grid">
          <div class="stat-box"><div class="value">${fatigue.baselineAvgHR} bpm</div><div class="label">${t('baseline_hr_label')} ${fatigue.sessionsCompared})</div></div>
          <div class="stat-box"><div class="value" style="color:${signalColor};">${t(signalKeys[fatigue.signal])}</div><div class="label">${t('signal_label')}</div></div>
        </div>
        <p style="font-size: 12px; color: var(--paper-dim); margin-top: 8px;">
          ${t('hr_delta_text')}: ${fatigue.hrDeltaBpm > 0 ? '+' : ''}${fatigue.hrDeltaBpm} bpm vs baseline ·
          ${t('pace_delta_text')}: ${fatigue.paceDeltaSec > 0 ? '+' : ''}${fatigue.paceDeltaSec}s/mi (${fatigue.paceDeltaSec > 0 ? t('slower_text') : t('faster_text')})
        </p>
        <p style="font-size: 10px; color: var(--paper-dim); margin-top: 6px; font-style: italic;">
          ${fatigue.sameTypeOnly
            ? (getLang() === 'es' ? 'Comparado solo contra sesiones del mismo tipo.' : 'Compared against same session type only.')
            : (getLang() === 'es' ? '⚠ Comparado contra sesiones de tipos mixtos — interpreta con cautela.' : '⚠ Compared against mixed session types — interpret with caution.')}
        </p>
      `;
    }

    function renderPlanVsActualBlock(plannedSession, activity) {
      // Same rows as the Markdown report (planVsActualRows), so the card and the export agree.
      if (normalizeSessionType(plannedSession.type) !== 'rest') {
        let rows = [];
        try { rows = planVsActualRows(plannedSession, activity); } catch (e) { console.warn(e); }
        if (rows.length) {
          const cls = v => v === 'En objetivo' ? 'delta-good' : v === 'Informativo' ? 'delta-neutral' : 'delta-bad';
          const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
          return `
        <div class="sitrep-label">${t('planned_vs_actual_label')}</div>
        <div class="card">
          ${rows.map(r => `
          <div class="compare-row">
            <div class="compare-label">${esc(r[0])}</div>
            <div class="compare-planned">${esc(r[1])}</div>
            <div class="compare-arrow">→</div>
            <div class="compare-actual">${esc(r[2])}</div>
            <div class="compare-delta ${cls(r[4])}">${esc(r[4])}${r[3] && r[3] !== '—' ? ' · ' + esc(r[3]) : ''}</div>
          </div>`).join('')}
          ${activity.analysis?.workSegment ? `<p style="font-size:10px;color:var(--paper-dim);margin-top:6px;">${getLang()==='es' ? 'Ritmo, FC y zonas: bloque de trabajo. Distancia y duración: sesión completa.' : 'Pace, HR and zones: work block. Distance and duration: whole session.'}</p>` : ''}
        </div>`;
        }
      }
      const targetPace = plannedSession.pacePerMi;
      const actualPace = activity.avgPaceSecPerMi;
      const paceDelta = actualPace - targetPace;
      const targetDistMi = plannedSession.targetDistM / 1609.344;
      const distDelta = activity.totalDistMi - targetDistMi;

      const paceDeltaClass = Math.abs(paceDelta) < 10 ? 'delta-neutral' : (paceDelta < 0 ? 'delta-good' : 'delta-bad');
      const distDeltaClass = Math.abs(distDelta) < 0.15 ? 'delta-neutral' : (distDelta >= 0 ? 'delta-good' : 'delta-bad');

      return `
        <div class="sitrep-label">${t('planned_vs_actual_label')}</div>
        <div class="card">
          <div class="compare-row">
            <div class="compare-label">${t('pace_target_vs_actual')}</div>
            <div class="compare-planned">${fmtPace(targetPace)}</div>
            <div class="compare-arrow">→</div>
            <div class="compare-actual">${fmtPace(actualPace)}</div>
            <div class="compare-delta ${paceDeltaClass}">${paceDelta > 0 ? '+' : ''}${Math.round(paceDelta)}s/mi ${paceDelta > 0 ? t('slower_text') : t('faster_text')} ${t('vs_target')}</div>
          </div>
          <div class="compare-row">
            <div class="compare-label">${t('dist_target_vs_actual')}</div>
            <div class="compare-planned">${targetDistMi.toFixed(2)} mi</div>
            <div class="compare-arrow">→</div>
            <div class="compare-actual">${activity.totalDistMi.toFixed(2)} mi</div>
            <div class="compare-delta ${distDeltaClass}">${distDelta > 0 ? '+' : ''}${distDelta.toFixed(2)} mi ${t('vs_plan')}</div>
          </div>
        </div>
      `;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SESSION DETAIL — plan day with substeps + linked activity comparison
    // ═══════════════════════════════════════════════════════════════════════

    function renderSessionDetail(day) {
      const s = state.plan.find(p => p.day === day);
      if (!s) return '<div class="view-container"><p>Session not found.</p></div>';

      const linkedActivity = s.linkedActivityId ? state.tcxSessions.find(act => act.id === s.linkedActivityId) : null;
      const unlinkedActivities = state.tcxSessions.filter(act => !act.linkedPlanDay || act.linkedPlanDay === day);
      const cfg = sessionTag(s);
      const info = getWorkoutInfo(s.type);
      const structuredSteps = s.type !== 'rest' ? generateStructuredSteps(s, state.profile?.lthr || 174) : [];
      const dayWord = getLang() === 'es' ? 'DÍA' : 'DAY';

      return `
        <div class="detail-overlay">
          <div class="detail-header">
            <button class="detail-back" onclick="closeDetail()">←</button>
            <div class="detail-header-title">${dayWord} ${s.day} · ${cfg}</div>
            ${s.completed ? `<div class="badge">${t('badge_done')}</div>` : ''}
          </div>
          <div class="detail-body">

            <div class="card">
              <div class="card-title">${sessionTitle(s)}</div>
              <div class="date-picker-row">
                <label class="form-label" style="margin:0;">${t('date_label')}</label>
                <input type="date" value="${s.dateISO}" onchange="updateSessionDate(${s.day}, this.value)" />
              </div>
              <div class="stat-grid">
                ${(() => { const h = sessionHeadline(s); return `<div class="stat-box"><div class="value">${h.big}</div><div class="label">${h.label}</div></div>`; })()}
                <div class="stat-box"><div class="value">${s.dist}</div><div class="label">${t('target_distance_label')}</div></div>
              </div>
              ${renderGearRecLine(s)}
            </div>

            ${renderStrengthRecCard(s, true)}

            ${s.notes ? `
            <div class="sitrep-label">${getLang() === 'es' ? 'INSTRUCCIÓN DEL PLAN' : 'PLAN INSTRUCTION'}</div>
            <div class="card" style="border-left: 3px solid var(--coyote);">
              <p style="font-size:13px; color: var(--paper); line-height:1.6;">${sessionTitle(s)}</p>
            </div>
            ` : ''}

            ${(s.type !== 'rest' && !s.notes) ? `
            <div class="sitrep-label">${t('what_to_do_label')}</div>
            <div class="card">
              <p style="font-size:13px; color: var(--paper); line-height:1.6;">${tr(info.whatToDo)}</p>
            </div>

            <div class="sitrep-label">${t('how_to_do_label')}</div>
            <div class="card">
              ${info.howToDo.map((line, i) => `
                <div class="finding-line" style="${i > 0 ? 'border-top: 1px solid var(--field-line);' : ''} padding: 8px 0;">
                  <span style="color: var(--coyote);">→</span>
                  <span style="color: var(--paper); font-size:13px;">${tr(line)}</span>
                </div>
              `).join('')}
            </div>

            <div class="sitrep-label">${t('coach_tips_label')}</div>
            <div class="card">
              ${info.tips.map((line, i) => `
                <div class="finding-line finding-pos" style="${i > 0 ? 'border-top: 1px solid var(--field-line);' : ''} padding: 8px 0;">
                  <span>◆</span>
                  <span style="font-size:13px;">${tr(line)}</span>
                </div>
              `).join('')}
            </div>
            ` : ''}

            ${s.type !== 'rest' ? `
            <div class="sitrep-label">${t('why_matters_label')}</div>
            <div class="card" style="background: rgba(201,169,97,0.06); border-color: var(--coyote-dim);">
              <p style="font-size:13px; color: var(--paper); line-height:1.6;">${tr(info.benefit)}</p>
            </div>

            ${structuredSteps.planParsed === 'none' ? '' : `
            <div class="sitrep-label">${t('structured_steps_label')}</div>
            <div class="card">
              ${structuredSteps.planParsed === 'exact' ? `<p style="font-size:10px; color:var(--olive-bright); margin-bottom:8px;">${getLang()==='es' ? '✓ Pasos leídos de la línea del plan.' : '✓ Steps read from the plan line.'}</p>` : ''}
              ${structuredSteps.planParsed === 'approx' ? `<p style="font-size:11px; color:var(--signal-amber); margin-bottom:8px; line-height:1.5;">${getLang()==='es' ? '⚠ Esta línea del plan no se puede convertir en pasos exactos. Corre con la instrucción del plan; no se exporta al reloj.' : '⚠ This plan line cannot be turned into exact steps. Follow the plan instruction; not exported to the watch.'}</p>` : ''}
              ${renderStepsTable(s, structuredSteps)}
              ${structuredSteps.planParsed === 'approx' ? '' : `
              <button class="btn btn-primary" style="width:100%; margin-top: 14px;" onclick="exportSessionToGarmin(${s.day})">
                ${t('export_garmin_btn')}
              </button>
              <p style="font-size:10px; color: var(--paper-dim); margin-top:8px; line-height:1.5;">
                ${t('export_garmin_hint')}
              </p>`}
            </div>`}
            ` : ''}

            <div class="sitrep-label">${t('expected_to_happen_label')}</div>
            <div class="card">
              ${s.substeps.map((step, i) => `
                <div class="substep-item" onclick="toggleSubstep(${s.day}, ${i})">
                  <div class="substep-check ${step.done ? 'checked' : ''}">${step.done ? '✓' : ''}</div>
                  <div class="substep-text ${step.done ? 'done' : ''}">${step.text}</div>
                </div>
              `).join('')}
            </div>

            <div class="card">
              <div class="card-title">${t('link_telemetry_label')}</div>
              ${linkedActivity ? `
                <p style="font-size:13px; color: var(--paper); margin-bottom: 10px;">
                  ${t('linked_to_activity_from')} <strong>${linkedActivity.dateISO}</strong> — ${linkedActivity.totalDistMi.toFixed(2)} mi
                </p>
                <button class="btn btn-secondary" style="width:100%; margin-bottom:8px;" onclick="openActivityDetail('${linkedActivity.id}')">${t('view_activity_detail')}</button>
                <button class="btn btn-secondary" style="width:100%;" onclick="unlinkSessionActivity(${s.day})">${t('unlink')}</button>
              ` : `
                <select class="link-session-select" id="sessLinkSelect-${s.day}">
                  <option value="">${t('select_uploaded_activity')}</option>
                  ${unlinkedActivities.map(act => `<option value="${act.id}">${act.dateISO} · ${act.totalDistMi.toFixed(2)} mi · ${fmtPace(act.avgPaceSecPerMi)}</option>`).join('')}
                </select>
                <button class="btn btn-primary" style="width:100%;" onclick="linkActivityToSession(document.getElementById('sessLinkSelect-${s.day}').value, ${s.day})" ${unlinkedActivities.length === 0 ? 'disabled' : ''}>${t('link_activity')}</button>
                ${unlinkedActivities.length === 0 ? `<p style="font-size:11px; color: var(--paper-dim); margin-top:8px;">${t('no_unlinked_activities')}</p>` : ''}
              `}
            </div>

            ${linkedActivity ? renderPlanVsActualBlock(s, linkedActivity) : ''}

            <div class="card">
              <div class="card-title">${t('mark_complete_label')}</div>
              <div style="display:flex; gap:6px; margin-bottom: 12px;">
                ${[1,2,3,4,5].map(r => `
                  <button class="btn-small" style="flex:1; ${s.rating === r ? 'border-color:var(--coyote); color:var(--coyote);' : ''}" onclick="setSessionRating(${s.day}, ${r})">${r}</button>
                `).join('')}
              </div>
              <button class="btn ${s.completed ? 'btn-secondary' : 'btn-primary'}" style="width:100%;" onclick="toggleSessionComplete(${s.day})">
                ${s.completed ? t('mark_incomplete_btn') : t('mark_complete_btn')}
              </button>
            </div>

          </div>
        </div>`;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // STRENGTH — routines A and B from the November plan (2026.10.28). Equipment on hand:
    // dumbbells up to 25 lb, 10 lb kettlebell, band up to 50 lb, step. No bench, bar or machine.
    // Strength shows ONLY on days whose plan line says "fuerza A/B" (or "sesión A/B").
    // ═══════════════════════════════════════════════════════════════════════
    const STRENGTH_LIBRARY = {
      A: {
        name: { es: 'Fuerza A · lunes, después de la calidad', en: 'Strength A · Monday, after quality' },
        why: { es: 'Piernas para las bajadas del 10K, cadera estable y empuje para el AFT.', en: 'Legs for the 10K downhills, stable hips and pushing strength for the AFT.' },
        exercises: [
          { name: { es: 'Sentadilla goblet, bajando en 3 s', en: 'Goblet squat, 3 s lowering' }, sets: '3×8–10', load: { es: 'Mancuerna de 25 lb al pecho', en: '25 lb dumbbell at chest' }, tip: { es: 'Cuádriceps y glúteos. La bajada lenta prepara las piernas para las bajadas del recorrido.', en: 'Quads and glutes. Slow lowering prepares the legs for the course downhills.' } },
          { name: { es: 'Bajada en el escalón con una pierna (3–4 s)', en: 'Single-leg step-down (3–4 s)' }, sets: '3×8 por pierna', load: { es: 'Peso corporal · escalón', en: 'Bodyweight · step' }, tip: { es: 'Control de la rodilla y cuádriceps de una pierna: así se baja corriendo.', en: 'Knee control and single-leg quads: how you run downhill.' } },
          { name: { es: 'Peso muerto rumano', en: 'Romanian deadlift' }, sets: '3×10', load: { es: '2 mancuernas de 25 lb', en: '2 × 25 lb dumbbells' }, tip: { es: 'Isquiotibiales y glúteos. Protege rodillas y espalda baja y mejora el empuje.', en: 'Hamstrings and glutes. Protects knees and low back, improves push-off.' } },
          { name: { es: 'Puente de glúteo a una pierna', en: 'Single-leg glute bridge' }, sets: '3×10 por pierna', load: { es: 'Peso corporal', en: 'Bodyweight' }, tip: { es: 'Glúteo: estabiliza la pelvis en cada zancada.', en: 'Glutes: stabilises the pelvis every stride.' } },
          { name: { es: 'Plancha lateral', en: 'Side plank' }, sets: '3×30 s por lado', load: { es: 'Peso corporal', en: 'Bodyweight' }, tip: { es: 'Core lateral: evita que la cadera caiga al correr y con chaleco.', en: 'Lateral core: keeps the hip from dropping when running and rucking.' } },
          { name: { es: 'Flexiones', en: 'Push-ups' }, sets: '2×15', load: { es: 'Peso corporal', en: 'Bodyweight' }, tip: { es: 'Mantiene la fuerza de empuje para el AFT.', en: 'Keeps pushing strength for the AFT.' } }
        ]
      },
      B: {
        name: { es: 'Fuerza B · viernes (jueves en la semana 2)', en: 'Strength B · Friday (Thursday in week 2)' },
        why: { es: 'Fuerza de una pierna, potencia para las cuestas, Aquiles y espalda alta para el chaleco.', en: 'Single-leg strength, hill power, Achilles and upper back for the vest.' },
        exercises: [
          { name: { es: 'Sentadilla dividida con mancuernas', en: 'Dumbbell split squat' }, sets: '3×8 por pierna', load: { es: 'Mancuernas', en: 'Dumbbells' }, tip: { es: 'Fuerza de una pierna; corrige desbalances. Pasa a búlgara (pie atrás en el escalón) en la semana 3 si no hay molestias.', en: 'Single-leg strength; fixes imbalances. Move to Bulgarian (rear foot on step) in week 3 if pain-free.' } },
          { name: { es: 'Subida al escalón con mancuerna', en: 'Dumbbell step-up' }, sets: '3×8 por pierna', load: { es: 'Mancuerna · escalón', en: 'Dumbbell · step' }, tip: { es: 'Potencia para las cuestas.', en: 'Power for the hills.' } },
          { name: { es: 'Elevación de talón a una pierna, bajando lento', en: 'Single-leg calf raise, slow lowering' }, sets: '3×12', load: { es: 'Peso corporal · escalón', en: 'Bodyweight · step' }, tip: { es: 'Pantorrilla y tendón de Aquiles: absorben el impacto en las bajadas y en la marcha.', en: 'Calf and Achilles: absorb impact on downhills and rucks.' } },
          { name: { es: 'Caminata lateral con banda', en: 'Banded lateral walk' }, sets: '3×12 pasos por lado', load: { es: 'Banda', en: 'Band' }, tip: { es: 'Glúteo medio: controla la rodilla (ayuda con el colapso medial del pie izquierdo).', en: 'Glute medius: knee control (helps the left foot medial collapse).' } },
          { name: { es: 'Remo con mancuerna', en: 'Dumbbell row' }, sets: '3×10 por brazo', load: { es: 'Mancuerna', en: 'Dumbbell' }, tip: { es: 'Espalda alta: sostener el chaleco y la postura.', en: 'Upper back: carrying the vest and posture.' } },
          { name: { es: 'Bicho muerto', en: 'Dead bug' }, sets: '3×8 por lado', load: { es: 'Peso corporal', en: 'Bodyweight' }, tip: { es: 'Core: protege la espalda baja con carga.', en: 'Core: protects the low back under load.' } }
        ]
      }
    };

    // Reads the plan line: "Luego fuerza A", "fuerza B en la tarde", "fuerza introductoria (sesión B a 2 series)".
    function strengthForSession(session) {
      const txt = String(session?.notes || '').toLowerCase();
      if (!txt || !/fuerza/.test(txt)) return null;
      const k = /fuerza\s+([ab])\b/.exec(txt) || /sesi[oó]n\s+([ab])\b/.exec(txt);
      if (!k) return null;
      const n = /a\s+(\d)\s+series/.exec(txt);
      return { key: k[1].toUpperCase(), sets: n ? +n[1] : null };
    }
    // "3×8 por pierna" → "2×8 por pierna" when the line says "a 2 series".
    const strengthSets = (sets, n) => {
      let out = n ? String(sets).replace(/^\d+×/, n + '×') : String(sets);
      if (getLang() !== 'es') out = out.replace(' pasos por lado', ' steps per side').replace(' por pierna', ' per leg').replace(' por lado', ' per side').replace(' por brazo', ' per arm');
      return out;
    };
    // Project rule: strength never the day before a quality session.
    function strengthBeforeQuality(session) {
      if (!session?.dateISO) return false;
      const next = state.plan.find(p => p.dateISO === addDaysISO(session.dateISO, 1));
      return !!next && ['tempo', 'intervals', 'race_sim'].includes(next.type);
    }

    function strengthTableHtml(catKey, opts) {
      opts = opts || {};
      const es = getLang() === 'es';
      const cat = STRENGTH_LIBRARY[catKey];
      if (!cat) return '';
      return `
        <div style="margin-top:10px;">
          <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:1px; color:var(--coyote); text-transform:uppercase; margin-bottom:4px;">${tr(cat.name)}</div>
          ${opts.why ? `<p style="font-size:11px; color:var(--paper-dim); margin-bottom:6px; line-height:1.5;">${tr(cat.why)}</p>` : ''}
          <table class="splits-table">
            <thead>
              <tr>
                <th>${es ? 'Ejercicio' : 'Exercise'}</th>
                <th>${es ? 'Series×Rep.' : 'Sets×Reps'}</th>
                <th>${es ? 'Carga' : 'Load'}</th>
              </tr>
            </thead>
            <tbody>
              ${cat.exercises.map(ex => `
                <tr>
                  <td style="font-size:11px;">
                    <details class="fc-details">
                      <summary>${tr(ex.name)} <span style="color:var(--paper-dim);">▾</span></summary>
                      <div style="font-size:10px; color:var(--paper-dim); margin-top:4px; line-height:1.5;">→ ${tr(ex.tip)}</div>
                    </details>
                  </td>
                  <td class="num-cell" style="white-space:nowrap; font-size:11px;">${strengthSets(ex.sets, opts.sets)}</td>
                  <td style="font-size:10px; color:var(--paper-dim);">${tr(ex.load)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    // Two-column table for the weekly calendar (all exercises of the routine).
    function strengthCompactTable(cats, setsN) {
      const es = getLang() === 'es';
      return `
        <table class="splits-table">
          <thead><tr><th>${es ? 'Ejercicio' : 'Exercise'}</th><th>${es ? 'Series×Rep.' : 'Sets×Reps'}</th></tr></thead>
          <tbody>
            ${cats.map(k => {
              const c = STRENGTH_LIBRARY[k];
              if (!c) return '';
              return c.exercises.map(e => `<tr><td style="font-size:11px;">${tr(e.name)}</td><td class="num-cell" style="white-space:nowrap; font-size:11px;">${strengthSets(e.sets, setsN)}</td></tr>`).join('');
            }).join('')}
          </tbody>
        </table>`;
    }

    const STRENGTH_RULES = {
      es: '~25 min, esfuerzo 6–7 de 10: deja 2–3 repeticiones en reserva y nunca llegues al fallo.',
      en: '~25 min, effort 6–7/10: leave 2–3 reps in reserve, never to failure.'
    };

    // Home (collapsed), session detail and Strength tab (open). Takes the plan SESSION, not a type.
    function renderStrengthRecCard(session, open) {
      const es = getLang() === 'es';
      const r = strengthForSession(session);
      if (!r || !STRENGTH_LIBRARY[r.key]) return '';
      const total = STRENGTH_LIBRARY[r.key].exercises.length;
      const warn = strengthBeforeQuality(session);
      return `
        <div class="card" style="border-left:3px solid ${warn ? 'var(--rust-bright)' : 'var(--olive-bright)'};">
          <details class="fc-details" ${open ? 'open' : ''}>
            <summary style="display:flex; justify-content:space-between; align-items:center;">
              <span class="card-title" style="margin:0;">${es ? 'FUERZA ' : 'STRENGTH '}${r.key}${r.sets ? (es ? ` · ${r.sets} SERIES` : ` · ${r.sets} SETS`) : ''}</span>
              <span style="font-size:10px; color:var(--paper-dim);">${total} ${es ? 'ejercicios' : 'exercises'} ▾</span>
            </summary>
            ${warn ? `<p style="font-size:11px; color:var(--rust-bright); margin:8px 0 2px; line-height:1.4;">${es ? '⚠ Mañana hay sesión de calidad: la fuerza nunca va el día antes. Muévela.' : '⚠ Quality session tomorrow: strength never goes the day before. Move it.'}</p>` : ''}
            <p style="font-size:11px; color:var(--paper-dim); margin:8px 0 2px; line-height:1.4;">${STRENGTH_RULES[es ? 'es' : 'en']}</p>
            ${strengthTableHtml(r.key, { sets: r.sets })}
            <div style="text-align:right; margin-top:8px;"><span style="font-size:10px; color:var(--coyote); cursor:pointer;" onclick="switchView('strength')">${es ? 'ver rutinas A y B →' : 'see routines A and B →'}</span></div>
          </details>
        </div>`;
    }

    let strengthFilter = 'all';
    function setStrengthFilter(cat) { strengthFilter = cat; render(); }

    function renderStrengthView() {
      const es = getLang() === 'es';
      const today = todayISO();
      const todaySess = state.plan.find(s => s.dateISO === today);
      const todayCard = todaySess ? renderStrengthRecCard(todaySess, true) : '';
      const nextSess = state.plan.filter(s => s.dateISO > today && strengthForSession(s)).sort((a, b) => a.dateISO.localeCompare(b.dateISO))[0];
      const nextR = nextSess ? strengthForSession(nextSess) : null;
      const fmtDay = (iso) => parseISODateLocal(iso).toLocaleDateString(es ? 'es-PR' : 'en-US', { weekday: 'short', day: 'numeric', month: 'short' });
      const activeFilter = strengthFilter || 'all';
      const catKeys = Object.keys(STRENGTH_LIBRARY);
      const filtered = activeFilter === 'all' ? catKeys : catKeys.filter(k => k === activeFilter);

      return `
        <div class="view-container">
          <div class="sitrep-label">${es ? 'FUERZA · RUTINAS A Y B' : 'STRENGTH · ROUTINES A AND B'}</div>

          ${todayCard || `<div class="card"><p style="font-size:12px; color:var(--paper-dim);">${es ? 'Hoy no toca fuerza.' : 'No strength today.'}${nextR ? (es ? ` Próxima: <strong style="color:var(--paper);">${fmtDay(nextSess.dateISO)} · fuerza ${nextR.key}${nextR.sets ? ` (${nextR.sets} series)` : ''}</strong>.` : ` Next: <strong style="color:var(--paper);">${fmtDay(nextSess.dateISO)} · strength ${nextR.key}</strong>.`) : ''}</p></div>`}

          <div style="display:flex; gap:6px; overflow-x:auto; margin:14px 0 4px; padding-bottom:4px;">
            <button class="btn-small" style="white-space:nowrap; ${activeFilter==='all'?'border-color:var(--coyote);color:var(--coyote);':''}" onclick="setStrengthFilter('all')">${es?'Ambas':'Both'}</button>
            ${catKeys.map(k => `
              <button class="btn-small" style="white-space:nowrap; ${activeFilter===k?'border-color:var(--coyote);color:var(--coyote);':''}" onclick="setStrengthFilter('${k}')">${es ? 'Fuerza ' : 'Strength '}${k}</button>
            `).join('')}
          </div>

          ${filtered.map(key => `<div class="card" style="margin-bottom:10px;">${strengthTableHtml(key, { why: true })}</div>`).join('')}

          <div class="card" style="background:rgba(61,90,31,0.1); border-color:var(--olive);">
            <div class="card-title">${es?'REGLAS':'RULES'}</div>
            <p style="font-size:12px; color:var(--paper); line-height:1.6;">
              ${es
                ? `2 sesiones por semana. ${STRENGTH_RULES.es} Ninguna va el día antes de una sesión de calidad. <strong>Progresión:</strong> primero subes repeticiones (hasta el tope del rango) o haces la bajada más lenta; después subes el peso. En la semana 1 es normal un dolor muscular leve. Toca el nombre de un ejercicio para ver para qué sirve.`
                : `2 sessions a week. ${STRENGTH_RULES.en} Never the day before a quality session. <strong>Progression:</strong> first add reps (to the top of the range) or slow the lowering; then add weight. Mild soreness in week 1 is normal. Tap an exercise for its purpose.`}
            </p>
          </div>
        </div>`;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TRAINING LOAD SECTION — CTL/ATL/TSB chart + manual session entry
    // ═══════════════════════════════════════════════════════════════════════

    function renderLoadChart(curve, width = 540, height = 140) {
      if (!curve.length) return '';
      const recent = curve.slice(-56); // last 8 weeks max for readability
      const maxCTL = Math.max(...recent.map(c => Math.max(c.ctl, c.atl)), 10);
      const padding = 8;
      const chartW = width - padding * 2;
      const chartH = height - padding * 2;
      const stepX = chartW / Math.max(recent.length - 1, 1);

      const toPoints = (key) => recent.map((c, i) => {
        const x = padding + i * stepX;
        const y = padding + chartH - (c[key] / maxCTL) * chartH;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const ctlPoints = toPoints('ctl');
      const atlPoints = toPoints('atl');

      // TSB as filled area around zero baseline (using a secondary scale)
      const tsbVals = recent.map(c => c.tsb);
      const maxAbsTSB = Math.max(...tsbVals.map(Math.abs), 10);
      const tsbZeroY = padding + chartH / 2;
      const tsbScale = (chartH / 2) / maxAbsTSB;
      const tsbPoints = recent.map((c, i) => {
        const x = padding + i * stepX;
        const y = tsbZeroY - c.tsb * tsbScale;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      return `
        <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:${height}px; display:block;">
          <line x1="${padding}" y1="${tsbZeroY}" x2="${width-padding}" y2="${tsbZeroY}" stroke="var(--field-line)" stroke-width="1" stroke-dasharray="2,2" />
          <polyline points="${tsbPoints}" fill="none" stroke="var(--coyote-dim)" stroke-width="1.5" opacity="0.6" />
          <polyline points="${ctlPoints}" fill="none" stroke="var(--olive-bright)" stroke-width="2.5" />
          <polyline points="${atlPoints}" fill="none" stroke="var(--rust-bright)" stroke-width="1.5" opacity="0.8" />
        </svg>
      `;
    }

    function handleClaudePlanFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const textarea = document.getElementById('claudePlanInput');
        if (textarea) textarea.value = e.target.result;
        showToast(getLang() === 'es' ? '✓ Archivo cargado — revisa y presiona importar' : '✓ File loaded — review and press import');
      };
      reader.onerror = () => {
        showToast(getLang() === 'es' ? '✕ Error al leer el archivo' : '✕ Error reading file');
      };
      reader.readAsText(file);
      event.target.value = ''; // allow re-selecting the same file later
    }
