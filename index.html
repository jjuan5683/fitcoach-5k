      lines.push('');
      lines.push('## Sensaciones del Atleta');
      lines.push('');
      lines.push(mf.athleteNotes || ND);
      lines.push('');

      // ── EVALUACIÓN AUTOMÁTICA ─────────────────────────────────────────────
      lines.push('---');
      lines.push('');
      lines.push('## Evaluación Automática');
      lines.push('');
      lines.push(`**Estado Aeróbico:** ${autoEval.aerobicState}`);
      lines.push(`**Consistencia de Ritmo:** ${autoEval.consistencyLabel}`);
      lines.push(`**Recuperación Recomendada:** ${autoEval.recovery}`);
      lines.push(`**Próxima Sesión Recomendada:** ${autoEval.nextSession}`);
      lines.push('');

      // ── PLANEADO VS REAL ─────────────────────────────────────────────────
      if (linkedSession) {
        lines.push('---');
        lines.push('');
        lines.push('## Planeado vs Real');
        lines.push('');
        // Plan days imported without pace/distance targets carry pacePerMi = 0 and
        // targetDistM = 0. Printing those raw produced meaningless rows ("Distancia objetivo:
        // 0.00 mi", "Sub-pasos: 0/4") that read as a failed session rather than a plan day with
        // no targets set. Print only what actually exists, and say so when nothing does.
        const hasPaceTarget = linkedSession.pacePerMi > 0;
        const hasDistTarget = linkedSession.targetDistM > 0;
        const subs = linkedSession.substeps || [];
        const hasSubsteps = subs.length > 0 && subs.some(s => s.done !== undefined);

        if (hasPaceTarget) {
          lines.push(`**Pace objetivo:** ${fmtPace(linkedSession.pacePerMi)}`);
          const paceDelta = Math.round(t.avgPaceSecPerMi - linkedSession.pacePerMi);
          lines.push(`**Pace real:** ${fmtPace(t.avgPaceSecPerMi)} (${paceDelta >= 0 ? '+' : ''}${paceDelta}s/mi)`);
        } else {
          lines.push(`**Pace real:** ${fmtPace(t.avgPaceSecPerMi)}`);
        }
        if (hasDistTarget) {
          const tgtMi = linkedSession.targetDistM / 1609.344;
          lines.push(`**Distancia objetivo:** ${tgtMi.toFixed(2)} mi`);
          lines.push(`**Distancia real:** ${t.totalDistMi.toFixed(2)} mi (${(t.totalDistMi - tgtMi >= 0 ? '+' : '')}${(t.totalDistMi - tgtMi).toFixed(2)} mi)`);
        } else {
          lines.push(`**Distancia real:** ${t.totalDistMi.toFixed(2)} mi`);
        }
        if (hasSubsteps) {
          lines.push(`**Sub-pasos completados:** ${subs.filter(s=>s.done).length}/${subs.length}`);
        }
        if (!hasPaceTarget && !hasDistTarget) {
          lines.push('');
          lines.push(`> El día ${linkedSession.day} del plan no tiene pace ni distancia objetivo configurados, así que no hay comparación posible. Edita el día en la pestaña PLAN para fijar objetivos.`);
        }
        lines.push('');
      }

      lines.push('---');
      lines.push('');
      lines.push(`*Generado por FitCoach 5K — ${new Date().toISOString().split('T')[0]}*`);

      // Filter sections if in quick mode — keep only the essentials for a coach-facing summary
      if (reportMode === 'quick') {
        const QUICK_MODE_SECTIONS = ['Información General', 'Ruta Evaluada', 'Resultados de la Sesión',
                                      'Zonas Cardíacas', 'Splits Reales', 'Decoupling Aeróbico', 'Evaluación Automática'];
        const finalLines = [];
        let currentSection = null; // null = before first "##" header (metadata block, title) — always kept
        let sectionAllowed = true;
        let skippingCodeBlock = false;
        for (const line of lines) {
          // Never filter the leading metadata code block
          if (line.startsWith('```')) { skippingCodeBlock = !skippingCodeBlock; finalLines.push(line); continue; }
          if (skippingCodeBlock) { finalLines.push(line); continue; }
          if (line.startsWith('## ')) {
            currentSection = line.replace(/##/g, '').trim();
            sectionAllowed = QUICK_MODE_SECTIONS.some(s => currentSection.includes(s));
          }
          if (currentSection === null || sectionAllowed) finalLines.push(line);
        }
        return finalLines.join('\n');
      }

      return lines.join('\n');
    }

    // Build negative-split mile targets: start slightly conservative, finish strong.
    // Standard approach: first mile +3%, middle mile(s) at goal pace, last segment -3%.
    function buildNegativeSplitPlan(goalSec) {
      const goalPaceSec = goalSec / 3.10686; // sec/mi
      const miles = [
        { label: 'Mi 1', factor: 1.03, note: { en: 'Controlled start — resist the urge to go out fast', es: 'Salida controlada — resiste el impulso de salir rápido' } },
        { label: 'Mi 2', factor: 1.00, note: { en: 'Settle into goal pace', es: 'Asiéntate en el pace objetivo' } },
        { label: 'Mi 3', factor: 0.99, note: { en: 'Hold form, stay relaxed', es: 'Mantén la forma, relajado' } },
        { label: 'Final 0.1', factor: 0.95, note: { en: 'Empty the tank', es: 'Vacía el tanque' } }
      ];
      return miles.map(m => ({ ...m, paceSec: Math.round(goalPaceSec * m.factor) }));
    }

    function buildHydrationPlan(weightLb, estimatedMinutes, tempF) {
      // ACSM guidance: 16-24oz/hr in heat for runs over 30 min; pre-hydrate 16-20oz 2-3hr before
      const heatFactor = (tempF && tempF > 85) ? 1.15 : 1.0;
      const ozPerHour = Math.round(20 * heatFactor);
      const totalOz = Math.round((estimatedMinutes / 60) * ozPerHour);
      return {
        preRaceOz: 16,
        preRaceHoursBefore: 2,
        duringOzPerHour: ozPerHour,
        totalDuringOz: totalOz,
        electrolyteNote: estimatedMinutes > 45
      };
    }

    function buildRaceStrategyData() {
      const profile = state.profile;
      if (!profile) return null;
      const lang = getLang();
      const isEs = lang === 'es';
      const goalPaceSecPerMi = profile.goalFiveKSec / 3.10686;
      const estimatedMinutes = Math.ceil(profile.goalFiveKSec / 60) + 5; // buffer for warmup-adjacent pacing
      const splits = buildNegativeSplitPlan(profile.goalFiveKSec);
      const hydration = buildHydrationPlan(profile.weightLb, profile.goalFiveKSec / 60, 88);
      const daysOut = daysUntil(profile.raceDateISO);

      return {
        athleteName: profile.name,
        raceDateISO: profile.raceDateISO,
        daysOut,
        goalTimeStr: secToMMSS(profile.goalFiveKSec),
        goalPaceStr: fmtPace(goalPaceSecPerMi),
        lthr: profile.lthr,
        splits,
        hydration,
        isEs
      };
    }

    function exportFullBackup() {
      const payload = {
        app: 'FitCoach5K_Tactical',
        schemaVersion: SCHEMA_VERSION,
        exportedAt: new Date().toISOString(),
        state: state

    function triggerBackupImport() {
      document.getElementById('backupImportInput')?.click();
    }

    async function handleBackupImport(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const text = await readFileAsText(file);
        const parsed = JSON.parse(text);
        // Accept either the wrapped payload or a raw state object.
        const incoming = parsed.state ? parsed.state : parsed;
        if (!incoming || typeof incoming !== 'object' || (!incoming.profile && !incoming.tcxSessions)) {
          showToast(getLang()==='es' ? '✕ Archivo de backup inválido' : '✕ Invalid backup file');
          event.target.value = '';
          return;
        }
        const confirmMsg = getLang()==='es'
          ? 'Esto REEMPLAZARÁ todos tus datos actuales (perfil, plan, actividades, medidas) con los del backup. ¿Continuar?'
          : 'This will REPLACE all your current data (profile, plan, activities, measurements) with the backup. Continue?';
        if (!confirm(confirmMsg)) { event.target.value = ''; return; }
        state = { ...DEFAULT_STATE, ...incoming, schemaVersion: SCHEMA_VERSION };
        saveState();
        currentView = state.profile?.onboardingComplete ? 'home' : 'onboarding';
        detailOverlay = null;
        _scrollToTopNextRender = true;
        render();
        showToast(getLang()==='es' ? '✓ Backup restaurado' : '✓ Backup restored');
      } catch (err) {
        console.error('Backup import error:', err);
        showToast(getLang()==='es' ? '✕ No se pudo leer el backup' : '✕ Could not read backup');
      }
      event.target.value = '';
    }

    // ── 2. EXCEL EXPORTS (via HTML-table .xls — opens natively in Excel, no CDN dependency) ──
    function htmlTableToXls(title, headers, rows) {
      const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const thead = `<tr>${headers.map(h=>`<th style="background:#3d5a1f;color:#fff;font-weight:bold;border:1px solid #999;padding:4px;">${esc(h)}</th>`).join('')}</tr>`;
      const tbody = rows.map(r => `<tr>${r.map(c=>`<td style="border:1px solid #ccc;padding:4px;">${esc(c)}</td>`).join('')}</tr>`).join('');
      return `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><title>${esc(title)}</title></head>`
        + `<body><table>${thead}${tbody}</table></body></html>`;
    }

    function exportActivitiesExcel() {
      if (!state.tcxSessions.length) { showToast(getLang()==='es'?'Sin actividades para exportar':'No activities to export'); return; }
      const es = getLang()==='es';
      const headers = es
        ? ['Fecha','Tipo','Distancia (mi)','Tiempo','Pace (/mi)','FC prom','FC máx','Grado','VDOT','Decoupling %','Cadencia SPM','Temp °F','Humedad %','RPE','Notas']
        : ['Date','Type','Distance (mi)','Time','Pace (/mi)','Avg HR','Max HR','Grade','VDOT','Decoupling %','Cadence SPM','Temp °F','Humidity %','RPE','Notes'];
      const sorted = [...state.tcxSessions].sort((a,b)=>(a.dateISO||'').localeCompare(b.dateISO||''));
      const rows = sorted.map(s => {
        const mf = s.manualFields || {};
        const a = s.analysis || {};
        const temp = s.hasTempData ? s.avgTempF : (mf.wxAvgTempF ?? '');
        return [
          s.dateISO,
          mf.trainingType ? (SESSION_TYPE_LABELS[mf.trainingType] || mf.trainingType) : '',
          (s.totalDistMi||0).toFixed(2),
          secToHHMMSS(s.totalTimeSec),
          secToMMSS(s.avgPaceSecPerMi),
          s.avgHR ?? '',
          s.maxHR ?? '',
          a.sessionGrade ?? '',
          a.vdot ?? '',
          a.aerobicDecouplingPct != null ? a.aerobicDecouplingPct.toFixed(1) : '',
          s.avgCadenceSpm ?? '',
          temp,
          mf.humidity ?? '',
          mf.rpe ?? '',
          (mf.athleteNotes || mf.sessionGoal || '').replace(/\n/g,' ')
        ];
      });
      const xls = htmlTableToXls('FitCoach Activities', headers, rows);
      downloadBlob('\ufeff'+xls, `fitcoach_activities_${todayISO()}.xls`, 'application/vnd.ms-excel');
      showToast(es ? '✓ Excel de actividades descargado' : '✓ Activities Excel downloaded');
    }

    function exportBodyMeasurementsExcel() {
      if (!state.bodyMeasurements.length) { showToast(getLang()==='es'?'Sin medidas para exportar':'No measurements to export'); return; }
      const es = getLang()==='es';
      const measCols = BODY_MEASURE_DEFS.flatMap(def => {
        const name = def.label[es ? 'es' : 'en'] || def.label.en;
        return [`${name} (cm)`, `${name} (${es?'pulg':'in'})`];
      });
      const headers = [
        es ? 'Fecha' : 'Date',
        es ? 'Peso (lb)' : 'Weight (lb)',
        ...measCols,
        es ? 'Notas' : 'Notes'
      ];
      const sorted = [...state.bodyMeasurements].sort((a,b)=>(a.dateISO||'').localeCompare(b.dateISO||''));
      const rows = sorted.map(m => [
        m.dateISO,
        (m.weightLb ?? '').toString(),
        ...BODY_MEASURE_DEFS.flatMap(def => {
          const cm = m[def.field];
          return [cm != null ? cm.toFixed(1) : '', cm != null ? (cm/2.54).toFixed(1) : ''];
        }),
        (m.notes||'').replace(/\n/g,' ')
      ]);
      const xls = htmlTableToXls('FitCoach Body Measurements', headers, rows);
      downloadBlob('\ufeff'+xls, `fitcoach_body_measurements_${todayISO()}.xls`, 'application/vnd.ms-excel');
      showToast(es ? '✓ Excel de medidas descargado' : '✓ Measurements Excel downloaded');
    }

    // ── 3. WEEKLY / MONTHLY PDF REPORT (printable, via pdf-lib) ──
    async function generatePeriodReportPDF(period) {
      // period: 'week' | 'month'
      if (!window.PDFLib) { showToast(getLang()==='es'?'✕ Librería PDF no cargó':'✕ PDF library not loaded'); return; }
      const es = getLang()==='es';
      const days = period === 'month' ? 30 : 7;
      const cut = new Date(); cut.setDate(cut.getDate() - days);
      const cutISO = cut.toISOString().split('T')[0];
      const acts = state.tcxSessions.filter(s => (s.dateISO||'') >= cutISO).sort((a,b)=>(a.dateISO||'').localeCompare(b.dateISO||''));
      if (!acts.length) { showToast(es?'Sin actividades en el periodo':'No activities in this period'); return; }

      const { PDFDocument, rgb, StandardFonts } = window.PDFLib;
      try {
        const doc = await PDFDocument.create();
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const fontBold = await doc.embedFont(StandardFonts.HelveticaBold);
        let page = doc.addPage([612, 792]);
        const { width, height } = page.getSize();
        const colFieldDark = rgb(0.067,0.082,0.051), colOlive = rgb(0.239,0.353,0.122),
              colCoyote = rgb(0.788,0.663,0.380), colPaper = rgb(0.16,0.16,0.14),
              colDim = rgb(0.45,0.45,0.42), colBlue = rgb(0.2,0.5,0.75), colAmber = rgb(0.85,0.6,0.15);
        const marginX = 50; const contentW = width - marginX*2;
        let y = height - 50;

        // Header
        page.drawRectangle({ x:0, y:height-80, width, height:80, color: colFieldDark });
        page.drawRectangle({ x:0, y:height-82, width, height:3, color: colCoyote });
        page.drawText(es ? (period==='month'?'REPORTE MENSUAL DE ENTRENAMIENTO':'REPORTE SEMANAL DE ENTRENAMIENTO')
                          : (period==='month'?'MONTHLY TRAINING REPORT':'WEEKLY TRAINING REPORT'),
          { x: marginX, y: height-38, size: 16, font: fontBold, color: rgb(0.91,0.89,0.85) });
        page.drawText(`${state.profile?.name || 'Athlete'} · ${cutISO} → ${todayISO()}`,
          { x: marginX, y: height-58, size: 10, font, color: colCoyote });
        y = height - 105;

        // Summary stats
        const totMi = acts.reduce((s,x)=>s+(x.totalDistMi||0),0);
        const totSec = acts.reduce((s,x)=>s+(x.totalTimeSec||0),0);
        const avgPace = acts.length ? acts.reduce((s,x)=>s+(x.avgPaceSecPerMi||0),0)/acts.length : 0;
        const avgHR = acts.filter(x=>x.avgHR).length ? Math.round(acts.reduce((s,x)=>s+(x.avgHR||0),0)/acts.filter(x=>x.avgHR).length) : 0;
        page.drawRectangle({ x:marginX, y:y-52, width:contentW, height:56, color:rgb(0.95,0.95,0.93), borderColor:colOlive, borderWidth:1 });
        const bw = contentW/4;
        const stat = (label,val,i) => {
          page.drawText(label, { x:marginX+i*bw+10, y:y-14, size:7.5, font, color:colDim });
          page.drawText(val, { x:marginX+i*bw+10, y:y-34, size:14, font:fontBold, color:colOlive });
        };
        stat(es?'SESIONES':'SESSIONS', String(acts.length), 0);
        stat(es?'DISTANCIA':'DISTANCE', totMi.toFixed(1)+' mi', 1);
        stat(es?'TIEMPO':'TIME', secToHHMMSS(totSec), 2);
        stat(es?'PACE PROM':'AVG PACE', secToMMSS(avgPace), 3);
        y -= 78;

        // Section header helper
        const sectionHeader = (text) => {
          page.drawRectangle({ x:marginX, y:y-4, width:contentW, height:18, color:colOlive });
          page.drawText(text, { x:marginX+8, y:y, size:10, font:fontBold, color:rgb(0.91,0.89,0.85) });
          y -= 26;
        };
        const ensureSpace = (needed) => {
          if (y < needed) { page = doc.addPage([612,792]); y = height - 60; }
        };

        // Activity table
        sectionHeader(es?'ACTIVIDADES':'ACTIVITIES');
        page.drawText(es?'Fecha':'Date', { x:marginX, y, size:8, font:fontBold, color:colDim });
        page.drawText(es?'Tipo':'Type', { x:marginX+70, y, size:8, font:fontBold, color:colDim });
        page.drawText(es?'Dist':'Dist', { x:marginX+160, y, size:8, font:fontBold, color:colDim });
        page.drawText('Pace', { x:marginX+210, y, size:8, font:fontBold, color:colDim });
        page.drawText('FC', { x:marginX+270, y, size:8, font:fontBold, color:colDim });
        page.drawText(es?'Grado':'Grade', { x:marginX+310, y, size:8, font:fontBold, color:colDim });
        y -= 14;
        acts.forEach(s => {
          ensureSpace(80);
          const mf = s.manualFields || {};
          page.drawText(s.dateISO || '', { x:marginX, y, size:8.5, font, color:colPaper });
          page.drawText((mf.trainingType ? (SESSION_TYPE_LABELS[mf.trainingType]||mf.trainingType) : '—').slice(0,14), { x:marginX+70, y, size:8.5, font, color:colPaper });
          page.drawText((s.totalDistMi||0).toFixed(2), { x:marginX+160, y, size:8.5, font, color:colPaper });
          page.drawText(secToMMSS(s.avgPaceSecPerMi), { x:marginX+210, y, size:8.5, font, color:colPaper });
          page.drawText(String(s.avgHR||'—'), { x:marginX+270, y, size:8.5, font, color:colPaper });
          page.drawText(s.analysis?.sessionGrade || '—', { x:marginX+310, y, size:8.5, font:fontBold, color:colCoyote });
          y -= 14;
        });
        y -= 12;

        // Trend verdict
        ensureSpace(120);
        sectionHeader(es?'TENDENCIA':'TREND');
        const paced = acts.filter(x=>x.avgPaceSecPerMi>0);
        if (paced.length >= 3) {
          const half = Math.floor(paced.length/2);
          const firstP = paced.slice(0,half).reduce((s,x)=>s+x.avgPaceSecPerMi,0)/half;
          const lastP = paced.slice(half).reduce((s,x)=>s+x.avgPaceSecPerMi,0)/paced.slice(half).length;
          const improved = lastP < firstP;
          const pct = ((lastP-firstP)/firstP*100);
          const line = es
            ? `Pace ${improved?'mejorando':'retrocediendo'}: ${secToMMSS(firstP)} → ${secToMMSS(lastP)}/mi (${pct>0?'+':''}${pct.toFixed(1)}%).`
            : `Pace ${improved?'improving':'declining'}: ${secToMMSS(firstP)} → ${secToMMSS(lastP)}/mi (${pct>0?'+':''}${pct.toFixed(1)}%).`;
          page.drawText(line, { x:marginX, y, size:9, font, color: improved?colBlue:colAmber, maxWidth:contentW });
          y -= 18;
        } else {
          page.drawText(es?'Registra más sesiones para una tendencia confiable.':'Log more sessions for a reliable trend.', { x:marginX, y, size:9, font, color:colDim });
          y -= 18;
        }

        // Days to race
        const daysLeft = daysUntil(state.profile?.raceDateISO);
        page.drawText(es?`Días para la carrera (16 AGO 2026): ${daysLeft}`:`Days to race (16 AUG 2026): ${daysLeft}`, { x:marginX, y, size:9, font:fontBold, color:colPaper });
        y -= 30;

        // Footer
        page.drawText(`FitCoach 5K Tactical · ${new Date().toLocaleDateString()}`, { x:marginX, y:30, size:7, font, color:colDim });

        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), `fitcoach_report_${period}_${todayISO()}.pdf`, 'application/pdf');
        showToast(es?'✓ Reporte PDF descargado':'✓ PDF report downloaded');
      } catch (err) {
        console.error('Period report error:', err);
        showToast(getLang()==='es'?'✕ Error al generar reporte':'✕ Report generation failed');
      }
    }

    // Removes plan entries left over from the broken import (before the day/date-matching fix):
    // entries with no valid dateISO at all, and duplicate entries sharing the same dateISO
    // (keeps the one with notes/a real type, i.e. the actual imported session, over a stray
    // auto-generated placeholder).
    function cleanDuplicatePlanEntries() {
      const es = getLang() === 'es';
      const before = state.plan.length;

      const valid = state.plan.filter(s => s.dateISO && /^\d{4}-\d{2}-\d{2}$/.test(s.dateISO));
      const byDate = {};
      valid.forEach(s => {
        const existing = byDate[s.dateISO];
        if (!existing) { byDate[s.dateISO] = s; return; }
        // Prefer the entry with notes (came from an import) or, failing that, completed status.
        const score = (x) => (x.notes ? 2 : 0) + (x.completed ? 1 : 0);
        if (score(s) > score(existing)) byDate[s.dateISO] = s;
      });

      state.plan = Object.values(byDate).sort((a, b) => a.dateISO.localeCompare(b.dateISO));
      const removed = before - state.plan.length;
      saveState();
      render();
      showToast(es ? `✓ ${removed} entradas duplicadas eliminadas (quedan ${state.plan.length})` : `✓ ${removed} duplicate entries removed (${state.plan.length} left)`);
    }

    // ── Data Management card (rendered in MORE tab) ──
    function renderDataManagementCard() {
      const es = getLang()==='es';
      const sizeKB = getStorageSizeKB();
      const sizePct = Math.min(100, Math.round((sizeKB/5120)*100)); // ~5MB cap
      const sizeColor = sizePct > 80 ? 'var(--rust)' : sizePct > 50 ? 'var(--signal-amber)' : 'var(--signal-blue)';
      const lastBackup = state.lastBackupISO;
      const daysSinceBackup = lastBackup ? Math.round((Date.now()-new Date(lastBackup+'T12:00:00').getTime())/86400000) : null;
      const backupStale = daysSinceBackup == null || daysSinceBackup >= 7;

      return `
        <div class="card">
          <div class="card-title">${es?'GESTIÓN DE DATOS':'DATA MANAGEMENT'}</div>

          <div style="background:${backupStale?'rgba(166,69,58,0.12)':'rgba(61,90,31,0.12)'}; border:1px solid ${backupStale?'var(--rust)':'var(--olive)'}; border-radius:6px; padding:10px; margin-bottom:12px;">
            <div style="font-size:11px; color:${backupStale?'var(--rust)':'var(--olive-bright)'}; font-weight:600; margin-bottom:4px;">
              ${backupStale ? (es?'⚠ Respaldo recomendado':'⚠ Backup recommended') : (es?'✓ Respaldo al día':'✓ Backup up to date')}
            </div>
            <div style="font-size:10px; color:var(--paper-dim);">
              ${lastBackup ? (es?`Último backup: ${lastBackup} (hace ${daysSinceBackup} días)`:`Last backup: ${lastBackup} (${daysSinceBackup} days ago)`) : (es?'Nunca has exportado un backup. Tus datos viven solo en este navegador.':'You have never exported a backup. Your data lives only in this browser.')}
            </div>
          </div>

          <button class="btn btn-primary" style="width:100%; margin-bottom:8px;" onclick="exportFullBackup()">
            ${es?'⬇ Exportar Backup Completo (.json)':'⬇ Export Full Backup (.json)'}
          </button>
          <button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" onclick="triggerBackupImport()">
            ${es?'⬆ Importar / Restaurar Backup':'⬆ Import / Restore Backup'}
          </button>
          <input type="file" id="backupImportInput" accept=".json" style="display:none;" onchange="handleBackupImport(event)" />

          <button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" onclick="cleanDuplicatePlanEntries()">
            ${es?`🧹 Limpiar plan duplicado (${state.plan.length} entradas)`:`🧹 Clean duplicate plan (${state.plan.length} entries)`}
          </button>

          <div style="border-top:1px solid var(--field-line); padding-top:10px; margin-bottom:6px;">
            <div style="font-size:11px; color:var(--paper-dim); margin-bottom:8px;">${es?'Exportar a hoja de cálculo':'Export to spreadsheet'}</div>
            <div style="display:flex; gap:6px; margin-bottom:8px;">
              <button class="btn btn-secondary" style="flex:1; font-size:11px;" onclick="exportActivitiesExcel()">${es?'Actividades .xls':'Activities .xls'}</button>
              <button class="btn btn-secondary" style="flex:1; font-size:11px;" onclick="exportBodyMeasurementsExcel()">${es?'Medidas .xls':'Measures .xls'}</button>
            </div>
          </div>

          <div style="border-top:1px solid var(--field-line); padding-top:10px; margin-bottom:6px;">
            <div style="font-size:11px; color:var(--paper-dim); margin-bottom:8px;">${es?'Reporte PDF imprimible':'Printable PDF report'}</div>
            <div style="display:flex; gap:6px; margin-bottom:8px;">
              <button class="btn btn-secondary" style="flex:1; font-size:11px;" onclick="generatePeriodReportPDF('week')">${es?'Semanal PDF':'Weekly PDF'}</button>
              <button class="btn btn-secondary" style="flex:1; font-size:11px;" onclick="generatePeriodReportPDF('month')">${es?'Mensual PDF':'Monthly PDF'}</button>
            </div>
          </div>

          <div style="border-top:1px solid var(--field-line); padding-top:10px;">
            <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--paper-dim); margin-bottom:4px;">
              <span>${es?'Almacenamiento usado':'Storage used'}</span>
              <span>${sizeKB} KB / ~5 MB</span>
            </div>
            <div style="height:6px; background:var(--field-surface); border-radius:3px; overflow:hidden;">
              <div style="height:100%; width:${sizePct}%; background:${sizeColor};"></div>
            </div>
            ${sizePct > 80 ? `<p style="font-size:10px; color:var(--rust); margin-top:6px;">${es?'Espacio casi lleno — exporta backup y borra actividades viejas.':'Nearly full — export a backup and delete old activities.'}</p>` : ''}
          </div>

          <p style="font-size:10px; color:var(--paper-dim); margin-top:10px; line-height:1.4;">
            ${es
              ? 'Tus datos se guardan solo en este navegador. Exporta un backup .json regularmente — es la única forma de recuperarlos si cambias de dispositivo o limpias el caché. El .json restaura TODO; los .xls y PDF son para análisis/archivo.'
              : 'Your data is stored only in this browser. Export a .json backup regularly — it is the only way to recover it if you switch devices or clear cache. The .json restores EVERYTHING; the .xls and PDF are for analysis/archiving.'}
          </p>
        </div>`;
    }

    function resetApp() {
      if (confirm(t('confirm_reset'))) {
        state = DEFAULT_STATE;
        localStorage.removeItem(STORAGE_KEY);
        currentView = 'onboarding';
        currentStep = 0;
        onboardingData = {};
        detailOverlay = null;
        mdModalContent = null;
        mdModalActivityId = null;
        render();
        showToast(t('toast_reset_complete'));
      }
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // When true, the next render() scrolls the main pane to top (used only on genuine
    // view/tab changes). Otherwise scroll position is preserved so a button click that
    // triggers a re-render leaves the user where they were.
    let _scrollToTopNextRender = false;

    // Fields save on blur, and saving triggers render(), which rebuilds the whole #app
    // subtree — so the element the user was typing in gets destroyed and mobile keyboards
    // have nothing to "Next" into. This intercepts Enter/"Next", remembers where focus should
    // land, blurs (which fires the normal save+render), then refocuses the new element —
    // all inside the same keydown call stack so the on-screen keyboard never has to close.
    function handleEnterNext(event, nextFieldId) {
      const isEnter = event.key === 'Enter' || event.keyCode === 13 || event.which === 13;
      if (!isEnter) return;
      event.preventDefault();
      _focusAfterRender = nextFieldId;
      event.target.blur();
    }

    function render() {
      const mainEl = document.querySelector('main');
      const detailEl = document.querySelector('.detail-body');
      const savedMain = mainEl ? mainEl.scrollTop : 0;
      const savedDetail = detailEl ? detailEl.scrollTop : 0;
      document.getElementById('app').innerHTML = renderAppShell();
      const newMain = document.querySelector('main');
      const newDetail = document.querySelector('.detail-body');
      if (newMain) newMain.scrollTop = _scrollToTopNextRender ? 0 : savedMain;
      // The detail overlay has its own scroll container; restore it too so checkboxes
      // and buttons inside a workout/activity don't bounce the user to the top.
      if (newDetail) newDetail.scrollTop = _scrollToTopNextRender ? 0 : savedDetail;
      _scrollToTopNextRender = false;
      // Charts live in <canvas> elements — must be initialized as real JS calls after
      // the DOM update, since innerHTML does not execute embedded <script> tags.
      if (currentView === 'stats' && statsTab === 'charts') {
        setTimeout(initStatsCharts, 0);
      }
      if (currentView === 'more') {
        setTimeout(initWeightChart, 0);
        setTimeout(initBodyCircChart, 0);
      }
      // Refocus the field an Enter/"Next" press was navigating to (see handleEnterNext above).
      if (_focusAfterRender) {
        const nextId = _focusAfterRender;
        _focusAfterRender = null;
        const el = document.getElementById(nextId);
        if (el) { el.focus(); if (el.select) { try { el.select(); } catch (e) {} } }
      }
    }

    // ── PWA: offline support via a real service worker file (sw.js) ──
    // Only works over http(s) (not file://). Caches the app shell so it opens offline.
    // Weather fetch still needs a connection; everything else works offline.
    (function registerSW() {
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration skipped:', err));
    })();

    render();

    // One-time backup reminder: if the user has real data but no recent backup, nudge them.
    (function backupReminder() {
      const hasData = (state.tcxSessions?.length || 0) > 0 || state.profile;
      if (!hasData) return;
      const last = state.lastBackupISO;
      const daysSince = last ? Math.round((Date.now() - new Date(last + 'T12:00:00').getTime()) / 86400000) : 999;
      if (daysSince >= 7) {
        setTimeout(() => {
          try {
            showToast(getLang() === 'es'
              ? '💾 Recuerda exportar un backup (Más → Gestión de Datos)'
              : '💾 Remember to export a backup (More → Data Management)');
          } catch (_) {}
        }, 2500);
      }
    })();
  </script>
</body>
</html>
